<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PTFS Tracker</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #17212b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .message {
            text-align: center;
            padding: 20px;
        }

        .message h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .message p {
            color: #aaa;
        }
    </style>
</head>

<body>

<div id="map">
    <div class="message">
        <h1>✈️ PTFS Tracker</h1>
        <p>Loading PTFS map...</p>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>vPilot Reimagined</title>

<style>

* {
    box-sizing: border-box;
}

html, body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #0b1118;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

}


/* =========================
   TOP BAR
========================= */

#topbar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    background:
        rgba(9,14,21,0.96);

    backdrop-filter:
        blur(14px);

    border-bottom:
        1px solid #263442;

    display: flex;

    align-items: center;

    padding:
        0 14px;

    z-index: 1000;

}


.logo {

    color: white;

    font-size: 17px;

    font-weight: 700;

    white-space: nowrap;

    margin-right: 18px;

}


.logo span {

    color: #4fa3ff;

}


/* =========================
   NAVIGATION
========================= */

.nav {

    display: flex;

    gap: 5px;

}


.nav button {

    background:
        transparent;

    border: 1px solid
        transparent;

    color: #9baaba;

    padding:
        8px 11px;

    border-radius: 7px;

    font-size: 13px;

    cursor: pointer;

}


.nav button:hover {

    background: #162331;

    color: white;

}


.nav button.active {

    background:
        #1d4f7a;

    border-color:
        #347ab5;

    color: white;

}


/* =========================
   RIGHT BUTTONS
========================= */

.topActions {

    margin-left: auto;

    display: flex;

    gap: 7px;

}


.action {

    background:
        #131e29;

    border:
        1px solid #334555;

    color: #dce6ef;

    border-radius: 7px;

    padding:
        8px 10px;

    font-size: 13px;

}


/* =========================
   MAP
========================= */

#map {

    position: fixed;

    top: 64px;

    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background:
        #111923;

    touch-action: none;

}


#mapImage {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 1000px;

    transform-origin:
        center center;

    user-select: none;

    pointer-events: none;

}


/* =========================
   AIRCRAFT TEST MARKERS
========================= */

.aircraft {

    position: absolute;

    color: white;

    font-size: 22px;

    transform:
        translate(-50%, -50%);

    cursor: pointer;

    pointer-events: auto;

    z-index: 20;

}


.aircraftLabel {

    position: absolute;

    left: 22px;

    top: -3px;

    white-space: nowrap;

    background:
        rgba(8,13,19,.9);

    border:
        1px solid #334454;

    border-radius: 5px;

    padding:
        3px 6px;

    font-size: 11px;

}


/* =========================
   AIRCRAFT INFO PANEL
========================= */

#aircraftPanel {

    position: fixed;

    right: 18px;

    top: 82px;

    width: 310px;

    max-width:
        calc(100% - 36px);

    background:
        rgba(10,16,23,.97);

    border:
        1px solid #334454;

    border-radius: 12px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    color: white;

    z-index: 900;

    display: none;

    overflow: hidden;

}


.panelHeader {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        12px 14px;

    border-bottom:
        1px solid #263442;

}


.panelHeader button {

    background: transparent;

    border: none;

    color: #9aa8b6;

    font-size: 20px;

}


.aircraftPhoto {

    height: 130px;

    background:
        linear-gradient(
            135deg,
            #172432,
            #0e151d
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 60px;

}


.panelBody {

    padding: 14px;

}


.callsign {

    font-size: 22px;

    font-weight: 700;

}


.airline {

    color: #9caab8;

    margin-top: 3px;

}


.aircraftType {

    color: #718191;

    font-size: 13px;

    margin-top: 3px;

}


.stats {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-top: 16px;

}


.stat {

    background:
        #131e29;

    border:
        1px solid #263645;

    border-radius: 7px;

    padding: 9px;

}


.statTitle {

    color: #718191;

    font-size: 10px;

    text-transform:
        uppercase;

}


.statValue {

    color: white;

    font-size: 15px;

    font-weight: 600;

    margin-top: 3px;

}


.route {

    margin-top: 12px;

    background:
        #131e29;

    border:
        1px solid #263645;

    border-radius: 7px;

    padding: 10px;

}


.routeTitle {

    color: #718191;

    font-size: 10px;

    text-transform:
        uppercase;

}


.routeValue {

    margin-top: 4px;

    font-weight: 600;

}


.flightButton {

    width: 100%;

    margin-top: 12px;

    padding: 10px;

    border-radius: 7px;

    border:
        1px solid #397eb8;

    background:
        #1d4f7a;

    color: white;

}


/* =========================
   SEARCH
========================= */

#searchBox {

    position: fixed;

    top: 78px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 320px;

    max-width:
        calc(100% - 30px);

    z-index: 1000;

    display: none;

}


#searchBox input {

    width: 100%;

    background:
        rgba(10,16,23,.97);

    border:
        1px solid #405264;

    color: white;

    border-radius: 8px;

    padding:
        11px 13px;

    outline: none;

}


/* =========================
   ZOOM
========================= */

.controls {

    position: fixed;

    right: 15px;

    bottom: 18px;

    z-index: 500;

    display: flex;

    flex-direction: column;

    gap: 6px;

}


.controls button {

    width: 44px;

    height: 44px;

    background:
        rgba(10,16,23,.94);

    border:
        1px solid #3a4d5f;

    border-radius: 8px;

    color: white;

    font-size: 21px;

}


#zoom {

    position: fixed;

    right: 15px;

    bottom: 165px;

    z-index: 500;

    background:
        rgba(10,16,23,.9);

    color: #9ca9b6;

    padding:
        5px 8px;

    border-radius: 5px;

    font-size: 11px;

}


@media(max-width:700px) {

    .logo {

        font-size: 14px;

        margin-right: 7px;

    }

    .nav button {

        padding:
            7px 7px;

        font-size: 11px;

    }

    .action {

        padding:
            7px;

        font-size: 11px;

    }

}


</style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div id="topbar">


    <div class="logo">

        ✈️ vPilot <span>Reimagined</span>

    </div>


    <div class="nav">

        <button
        class="active"
        onclick="setMode(this)">

            🌍 World

        </button>


        <button
        onclick="setMode(this)">

            📡 Enroute

        </button>


        <button
        onclick="setMode(this)">

            🛬 Charts

        </button>

    </div>


    <div class="topActions">

        <button
        class="action"
        onclick="toggleSearch()">

            🔍

        </button>


        <button
        class="action"
        onclick="alert('Flight Planner coming next!')">

            📝

        </button>

    </div>

</div>


<!-- =========================
     SEARCH
========================= -->

<div id="searchBox">

    <input
    type="text"
    placeholder="Search callsign or airport...">

</div>


<!-- =========================
     MAP
========================= -->

<div id="map">

    <img
    id="mapImage"

    src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"

    alt="PTFS Map">


    <!-- TEST AIRCRAFT -->

    <div
    class="aircraft"
    style="left:55%;top:42%;"
    onclick="showAircraft()">

        ✈️

        <div class="aircraftLabel">

            UAE123

        </div>

    </div>


</div>


<!-- =========================
     AIRCRAFT PANEL
========================= -->

<div id="aircraftPanel">


    <div class="panelHeader">

        <strong>
            Aircraft
        </strong>

        <button
        onclick="closeAircraft()">

            ×

        </button>

    </div>


    <div class="aircraftPhoto">

        ✈️

    </div>


    <div class="panelBody">


        <div class="callsign">

            UAE123

        </div>


        <div class="airline">

            Emirates

        </div>


        <div class="aircraftType">

            Boeing 777-300ER

        </div>


        <div class="stats">


            <div class="stat">

                <div class="statTitle">
                    Altitude
                </div>

                <div class="statValue">
                    FL350
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Speed
                </div>

                <div class="statValue">
                    472 kt
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Heading
                </div>

                <div class="statValue">
                    274°
                </div>

            </div>


            <div class="stat">

                <div class="statTitle">
                    Squawk
                </div>

                <div class="statValue">
                    4201
                </div>

            </div>


        </div>


        <div class="route">

            <div class="routeTitle">
                Route
            </div>

            <div class="routeValue">

                IRFD → IPPH

            </div>

        </div>


        <button
        class="flightButton">

            🟣 View Flight Plan

        </button>


    </div>

</div>


<!-- =========================
     ZOOM
========================= -->

<div id="zoom">

    100%

</div>


<div class="controls">

    <button onclick="zoomIn()">
        +
    </button>

    <button onclick="zoomOut()">
        −
    </button>

    <button onclick="resetMap()">
        ⟳
    </button>

</div>


<script>


/* =========================
   VARIABLES
========================= */

const map =
document.getElementById("map");

const image =
document.getElementById("mapImage");

const zoomText =
document.getElementById("zoom");

let scale = 1;

let x = 0;

let y = 0;

let pointers = new Map();

let lastX = 0;

let lastY = 0;

let lastDistance = null;


/* =========================
   NAVIGATION
========================= */

function setMode(button) {

    document
    .querySelectorAll(".nav button")
    .forEach(btn =>
        btn.classList.remove("active")
    );

    button.classList.add("active");

}


/* =========================
   SEARCH
========================= */

function toggleSearch() {

    const box =
        document.getElementById(
            "searchBox"
        );

    box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";

}


/* =========================
   AIRCRAFT PANEL
========================= */

function showAircraft() {

    document
    .getElementById(
        "aircraftPanel"
    )
    .style.display = "block";

}


function closeAircraft() {

    document
    .getElementById(
        "aircraftPanel"
    )
    .style.display = "none";

}


/* =========================
   MAP
========================= */

function updateMap() {

    image.style.transform =

        `translate(-50%,-50%)
         translate(${x}px,${y}px)
         scale(${scale})`;

    zoomText.textContent =

        Math.round(scale*100)
        + "%";

}


function zoomAt(
    newScale,
    cx,
    cy
) {

    scale =
        Math.max(
            .5,
            Math.min(5,newScale)
        );

    updateMap();

}


function zoomIn() {

    zoomAt(
        scale*1.3
    );

}


function zoomOut() {

    zoomAt(
        scale*.77
    );

}


function resetMap() {

    scale = 1;

    x = 0;

    y = 0;

    updateMap();

}


/* =========================
   TOUCH / MOUSE
========================= */

map.addEventListener(
"pointerdown",
event => {

    pointers.set(
        event.pointerId,
        {
            x:event.clientX,
            y:event.clientY
        }
    );

    map.setPointerCapture(
        event.pointerId
    );


    if(pointers.size === 1) {

        lastX =
            event.clientX;

        lastY =
            event.clientY;

    }


    if(pointers.size === 2) {

        const p =
            [...pointers.values()];

        lastDistance =
            distance(
                p[0],
                p[1]
            );

    }

});


map.addEventListener(
"pointermove",
event => {

    if(
        !pointers.has(
            event.pointerId
        )
    )
        return;


    pointers.set(
        event.pointerId,
        {
            x:event.clientX,
            y:event.clientY
        }
    );


    if(pointers.size === 1) {

        x +=
            event.clientX-lastX;

        y +=
            event.clientY-lastY;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        updateMap();

    }


    if(pointers.size === 2) {

        const p =
            [...pointers.values()];

        const d =
            distance(
                p[0],
                p[1]
            );


        if(lastDistance) {

            scale *=
                d/lastDistance;

            scale =
                Math.max(
                    .5,
                    Math.min(5,scale)
                );

            updateMap();

        }


        lastDistance = d;

    }

});


map.addEventListener(
"pointerup",
event => {

    pointers.delete(
        event.pointerId
    );

    if(pointers.size < 2)

        lastDistance = null;

});


function distance(a,b) {

    const dx =
        a.x-b.x;

    const dy =
        a.y-b.y;

    return Math.sqrt(
        dx*dx+dy*dy
    );

}


updateMap();

</script>


</body>

</html>

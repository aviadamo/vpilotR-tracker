<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>vPilot Reimagined</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080e15;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:rgba(7,12,18,.97);
    border-bottom:1px solid #263645;
    backdrop-filter:blur(15px);
}
.logo{
    font-size:17px;
    font-weight:700;
    white-space:nowrap;
    margin-right:15px;
}
.logo span{color:#4da3ff}
.nav{
    display:flex;
    gap:5px;
}
.nav button{
    border:1px solid transparent;
    background:transparent;
    color:#9aa9b7;
    padding:8px 11px;
    border-radius:7px;
    font-size:13px;
}
.nav button.active{
    color:white;
    background:#1d4f7a;
    border-color:#397eb8;
}
.actions{
    margin-left:auto;
    display:flex;
    gap:6px;
}
.actions button{
    background:#131e29;
    border:1px solid #354858;
    color:white;
    border-radius:7px;
    padding:8px 10px;
}
#map{
    position:fixed;
    top:64px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#111923;
    touch-action:none;
}
#mapImage{
    position:absolute;
    left:50%;
    top:50%;
    width:1200px;
    transform:translate(-50%,-50%) translate(0,0) scale(1);
    transform-origin:center;
    user-select:none;
    pointer-events:none;
}
/* AIRCRAFT */
.aircraft{
    position:absolute;
    left:55%;
    top:42%;
    width:55px;
    height:55px;
    transform:translate(-50%,-50%);
    cursor:pointer;
    z-index:20;
}
.aircraftIcon{
    width:55px;
    height:55px;
}
.aircraftIcon img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.9));
}
.aircraftLabel{
    position:absolute;
    left:48px;
    top:12px;
    white-space:nowrap;
    padding:3px 6px;
    background:rgba(6,11,16,.94);
    border:1px solid #3b4d5e;
    border-radius:5px;
    font-size:10px;
}
/* CHARTS */
#charts{
    display:none;
    position:fixed;
    top:64px;
    left:0;
    right:0;
    bottom:0;
    z-index:800;
    background:#0a1017;
}
.chartTop{
    height:58px;
    display:flex;
    align-items:center;
    padding:0 14px;
    gap:10px;
    background:#0d151e;
    border-bottom:1px solid #293a4a;
}
.chartTitle{
    font-weight:700;
    font-size:16px;
}
.chartSearch{
    margin-left:auto;
    width:220px;
    max-width:40%;
    padding:9px 11px;
    border-radius:7px;
    border:1px solid #344858;
    background:#121d27;
    color:white;
}
#chartFrame{
    width:100%;
    height:calc(100% - 58px);
    border:0;
}
/* AIRCRAFT PANEL */
#aircraftPanel{
    display:none;
    position:fixed;
    right:16px;
    top:80px;
    width:315px;
    max-width:calc(100% - 32px);
    z-index:1200;
    background:rgba(8,14,21,.98);
    border:1px solid #354858;
    border-radius:13px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}
.panelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border-bottom:1px solid #293a49;
}
.panelHeader button{
    border:0;
    background:none;
    color:#9aa8b5;
    font-size:21px;
}
.planeImage{
    height:135px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#172736,#0c151e);
}
.panelPlaneIcon{
    width:100px;
    height:100px;
}
.panelPlaneIcon img{
    width:100%;
    height:100%;
    object-fit:contain;
}
.panelBody{
    padding:14px;
}
.callsign{
    font-size:22px;
    font-weight:700;
}
.airline{
    margin-top:3px;
    color:#9caab8;
}
.aircraftType{
    margin-top:3px;
    color:#72808e;
    font-size:13px;
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:15px;
}
.stat{
    padding:9px;
    background:#131e29;
    border:1px solid #263645;
    border-radius:7px;
}
.stat small{
    display:block;
    color:#71808d;
    font-size:9px;
    text-transform:uppercase;
}
.stat strong{
    display:block;
    margin-top:3px;
}
.route{
    margin-top:10px;
    padding:10px;
    background:#131e29;
    border:1px solid #263645;
    border-radius:7px;
}
.route small{color:#71808d}
.route strong{
    display:block;
    margin-top:4px;
}
.flightButton{
    width:100%;
    margin-top:11px;
    padding:10px;
    border-radius:7px;
    border:1px solid #397eb8;
    background:#1d4f7a;
    color:white;
}
/* ZOOM */
.controls{
    position:fixed;
    right:14px;
    bottom:18px;
    z-index:700;
    display:flex;
    flex-direction:column;
    gap:6px;
}
.controls button{
    width:44px;
    height:44px;
    background:rgba(8,14,21,.95);
    color:white;
    border:1px solid #3b4e60;
    border-radius:8px;
    font-size:21px;
}
#zoom{
    position:fixed;
    right:14px;
    bottom:166px;
    z-index:700;
    padding:5px 8px;
    background:rgba(8,14,21,.9);
    color:#9aa8b5;
    border-radius:5px;
    font-size:11px;
}
</style>
</head>
<body>
<div id="topbar">
    <div class="logo">
        ✈️ vPilot <span>Reimagined</span>
    </div>
    <div class="nav">
        <button class="active" onclick="showEnroute(this)">
            📡 Enroute
        </button>
        <button onclick="showCharts(this)">
            🛬 Charts
        </button>
    </div>
    <div class="actions">
        <button onclick="alert('Flight planner coming next!')">
            📝
        </button>
        <button onclick="searchAircraft()">
            🔍
        </button>
    </div>
</div>
<div id="map">
    <img
        id="mapImage"
        src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"
        alt="PTFS Enroute Chart"
    >
    <div
        id="aircraft1"
        class="aircraft"
        onclick="showAircraft()">
        <div id="aircraftIcon" class="aircraftIcon"></div>
        <div class="aircraftLabel">
            UAE123
        </div>
    </div>
</div>
<div id="charts">
    <div class="chartTop">
        <div class="chartTitle">
            🛬 PTFS Charts
        </div>
        <input
            class="chartSearch"
            placeholder="Search airport..."
        >
    </div>
    <iframe
        id="chartFrame"
        src="https://ptfs.app/charts">
    </iframe>
</div>
<div id="aircraftPanel">
    <div class="panelHeader">
        <strong>Aircraft</strong>
        <button onclick="closeAircraft()">×</button>
    </div>
    <div class="planeImage">
        <div id="panelPlaneIcon" class="panelPlaneIcon"></div>
    </div>
    <div class="panelBody">
        <div class="callsign">UAE123</div>
        <div class="airline">Emirates</div>
        <div id="panelAircraftType" class="aircraftType">
            A380
        </div>
        <div class="stats">
            <div class="stat">
                <small>Altitude</small>
                <strong>FL350</strong>
            </div>
            <div class="stat">
                <small>Speed</small>
                <strong>472 kt</strong>
            </div>
            <div class="stat">
                <small>Heading</small>
                <strong>274°</strong>
            </div>
            <div class="stat">
                <small>Squawk</small>
                <strong>4201</strong>
            </div>
        </div>
        <div class="route">
            <small>Flight</small>
            <strong>IRFD → IPPH</strong>
        </div>
        <button
            class="flightButton"
            onclick="alert('Flight planning module coming next!')">
            🟣 View Flight Plan
        </button>
    </div>
</div>
<div id="zoom">100%</div>
<div class="controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
    <button onclick="resetMap()">⟳</button>
</div>
<script>
/* =========================
   MAP
========================= */
const map=document.getElementById("map");
const image=document.getElementById("mapImage");
let scale=1;
let offsetX=0;
let offsetY=0;
let pointers=new Map();
let lastX=0;
let lastY=0;
let lastDistance=null;
function updateMap(){
    image.style.transform=
        `translate(-50%,-50%)
         translate(${offsetX}px,${offsetY}px)
         scale(${scale})`;
    document.getElementById("zoom")
        .textContent=
        Math.round(scale*100)+"%";
}
function zoomIn(){
    scale=Math.min(5,scale*1.25);
    updateMap();
}
function zoomOut(){
    scale=Math.max(.5,scale*.8);
    updateMap();
}
function resetMap(){
    scale=1;
    offsetX=0;
    offsetY=0;
    updateMap();
}
/* =========================
   PINCH + PAN
========================= */
map.addEventListener("pointerdown",e=>{
    pointers.set(
        e.pointerId,
        {
            x:e.clientX,
            y:e.clientY
        }
    );
    map.setPointerCapture(e.pointerId);
    if(pointers.size===1){
        lastX=e.clientX;
        lastY=e.clientY;
    }
    if(pointers.size===2){
        const p=[...pointers.values()];
        lastDistance=
            Math.hypot(
                p[0].x-p[1].x,
                p[0].y-p[1].y
            );
    }
});
map.addEventListener("pointermove",e=>{
    if(!pointers.has(e.pointerId))
        return;
    pointers.set(
        e.pointerId,
        {
            x:e.clientX,
            y:e.clientY
        }
    );
    if(pointers.size===1){
        offsetX+=e.clientX-lastX;
        offsetY+=e.clientY-lastY;
        lastX=e.clientX;
        lastY=e.clientY;
        updateMap();
    }
    if(pointers.size===2){
        const p=[...pointers.values()];
        const newDistance=
            Math.hypot(
                p[0].x-p[1].x,
                p[0].y-p[1].y
            );
        if(lastDistance){
            scale*=newDistance/lastDistance;
            scale=Math.max(
                .5,
                Math.min(5,scale)
            );
            updateMap();
        }
        lastDistance=newDistance;
    }
});
map.addEventListener("pointerup",e=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2)
        lastDistance=null;
});
map.addEventListener("pointercancel",e=>{
    pointers.delete(e.pointerId);
});
/* =========================
   NAVIGATION
========================= */
function activate(button){
    document
        .querySelectorAll(".nav button")
        .forEach(b=>
            b.classList.remove("active")
        );
    button.classList.add("active");
}
function showEnroute(button){
    activate(button);
    document.getElementById("map")
        .style.display="block";
    document.getElementById("charts")
        .style.display="none";
}
function showCharts(button){
    activate(button);
    document.getElementById("map")
        .style.display="none";
    document.getElementById("charts")
        .style.display="block";
}
/* =========================
   REAL AIRCRAFT SVG LIBRARY
========================= */
const SVG_BASE=
"https://raw.githubusercontent.com/RexKramer1/AircraftShapesSVG/main/Shapes%20SVG/";
/*
   PTFS NAME
       ↓
   REAL SVG SILHOUETTE
   Variant does NOT matter.
   We just use a representative
   silhouette of the same aircraft.
*/
const aircraftIcons={
    "A380":"A388.svg",
    "A320":"A320.svg",
    "A330":"A333.svg",
    "A340":"A343.svg",
    "A350":"A359.svg",
    "737":"B738.svg",
    "747":"B748.svg",
    "777":"B77W.svg",
    "787":"B789.svg",
    "A220":"BCS3.svg",
    "A319":"A319.svg",
    "A321":"A321.svg",
    "757":"B752.svg",
    "767":"B763.svg"
};
/* =========================
   TEST AIRCRAFT
========================= */
const aircraftData={
    type:"A380",
    heading:274,
    callsign:"UAE123",
    airline:"Emirates"
};
/* =========================
   LOAD REAL SVG
========================= */
function getAircraftIcon(type){
    const file=
        aircraftIcons[type]
        ||"A320.svg";
    return SVG_BASE+file;
}
function updateAircraftIcon(){
    const url=
        getAircraftIcon(
            aircraftData.type
        );
    const aircraftHTML=
        `<img
            src="${url}"
            alt="${aircraftData.type}"
            style="
                transform:
                rotate(${aircraftData.heading}deg);
            "
        >`;
    document.getElementById(
        "aircraftIcon"
    ).innerHTML=
        aircraftHTML;
    document.getElementById(
        "panelPlaneIcon"
    ).innerHTML=
        aircraftHTML;
    document.getElementById(
        "panelAircraftType"
    ).textContent=
        aircraftData.type;
}
/* =========================
   CHANGE AIRCRAFT
========================= */
function setAircraftType(type){
    if(!aircraftIcons[type]){
        console.log(
            "No icon for:",
            type
        );
        return;
    }
    aircraftData.type=type;
    updateAircraftIcon();
}
/* =========================
   PANEL
========================= */
function showAircraft(){
    document.getElementById(
        "aircraftPanel"
    ).style.display="block";
    updateAircraftIcon();
}
function closeAircraft(){
    document.getElementById(
        "aircraftPanel"
    ).style.display="none";
}
function searchAircraft(){
    alert(
        "Live PTFS aircraft search will be connected next."
    );
}
/* =========================
   START
========================= */
updateMap();
updateAircraftIcon();
</script>
</body>
</html>

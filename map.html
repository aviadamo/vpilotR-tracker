<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vPilot Reimagined</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #071018;
    color: white;
}

button,
select,
input {
    font: inherit;
}

button {
    border: 1px solid #40545f;
    background: #14252e;
    color: white;
    border-radius: 7px;
    padding: 8px 12px;
    cursor: pointer;
}

button:hover {
    background: #1d3743;
}

.primary {
    background: #126b9d;
    border-color: #238dc4;
}

#topbar {
    position: fixed;
    z-index: 100;
    left: 0;
    right: 0;
    top: 0;
    height: 58px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 0 12px;

    background: #071018;
    border-bottom: 1px solid #334650;
}

#brand {
    font-size: 17px;
    font-weight: 800;
    margin-right: 10px;
    white-space: nowrap;
}

#brand span {
    color: #ffb000;
}

#status {
    margin-left: auto;
    color: #91a0a8;
    font-size: 10px;
}

#map {
    position: absolute;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;
    background: #cfd9dc;

    cursor: grab;
}

#map.dragging {
    cursor: grabbing;
}

#world {
    position: absolute;

    width: 2200px;
    height: 1400px;

    left: 50%;
    top: 50%;

    transform-origin: center center;
}

#mapBackground {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            #e8eeee 0%,
            #d6e0e2 60%,
            #c7d2d5 100%
        );
}

/*
    Optional real PTFS map.

    If you have the PTFS enroute chart locally, place it at:

        charts/enroute.svg

    It will automatically appear.
*/
#realMap {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: fill;

    pointer-events: none;
    user-select: none;
}

#mapMessage {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    color: #26343a;
    pointer-events: none;
}

#mapMessage .icon {
    font-size: 42px;
    margin-bottom: 8px;
}

#mapMessage strong {
    display: block;
    font-size: 18px;
}

#mapMessage small {
    display: block;
    margin-top: 6px;
    font-size: 11px;
}

/* WAYPOINTS */

#waypoints {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.waypoint {
    position: absolute;

    transform: translate(-50%, -50%);

    text-align: center;

    color: #18252b;

    font-size: 10px;
    font-weight: 700;

    text-shadow:
        0 1px 2px white,
        0 -1px 2px white,
        1px 0 2px white,
        -1px 0 2px white;
}

.waypoint-dot {
    width: 7px;
    height: 7px;

    margin: 0 auto 2px;

    border-radius: 50%;

    background: white;
    border: 2px solid #172027;
}

/* ROUTE */

#routeSvg {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
    overflow: visible;
}

#routeShadow {
    fill: none;
    stroke: rgba(0,0,0,0.28);
    stroke-width: 11;

    stroke-linecap: round;
    stroke-linejoin: round;
}

#routeLine {
    fill: none;

    stroke: #a855f7;
    stroke-width: 6;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.route-point {
    fill: #a855f7;
    stroke: white;
    stroke-width: 3;
}

/* AIRCRAFT */

#aircraftLayer {
    position: absolute;
    inset: 0;

    pointer-events: none;
}

.aircraft {
    position: absolute;

    width: 60px;
    height: 60px;

    transform: translate(-50%, -50%);

    pointer-events: auto;
}

.aircraft svg {
    width: 60px;
    height: 60px;

    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
}

.aircraft-label {
    position: absolute;

    left: 37px;
    top: 3px;

    white-space: nowrap;

    background: rgba(7,16,24,0.92);

    border: 1px solid #536773;
    border-radius: 4px;

    padding: 3px 6px;

    font-size: 10px;
    font-weight: 700;
}

/* PANELS */

.panel {
    position: fixed;

    z-index: 200;

    top: 70px;
    left: 12px;

    width: 450px;
    max-width: calc(100vw - 24px);

    max-height: calc(100vh - 82px);

    overflow-y: auto;

    background: rgba(7,16,24,0.97);

    border: 1px solid #40545f;
    border-radius: 12px;

    box-shadow: 0 20px 70px rgba(0,0,0,0.55);

    display: none;
}

.panel-header {
    padding: 12px;

    border-bottom: 1px solid #30434d;

    font-weight: 800;
}

.close {
    float: right;

    padding: 0;

    border: 0;
    background: transparent;

    font-size: 23px;
}

.panel-body {
    padding: 12px;
}

.grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.field {
    margin-bottom: 10px;
}

.field label {
    display: block;

    margin-bottom: 5px;

    color: #91a0a8;

    font-size: 9px;
    font-weight: 700;

    text-transform: uppercase;
}

select,
input {
    width: 100%;

    padding: 9px;

    color: white;

    background: #101d25;

    border: 1px solid #40545f;
    border-radius: 7px;

    outline: none;
}

select:focus,
input:focus {
    border-color: #238dc4;
}

.full {
    width: 100%;
    margin-top: 7px;
}

#routeResult {
    display: none;

    margin-top: 12px;
    padding: 11px;

    background: #101d25;

    border: 1px solid #40545f;
    border-radius: 8px;

    font-size: 11px;
    line-height: 1.7;
}

.route-title {
    color: #c084fc;
    font-weight: 800;
}

.error {
    color: #ff7777;
}

.good {
    color: #70e0a0;
}

/* CHART PANEL */

#chartPanel {
    position: fixed;

    z-index: 300;

    right: 12px;
    top: 70px;

    width: min(760px, calc(100vw - 24px));
    height: min(780px, calc(100vh - 82px));

    background: #071018;

    border: 1px solid #40545f;
    border-radius: 12px;

    overflow: hidden;

    display: none;

    box-shadow: 0 20px 70px rgba(0,0,0,0.6);
}

#chartHeader {
    height: 48px;

    display: flex;
    align-items: center;

    padding: 0 12px;

    border-bottom: 1px solid #30434d;
}

#chartTitle {
    font-weight: 800;
}

#chartHeader button {
    margin-left: auto;
}

#chartFrame {
    width: 100%;
    height: calc(100% - 48px);

    border: 0;

    background: white;
}

/* ZOOM */

#zoomControls {
    position: fixed;

    right: 12px;
    bottom: 12px;

    z-index: 100;

    display: flex;
    flex-direction: column;

    gap: 5px;
}

#zoomControls button {
    width: 40px;
    height: 40px;

    padding: 0;

    font-size: 20px;
}

#zoomLevel {
    position: fixed;

    right: 12px;
    bottom: 150px;

    z-index: 100;

    padding: 5px 8px;

    border-radius: 5px;

    background: rgba(7,16,24,0.9);

    color: #a5b0b5;

    font-size: 10px;
}

/* MOBILE */

@media(max-width:700px) {

    #brand {
        font-size: 13px;
    }

    #topbar button {
        padding: 7px 8px;
        font-size: 11px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    #status {
        display: none;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     TOP BAR
========================================================= -->

<div id="topbar">

    <div id="brand">
        ✈ <span>vPilot Reimagined</span>
    </div>

    <button onclick="openPlanner()">
        Flight Planning
    </button>

    <button onclick="openCharts()">
        Airport Charts
    </button>

    <button onclick="clearRoute()">
        Clear Route
    </button>

    <div id="status">
        MAP READY
    </div>

</div>


<!-- =========================================================
     MAP
========================================================= -->

<div id="map">

    <div id="world">

        <div id="mapBackground">

            <img
                id="realMap"
                src="charts/enroute.svg"
                alt=""
                draggable="false"
                onload="realMapLoaded()"
                onerror="realMapFailed()"
            >

            <div id="mapMessage">

                <div class="icon">🗺️</div>

                <strong>
                    PTFS Enroute Map
                </strong>

                <small>
                    Add charts/enroute.svg to display the real chart.
                </small>

            </div>

        </div>


        <!-- WAYPOINTS -->

        <div id="waypoints"></div>


        <!-- ROUTE -->

        <svg
            id="routeSvg"
            viewBox="0 0 2200 1400"
            preserveAspectRatio="none"
        >

            <polyline
                id="routeShadow"
            ></polyline>

            <polyline
                id="routeLine"
            ></polyline>

            <g id="routePoints"></g>

        </svg>


        <!-- AIRCRAFT -->

        <div id="aircraftLayer"></div>

    </div>

</div>


<!-- =========================================================
     FLIGHT PLANNER
========================================================= -->

<div id="planner" class="panel">

    <div class="panel-header">

        Flight Planning

        <button
            class="close"
            onclick="closePlanner()"
        >
            ×
        </button>

    </div>


    <div class="panel-body">

        <div class="grid">

            <div class="field">

                <label>
                    Departure Airport
                </label>

                <select id="departureAirport"></select>

            </div>


            <div class="field">

                <label>
                    Arrival Airport
                </label>

                <select id="arrivalAirport"></select>

            </div>

        </div>


        <div class="grid">

            <div class="field">

                <label>
                    Departure Runway
                </label>

                <select id="departureRunway"></select>

            </div>


            <div class="field">

                <label>
                    Arrival Runway
                </label>

                <select id="arrivalRunway"></select>

            </div>

        </div>


        <div class="grid">

            <div class="field">

                <label>
                    SID
                </label>

                <select id="sid"></select>

            </div>


            <div class="field">

                <label>
                    STAR
                </label>

                <select id="star"></select>

            </div>

        </div>


        <div class="grid">

            <div class="field">

                <label>
                    Aircraft
                </label>

                <select id="aircraft"></select>

            </div>


            <div class="field">

                <label>
                    Cruise Flight Level
                </label>

                <select id="flightLevel"></select>

            </div>

        </div>


        <div class="field">

            <label>
                Enroute Waypoints
            </label>

            <input
                id="waypointInput"
                placeholder="Example: JAMSI BANBA TINDR"
                autocomplete="off"
            >

        </div>


        <button
            class="primary full"
            onclick="generateRoute()"
        >
            ✈ Generate Flight Plan
        </button>


        <button
            class="full"
            onclick="openSelectedAirportChart()"
        >
            Open Airport Charts
        </button>


        <div id="routeResult"></div>

    </div>

</div>


<!-- =========================================================
     CHART VIEWER
========================================================= -->

<div id="chartPanel">

    <div id="chartHeader">

        <span id="chartTitle">
            PTFS Airport Charts
        </span>

        <button onclick="closeCharts()">
            ×
        </button>

    </div>


    <iframe
        id="chartFrame"
        title="PTFS Charts"
    ></iframe>

</div>


<!-- =========================================================
     ZOOM
========================================================= -->

<div id="zoomLevel">
    100%
</div>

<div id="zoomControls">

    <button onclick="zoomIn()">+</button>

    <button onclick="zoomOut()">−</button>

    <button onclick="resetMap()">⟳</button>

</div>


<script>

/* =========================================================
   AIRPORT DATA
========================================================= */

const AIRPORTS = {

    IRFD: "Greater Rockford",
    IMLR: "Mellor International",
    IPPH: "Perth International",
    ITKO: "Tokyo International",
    ILKL: "Lukla",
    IZOL: "Izolirani International",
    IJAF: "Al Najaf",
    ISCM: "RAF Scampton",
    IBTH: "Saint Barthelemy",
    IDCS: "Saba",
    ISKP: "Skopelos",
    ISAU: "Sauthamptona",
    IGAR: "Air Base Garry",
    IBLT: "Boltic Airfield",
    IBAR: "Barra",
    IHEN: "Henstridge",
    IIAB: "McConnell AFB",
    ILAR: "Larnaca",
    IPAP: "Paphos",
    IGRV: "Grindavik",
    ITRC: "Training Centre",
    IUFO: "UFO Base"

};


/* =========================================================
   RUNWAYS
========================================================= */

const RUNWAYS = {

    IRFD: ["18L", "18R", "36L", "36R", "06", "24"],
    IMLR: ["14", "32"],
    IPPH: ["03", "21"],
    ITKO: ["16L", "16R", "34L", "34R"],
    ILKL: ["12", "30"],
    IZOL: ["05", "23"],
    IJAF: ["09", "27"],
    ISCM: ["08", "26"],
    IBTH: ["10", "28"],
    IDCS: ["12", "30"],
    ISKP: ["02", "20"],
    ISAU: ["03", "21"],
    IGAR: ["09", "27"],
    IBLT: ["12", "30"],
    IBAR: ["06", "24"],
    IHEN: ["09", "27"],
    IIAB: ["18", "36"],
    ILAR: ["04", "22"],
    IPAP: ["16", "34"],
    IGRV: ["10", "28"],
    ITRC: ["09", "27"],
    IUFO: ["09", "27"]

};


/* =========================================================
   AIRCRAFT
========================================================= */

const AIRCRAFT = [

    "A220",
    "A318",
    "A319",
    "A320",
    "A321",
    "A330",
    "A330F",
    "A340",
    "A350",
    "A380",

    "737-700",
    "737-800",
    "737 MAX",
    "747-400",
    "747-8",
    "757",
    "767",
    "777-200",
    "777-300",
    "787",

    "ATR 72",
    "Dash 8",
    "CRJ",
    "E170",
    "E175",
    "E190",
    "E195",

    "MD-11",
    "DC-10",
    "L-1011",

    "AN-225",
    "Beluga",

    "C-130",
    "KC-135",
    "SR-71",

    "Chinook",
    "Piper Cub"

];


/* =========================================================
   PTFS-STYLE FLIGHT LEVELS
========================================================= */

const FLIGHT_LEVELS = [];

for (
    let level = 10;
    level <= 150;
    level += 10
) {

    FLIGHT_LEVELS.push(
        "FL" + String(level).padStart(3, "0")
    );

}


/* =========================================================
   PROCEDURES
========================================================= */

const PROCEDURES = {

    IRFD: {
        sid: [
            "NONE",
            "JAMSI",
            "CYRUS",
            "FORIA"
        ],

        star: [
            "NONE",
            "BANBA",
            "TINDR",
            "MOGTA"
        ]
    },

    IPPH: {
        sid: [
            "NONE",
            "BANBA",
            "TINDR"
        ],

        star: [
            "NONE",
            "JAMSI",
            "FORIA",
            "GULEG"
        ]
    },

    ITKO: {
        sid: [
            "NONE",
            "SHIBA",
            "CRAZY",
            "NIKON"
        ],

        star: [
            "NONE",
            "ASTRO",
            "GARDE",
            "LETSE"
        ]
    },

    IZOL: {
        sid: [
            "NONE",
            "JAMSI",
            "TINDR"
        ],

        star: [
            "NONE",
            "BANBA",
            "GULEG"
        ]
    },

    IMLR: {
        sid: [
            "NONE",
            "JAMSI",
            "CYRUS"
        ],

        star: [
            "NONE",
            "BANBA",
            "TINDR"
        ]
    }

};


/* =========================================================
   WAYPOINT COORDINATES
=========================================================

   These coordinates are for the local map coordinate system.

   When you put the matching PTFS enroute chart behind them,
   the waypoint layer and route layer remain independent from
   the chart itself.
========================================================= */

const WAYPOINTS = {

    JAMSI: [910, 735],
    BANBA: [1050, 735],
    TINDR: [1120, 270],
    INABI: [1040, 300],
    SHV: [1220, 315],
    EURAD: [1290, 370],
    BRAIN: [1390, 400],
    KELLA: [1470, 430],
    ELMAS: [1550, 470],
    TUDEP: [1630, 505],
    NOONU: [1710, 540],

    UWAIS: [1190, 560],
    RESUR: [1080, 590],
    AVBIT: [980, 620],
    GVK: [850, 615],
    SEAHA: [760, 650],
    EZYDB: [680, 690],
    WELLS: [610, 735],
    DUNKS: [540, 775],

    VONAR: [820, 770],
    BORDO: [930, 815],
    OLESA: [1030, 840],
    STRAX: [1130, 860],
    GULEG: [1240, 890],
    SQUID: [1360, 920],
    CROIS: [1470, 950],
    ONDER: [1580, 970],
    ZESTA: [1690, 990],
    AKASE: [1800, 1010],
    NIKON: [1900, 1050],

    CRAZY: [1770, 1120],
    HONDA: [1660, 1150],
    WOTAN: [1540, 1170],
    ASTRO: [1420, 1190],
    GARDE: [1300, 1210],
    SHIBA: [1180, 1230],
    LETSE: [1060, 1245],
    BULLY: [940, 1260],
    LOGAN: [820, 1275],

    CYRUS: [770, 860],
    LEGOS: [900, 820],
    MOGTA: [1010, 800],
    RENTS: [1080, 750],
    FORIA: [690, 940],
    BEANS: [620, 900],
    ANYMS: [850, 950],
    BAMOS: [960, 980],
    KAVEL: [1080, 1010],
    BOLRO: [1200, 980],
    HOGGS: [1320, 960],
    HUNTE: [1440, 930],
    MUONE: [1550, 900],
    JAZZR: [1670, 930],

    REAPR: [570, 830],
    DIR: [660, 800],
    TRELN: [740, 760],
    DEATH: [830, 720],
    ROBUX: [930, 680],
    FORCE: [1030, 640],
    ALTRS: [1140, 600],
    MASEV: [1250, 570]

};


/* =========================================================
   MAP STATE
========================================================= */

let mapScale = 1;
let mapOffsetX = 0;
let mapOffsetY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let startingOffsetX = 0;
let startingOffsetY = 0;

const map = document.getElementById("map");
const world = document.getElementById("world");


/* =========================================================
   MAP TRANSFORM
========================================================= */

function updateMapTransform() {

    world.style.transform =
        `translate(
            calc(-50% + ${mapOffsetX}px),
            calc(-50% + ${mapOffsetY}px)
        )
        scale(${mapScale})`;

    document.getElementById("zoomLevel").textContent =
        Math.round(mapScale * 100) + "%";
}


function zoomIn() {

    mapScale =
        Math.min(4, mapScale * 1.2);

    updateMapTransform();

}


function zoomOut() {

    mapScale =
        Math.max(0.35, mapScale / 1.2);

    updateMapTransform();

}


function resetMap() {

    mapScale = 1;
    mapOffsetX = 0;
    mapOffsetY = 0;

    updateMapTransform();

}


/* =========================================================
   MAP DRAGGING
========================================================= */

map.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        dragStartX = event.clientX;
        dragStartY = event.clientY;

        startingOffsetX = mapOffsetX;
        startingOffsetY = mapOffsetY;

        map.classList.add("dragging");

        map.setPointerCapture(event.pointerId);

    }
);


map.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }

        mapOffsetX =
            startingOffsetX +
            event.clientX -
            dragStartX;

        mapOffsetY =
            startingOffsetY +
            event.clientY -
            dragStartY;

        updateMapTransform();

    }
);


map.addEventListener(
    "pointerup",
    function() {

        dragging = false;

        map.classList.remove("dragging");

    }
);


map.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if (event.deltaY < 0) {
            zoomIn();
        } else {
            zoomOut();
        }

    },
    { passive: false }
);


/* =========================================================
   WAYPOINT RENDERING
========================================================= */

function renderWaypoints() {

    const container =
        document.getElementById("waypoints");

    container.innerHTML = "";

    Object.entries(WAYPOINTS).forEach(
        function([name, position]) {

            const waypoint =
                document.createElement("div");

            waypoint.className =
                "waypoint";

            waypoint.style.left =
                position[0] + "px";

            waypoint.style.top =
                position[1] + "px";

            waypoint.innerHTML = `
                <div class="waypoint-dot"></div>
                ${escapeHTML(name)}
            `;

            container.appendChild(waypoint);

        }
    );

}


/* =========================================================
   FORM HELPERS
========================================================= */

function fillSelect(
    elementId,
    values,
    includeNames = false
) {

    const select =
        document.getElementById(elementId);

    select.innerHTML = "";

    values.forEach(function(value) {

        let label = value;

        if (
            includeNames &&
            AIRPORTS[value]
        ) {

            label =
                value +
                " — " +
                AIRPORTS[value];

        }

        select.add(
            new Option(label, value)
        );

    });

}


function populateAirports() {

    const airports =
        Object.keys(AIRPORTS);

    fillSelect(
        "departureAirport",
        airports,
        true
    );

    fillSelect(
        "arrivalAirport",
        airports,
        true
    );

}


function populateAircraft() {

    fillSelect(
        "aircraft",
        AIRCRAFT
    );

}


function populateFlightLevels() {

    fillSelect(
        "flightLevel",
        FLIGHT_LEVELS
    );

}


/* =========================================================
   UPDATE RUNWAYS / PROCEDURES
========================================================= */

function updateDepartureOptions() {

    const airport =
        document.getElementById(
            "departureAirport"
        ).value;

    fillSelect(
        "departureRunway",
        RUNWAYS[airport] || []
    );

    const procedures =
        PROCEDURES[airport] || {};

    fillSelect(
        "sid",
        procedures.sid || ["NONE"]
    );

}


function updateArrivalOptions() {

    const airport =
        document.getElementById(
            "arrivalAirport"
        ).value;

    fillSelect(
        "arrivalRunway",
        RUNWAYS[airport] || []
    );

    const procedures =
        PROCEDURES[airport] || {};

    fillSelect(
        "star",
        procedures.star || ["NONE"]
    );

}

/* =========================================================
   ROUTE PARSER
========================================================= */

function parseWaypointInput() {

    const input =
        document.getElementById(
            "waypointInput"
        ).value
        .trim()
        .toUpperCase();

    if (!input) {
        return [];
    }

    return input
        .split(/[\s,>→-]+/)
        .map(function(value) {
            return value.trim();
        })
        .filter(Boolean);

}


/* =========================================================
   ROUTE DRAWING
========================================================= */

function drawRoute(
    waypointNames
) {

    const line =
        document.getElementById(
            "routeLine"
        );

    const shadow =
        document.getElementById(
            "routeShadow"
        );

    const pointsGroup =
        document.getElementById(
            "routePoints"
        );

    pointsGroup.innerHTML = "";

    if (
        waypointNames.length < 2
    ) {

        line.setAttribute(
            "points",
            ""
        );

        shadow.setAttribute(
            "points",
            ""
        );

        return;

    }


    const coordinates =
        waypointNames
            .map(function(name) {
                return WAYPOINTS[name];
            })
            .filter(Boolean);


    const points =
        coordinates
            .map(function(position) {
                return (
                    position[0] +
                    "," +
                    position[1]
                );
            })
            .join(" ");


    shadow.setAttribute(
        "points",
        points
    );

    line.setAttribute(
        "points",
        points
    );


    coordinates.forEach(
        function(position) {

            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute(
                "cx",
                position[0]
            );

            circle.setAttribute(
                "cy",
                position[1]
            );

            circle.setAttribute(
                "r",
                "8"
            );

            circle.setAttribute(
                "class",
                "route-point"
            );

            pointsGroup.appendChild(
                circle
            );

        }
    );

}


/* =========================================================
   GENERATE FLIGHT PLAN
========================================================= */

function generateRoute() {

    const departure =
        document.getElementById(
            "departureAirport"
        ).value;

    const arrival =
        document.getElementById(
            "arrivalAirport"
        ).value;

    const departureRunway =
        document.getElementById(
            "departureRunway"
        ).value;

    const arrivalRunway =
        document.getElementById(
            "arrivalRunway"
        ).value;

    const sid =
        document.getElementById(
            "sid"
        ).value;

    const star =
        document.getElementById(
            "star"
        ).value;

    const aircraft =
        document.getElementById(
            "aircraft"
        ).value;

    const flightLevel =
        document.getElementById(
            "flightLevel"
        ).value;


    const enteredWaypoints =
        parseWaypointInput();


    const validWaypoints = [];
    const invalidWaypoints = [];


    enteredWaypoints.forEach(
        function(name) {

            if (
                Object.prototype.hasOwnProperty.call(
                    WAYPOINTS,
                    name
                )
            ) {

                validWaypoints.push(name);

            } else {

                invalidWaypoints.push(name);

            }

        }
    );


    /*
        The route line is deliberately built from the
        waypoint coordinates, not from the chart image.

        Therefore the purple line continues to work even
        when the background chart is unavailable.
    */

    drawRoute(validWaypoints);


    const routeParts = [];


    routeParts.push(departure);


    if (sid !== "NONE") {
        routeParts.push(sid);
    }


    validWaypoints.forEach(
        function(name) {
            routeParts.push(name);
        }
    );


    if (star !== "NONE") {
        routeParts.push(star);
    }


    routeParts.push(arrival);


    const result =
        document.getElementById(
            "routeResult"
        );


    result.style.display =
        "block";


    let html = "";


    html += `
        <div class="route-title">
            GENERATED ROUTE
        </div>
    `;


    html += `
        <div style="margin-top:5px">
            ${escapeHTML(
                routeParts.join(" → ")
            )}
        </div>
    `;


    html += `
        <br>

        <b>Departure:</b>
        ${escapeHTML(departure)}
        /
        RWY ${escapeHTML(departureRunway || "—")}

        <br>

        <b>SID:</b>
        ${escapeHTML(sid)}

        <br>

        <b>Enroute:</b>
        ${
            validWaypoints.length
            ? escapeHTML(
                validWaypoints.join(" ")
              )
            : "DIRECT"
        }

        <br>

        <b>STAR:</b>
        ${escapeHTML(star)}

        <br>

        <b>Arrival:</b>
        ${escapeHTML(arrival)}
        /
        RWY ${escapeHTML(arrivalRunway || "—")}

        <br>

        <b>Aircraft:</b>
        ${escapeHTML(aircraft)}

        <br>

        <b>Cruise:</b>
        ${escapeHTML(flightLevel)}
    `;


    if (
        invalidWaypoints.length
    ) {

        html += `
            <br><br>

            <span class="error">
                Unknown waypoint(s):
                ${escapeHTML(
                    invalidWaypoints.join(", ")
                )}
            </span>
        `;

    } else {

        html += `
            <br><br>

            <span class="good">
                ✓ Route drawn on map
            </span>
        `;

    }


    result.innerHTML =
        html;


    saveFlightPlan({

        departure,
        arrival,
        departureRunway,
        arrivalRunway,
        sid,
        star,
        aircraft,
        flightLevel,
        waypoints: validWaypoints

    });

}


/* =========================================================
   SAVE PLAN
========================================================= */

function saveFlightPlan(plan) {

    localStorage.setItem(
        "vpilotReimaginedFlightPlan",
        JSON.stringify(plan)
    );

}


function loadFlightPlan() {

    const raw =
        localStorage.getItem(
            "vpilotReimaginedFlightPlan"
        );

    if (!raw) {
        return;
    }


    try {

        const plan =
            JSON.parse(raw);


        if (plan.departure) {

            document.getElementById(
                "departureAirport"
            ).value =
                plan.departure;

        }


        updateDepartureOptions();


        if (plan.arrival) {

            document.getElementById(
                "arrivalAirport"
            ).value =
                plan.arrival;

        }


        updateArrivalOptions();


        if (plan.departureRunway) {

            document.getElementById(
                "departureRunway"
            ).value =
                plan.departureRunway;

        }


        if (plan.arrivalRunway) {

            document.getElementById(
                "arrivalRunway"
            ).value =
                plan.arrivalRunway;

        }


        if (plan.sid) {

            document.getElementById(
                "sid"
            ).value =
                plan.sid;

        }


        if (plan.star) {

            document.getElementById(
                "star"
            ).value =
                plan.star;

        }


        if (plan.aircraft) {

            document.getElementById(
                "aircraft"
            ).value =
                plan.aircraft;

        }


        if (plan.flightLevel) {

            document.getElementById(
                "flightLevel"
            ).value =
                plan.flightLevel;

        }


        if (plan.waypoints) {

            document.getElementById(
                "waypointInput"
            ).value =
                plan.waypoints.join(" ");

            drawRoute(
                plan.waypoints
            );

        }

    } catch (error) {

        console.warn(
            "Could not load saved flight plan:",
            error
        );

    }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

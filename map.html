<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTFS Flight Planner</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111820;
    color: white;
    font-family: Arial, sans-serif;
}
/* =========================
   TOP BAR
========================= */
#topbar {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 13px;
    background: rgba(7, 12, 18, .97);
    border-bottom: 1px solid #344654;
}
.logo {
    font-weight: 800;
    white-space: nowrap;
}
.logo span {
    color: #ffb000;
}
button {
    font-family: inherit;
}
.topButton {
    padding: 8px 11px;
    border: 1px solid #354858;
    border-radius: 7px;
    background: #121d27;
    color: white;
    cursor: pointer;
}
.topButton:hover {
    background: #1d2b37;
}
#status {
    margin-left: auto;
    color: #81909b;
    font-size: 11px;
}
/* =========================
   MAP
========================= */
#map {
    position: fixed;
    left: 0;
    right: 0;
    top: 58px;
    bottom: 0;
    overflow: hidden;
    background: #111820;
    touch-action: none;
}
#world {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform-origin: center center;
}
/*
   ACTUAL PTFS ENROUTE CHART
   This is the real PTFS Enroute Chart SVG from
   Treelon's PTFS Charts repository.
*/
#enrouteMap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1900px;
    height: auto;
    max-width: none;
    transform: translate(-50%, -50%);
    user-select: none;
    pointer-events: none;
}
/* =========================
   ROUTE
========================= */
#routeLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
#routeLine {
    fill: none;
    stroke: #ffb000;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
        drop-shadow(0 0 4px rgba(255,176,0,.9));
}
/* =========================
   AIRCRAFT
========================= */
.aircraft {
    position: absolute;
    width: 64px;
    height: 64px;
    transform: translate(-50%, -50%);
    z-index: 200;
    cursor: pointer;
    transition:
        left .2s linear,
        top .2s linear;
}
.aircraftIcon {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    object-fit: contain;
    transform-origin: center center;
    /*
       Converts black SVG silhouettes into
       a solid FlightRadar-style yellow.
    */
    filter:
        brightness(0)
        saturate(100%)
        invert(72%)
        sepia(97%)
        saturate(1800%)
        hue-rotate(2deg)
        brightness(105%)
        contrast(105%);
    pointer-events: none;
}
.aircraftGlow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30px;
    height: 30px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: rgba(255,176,0,.08);
    box-shadow:
        0 0 12px rgba(255,176,0,.28);
    pointer-events: none;
}
.aircraftLabel {
    position: absolute;
    left: 42px;
    top: 5px;
    padding: 3px 6px;
    border-radius: 5px;
    background: rgba(4,9,14,.94);
    border: 1px solid #3b4e5d;
    color: white;
    font-size: 10px;
    white-space: nowrap;
    pointer-events: none;
}
/* =========================
   MAP CONTROLS
========================= */
#controls {
    position: fixed;
    right: 13px;
    bottom: 14px;
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
.mapButton {
    width: 42px;
    height: 42px;
    border: 1px solid #3a4e5e;
    border-radius: 8px;
    background: rgba(7,13,19,.96);
    color: white;
    font-size: 20px;
    cursor: pointer;
}
#zoomDisplay {
    position: fixed;
    right: 15px;
    bottom: 160px;
    z-index: 400;
    padding: 4px 7px;
    border-radius: 5px;
    background: rgba(7,13,19,.9);
    color: #8796a1;
    font-size: 10px;
}
/* =========================
   PANELS
========================= */
.panel {
    position: fixed;
    z-index: 600;
    top: 70px;
    left: 12px;
    width: 365px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 84px);
    overflow-y: auto;
    display: none;
    background: rgba(7,13,19,.98);
    border: 1px solid #354858;
    border-radius: 12px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.55);
}
.panelHeader {
    display: flex;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #293a49;
}
.panelHeader strong {
    font-size: 15px;
}
.closeButton {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: #8c9aa5;
    font-size: 21px;
    cursor: pointer;
}
.panelBody {
    padding: 13px;
}
.field {
    margin-bottom: 10px;
}
.field label {
    display: block;
    margin-bottom: 5px;
    color: #81909b;
    font-size: 9px;
    text-transform: uppercase;
}
input,
select {
    width: 100%;
    padding: 9px;
    border: 1px solid #344858;
    border-radius: 7px;
    outline: none;
    background: #111c26;
    color: white;
}
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.primary {
    width: 100%;
    padding: 11px;
    border: 1px solid #5b9bd0;
    border-radius: 7px;
    background: #1d557e;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
.secondary {
    width: 100%;
    margin-top: 7px;
    padding: 9px;
    border: 1px solid #354858;
    border-radius: 7px;
    background: #121d27;
    color: #a2afb8;
    cursor: pointer;
}
/* =========================
   AIRCRAFT INFO
========================= */
#aircraftPanel {
    position: fixed;
    z-index: 800;
    top: 70px;
    right: 12px;
    width: 350px;
    max-width: calc(100vw - 24px);
    display: none;
    background: rgba(7,13,19,.98);
    border: 1px solid #354858;
    border-radius: 12px;
    overflow: hidden;
}
#aircraftHeader {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #293a49;
}
.aircraftPhoto {
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101923;
    color: #71808c;
}
.aircraftInfo {
    padding: 13px;
}
.callsign {
    font-size: 21px;
    font-weight: 800;
}
.username {
    margin-top: 4px;
    color: #55aaff;
    font-size: 12px;
}
.infoLine {
    margin-top: 6px;
    color: #84929d;
    font-size: 12px;
}
/* =========================
   CHART PANEL
========================= */
#chartPanel {
    position: fixed;
    z-index: 750;
    top: 70px;
    right: 12px;
    bottom: 12px;
    width: 520px;
    max-width: calc(100vw - 24px);
    display: none;
    background: #071019;
    border: 1px solid #354858;
    border-radius: 12px;
    overflow: hidden;
}
#chartHeader {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #293a49;
}
#chartImage {
    width: 100%;
    height: calc(100% - 48px);
    object-fit: contain;
}
/* =========================
   ROUTE RESULT
========================= */
#result {
    display: none;
    margin-top: 12px;
    border-top: 1px solid #293a49;
    padding-top: 12px;
}
.routeBox {
    padding: 10px;
    border: 1px solid #293a49;
    border-radius: 7px;
    background: #111c26;
    color: #ffbd3d;
    font-size: 12px;
    line-height: 1.7;
    word-break: break-word;
}
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 8px;
}
.stat {
    padding: 8px;
    border: 1px solid #293a49;
    border-radius: 6px;
    background: #111c26;
}
.stat small {
    display: block;
    color: #71818d;
    font-size: 9px;
}
.stat strong {
    display: block;
    margin-top: 3px;
}
/* =========================
   MOBILE
========================= */
@media(max-width:700px) {
    #status {
        display: none;
    }
    .logo {
        font-size: 13px;
    }
    .topButton {
        padding: 7px;
        font-size: 10px;
    }
    #chartPanel {
        left: 12px;
        right: 12px;
        width: auto;
    }
}
</style>
</head>
<body>
<!-- =========================
     TOP BAR
========================= -->
<div id="topbar">
    <div class="logo">
        ✈ PTFS <span>Flight Planner</span>
    </div>
    <button
        class="topButton"
        onclick="openPlanner()">
        📝 Flight Plan
    </button>
    <button
        class="topButton"
        onclick="resetMap()">
        🗺 Reset Map
    </button>
    <div id="status">
        PTFS Enroute Map
    </div>
</div>
<!-- =========================
     MAP
========================= -->
<div id="map">
    <div id="world">
        <!-- REAL PTFS ENROUTE MAP -->
        <img
            id="enrouteMap"
            src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"
            alt="PTFS Enroute Chart"
            draggable="false"
        >
        <!-- ROUTE -->
        <svg
            id="routeLayer"
            viewBox="0 0 1000 700"
            preserveAspectRatio="none">
            <polyline

            </polyline>
        </svg>
        <!-- AIRCRAFT -->
        <div
            id="aircraft"
            class="aircraft"
            style="left:50%;top:50%;">
            <div class="aircraftGlow"></div>
            <img

    </div>
</div>
<!-- =========================

</div>
<div id="controls">

<!-- =========================
     AIRCRAFT INFO
========================= -->

            id="infoUsername"

            id="infoAirline"

            PTFS Chart

            onclick="closeChart()">
            ×
        </button>
    </div>
    <img
        id="chartImage"
        alt="PTFS Chart">

<script>
/* =========================================================
   MAP STATE
========================================================= */
let scale = 1;
let panX = 0;
let panY = 0;
let pointers = new Map();
let lastX = 0;
let lastY = 0;
let pinchDistance = null;
/* =========================================================
   AIRCRAFT
========================================================= */
const aircraft = {
    callsign: "UAE123",
    username: "PilotExample",
    airline: "Emirates",
    type: "A320",
    heading: 274
};
/* =========================================================
   AIRCRAFT SVG FILES
========================================================= */
const aircraftIcons = {
    "A220": "A220.svg",
    "A318": "A318.svg",
    "A319": "A319.svg",
    "A320": "A320.svg",
    "A321": "A321.svg",
    "A330": "A333.svg",
    "A340": "A343.svg",
    "A350": "A359.svg",
    "A380": "A388.svg",
    "737": "B738.svg",
    "747": "B748.svg",
    "757": "B752.svg",
    "767": "B763.svg",
    "777": "B77W.svg",
    "787": "B789.svg",
    "MD-11": "MD11.svg",
    "DC-10": "DC10.svg",
    "DC-9": "DC9.svg",
    "CRJ": "CRJ9.svg",
    "E190": "E190.svg",
    "ATR": "ATR72.svg",
    "Dash 8": "DH8D.svg",
    "Concorde": "Concorde.svg",
    "Tu-154": "TU154.svg",
    "Il-96": "IL96.svg",
    "An-225": "AN225.svg"
};
/*
   AircraftShapesSVG repository.
   The A380 file you found is A388.svg.
*/
const aircraftIconBase =
    "https://raw.githubusercontent.com/RexKramer1/AircraftShapesSVG/main/Shapes%20SVG/";
/* =========================================================
   UPDATE AIRCRAFT
========================================================= */
function updateAircraft() {
    const img =
        document.getElementById(
            "aircraftIcon"
        );
    const file =
        aircraftIcons[
            aircraft.type
        ];
    if (file) {
        img.src =
            aircraftIconBase +
            file;
    }
    /*
       Aircraft points in its current heading.
    */
    img.style.transform =
        `translate(-50%, -50%) rotate(${aircraft.heading}deg)`;
    document.getElementById(
        "aircraftLabel"
    ).textContent =
        aircraft.callsign;
    document.getElementById(
        "infoCallsign"
    ).textContent =
        aircraft.callsign;
    document.getElementById(
        "infoUsername"
    ).textContent =
        "Roblox: " +
        aircraft.username;
    document.getElementById(
        "infoAirline"
    ).textContent =
        "Airline: " +
        aircraft.airline;
    document.getElementById(
        "infoType"
    ).textContent =
        "Aircraft: " +
        aircraft.type;
    document.getElementById(
        "infoHeading"
    ).textContent =
        "Heading: " +
        String(
            aircraft.heading
        ).padStart(3, "0") +
        "°";
}
/* =========================================================
   MAP TRANSFORM
========================================================= */
function updateMap() {
    document.getElementById(
        "world"
    ).style.transform =
        `translate(${panX}px, ${panY}px) scale(${scale})`;
    document.getElementById(
        "zoomDisplay"
    ).textContent =
        Math.round(
            scale * 100
        ) + "%";
}
function zoomIn() {
    scale =
        Math.min(
            6,
            scale * 1.25
        );
    updateMap();
}
function zoomOut() {
    scale =
        Math.max(
            .4,
            scale * .8
        );
    updateMap();
}
function resetMap() {
    scale = 1;
    panX = 0;
    panY = 0;
    updateMap();
}
/* =========================================================
   MAP PAN / PINCH
========================================================= */
const map =
    document.getElementById(
        "map"
    );
map.addEventListener(
    "pointerdown",
    event => {
        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );
        map.setPointerCapture(
            event.pointerId
        );
        if (
            pointers.size === 1
        ) {
            lastX =
                event.clientX;
            lastY =
                event.clientY;
        }
        if (
            pointers.size === 2
        ) {
            const p =
                [...pointers.values()];
            pinchDistance =
                Math.hypot(
                    p[0].x - p[1].x,
                    p[0].y - p[1].y
                );
        }
    }
);
map.addEventListener(
    "pointermove",
    event => {
        if (
            !pointers.has(
                event.pointerId
            )
        ) return;
        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );
        if (
            pointers.size === 1
        ) {
            panX +=
                event.clientX -
                lastX;
            panY +=
                event.clientY -
                lastY;
            lastX =
                event.clientX;
            lastY =
                event.clientY;
            updateMap();
        }
        if (
            pointers.size === 2
        ) {
            const p =
                [...pointers.values()];
            const distance =
                Math.hypot(
                    p[0].x - p[1].x,
                    p[0].y - p[1].y
                );
            if (
                pinchDistance
            ) {
                scale *=
                    distance /
                    pinchDistance;
                scale =
                    Math.max(
                        .4,
                        Math.min(
                            6,
                            scale
                        )
                    );
                updateMap();
            }
            pinchDistance =
                distance;
        }
    }
);
map.addEventListener(
    "pointerup",
    event => {
        pointers.delete(
            event.pointerId
        );
        if (
            pointers.size < 2
        ) {
            pinchDistance =
                null;
        }
    }
);
map.addEventListener(
    "wheel",
    event => {
        event.preventDefault();
        if (
            event.deltaY < 0
        ) {
            zoomIn();
        } else {
            zoomOut();
        }
    },
    {
        passive: false
    }
);
/* =========================================================
   FLIGHT PLANNER
========================================================= */
function openPlanner() {
    document.getElementById(
        "planner"
    ).style.display =
        "block";
}
function closePlanner() {
    document.getElementById(
        "planner"
    ).style.display =
        "none";
}
function generateRoute() {
    const departure =
        document.getElementById(
            "departure"
        ).value
        .trim()
        .toUpperCase();
    const arrival =
        document.getElementById(
            "arrival"
        ).value
        .trim()
        .toUpperCase();
    const type =
        document.getElementById(
            "aircraftType"
        ).value;
    const level =
        document.getElementById(
            "flightLevel"
        ).value;
    if (
        !departure ||
        !arrival
    ) {
        alert(
            "Enter a departure and arrival airport first."
        );
        return;
    }
    /*
       Temporary planner output.
       The actual PTFS waypoint graph will be connected
       next, so this can automatically calculate the
       shortest valid route.
    */
    const route =
        `${departure} → ROUTE → ${arrival}`;
    document.getElementById(
        "routeText"
    ).textContent =
        route;
    document.getElementById(
        "resultAircraft"
    ).textContent =
        type;
    document.getElementById(
        "resultLevel"
    ).textContent =
        level;
    document.getElementById(
        "result"
    ).style.display =
        "block";
}
/* =========================================================
   CLEAR ROUTE
========================================================= */
function clearRoute() {
    document.getElementById(
        "routeLine"
    ).setAttribute(
        "points",
        ""
    );
    document.getElementById(
        "result"
    ).style.display =
        "none";
}
/* =========================================================
   AIRCRAFT INFO
========================================================= */
document
    .getElementById(
        "aircraft"
    )
    .addEventListener(
        "click",
        event => {
            event.stopPropagation();
            document.getElementById(
                "aircraftPanel"
            ).style.display =
                "block";
        }
    );
function closeAircraft() {
    document.getElementById(
        "aircraftPanel"
    ).style.display =
        "none";
}
/* =========================================================
   CHART
========================================================= */
function openChart(
    title,
    url
) {
    document.getElementById(
        "chartTitle"
    ).textContent =
        title;
    document.getElementById(
        "chartImage"
    ).src =
        url;
    document.getElementById(
        "chartPanel"
    ).style.display =
        "block";
}
function closeChart() {
    document.getElementById(
        "chartPanel"
    ).style.display =
        "none";
}
/* =========================================================
   INITIALIZE
========================================================= */
updateAircraft();
updateMap();
/*
   Make the example aircraft look more realistic.
*/
setTimeout(
    () => {
        aircraft.callsign =
            "UAE123";
        aircraft.username =
            "PilotExample";
        aircraft.airline =
            "Emirates";
        aircraft.type =
            "A320";
        aircraft.heading =
            274;
        updateAircraft();
    },
    100
);
</script>
</body>
</html>

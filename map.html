<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>PTFS Tracker</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111923;
    font-family: Arial, sans-serif;
}


/* =========================
   TOP BAR
========================= */

#topbar {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 60px;

    background: rgba(10,15,22,0.97);

    display: flex;

    align-items: center;

    padding: 0 12px;

    z-index: 1000;

    border-bottom: 1px solid #344454;

}


.logo {

    color: white;

    font-weight: bold;

    margin-right: 15px;

}


.tabs {

    display: flex;

    gap: 6px;

}


.tab {

    background: #172330;

    border: 1px solid #405264;

    color: #cbd5df;

    padding: 8px 11px;

    border-radius: 7px;

    font-size: 13px;

}


.tab.active {

    background: #2c6594;

    color: white;

}


/* =========================
   MAP
========================= */

#map {

    position: fixed;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background: #111923;

    touch-action: none;

}


#mapImage {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 1000px;

    transform-origin: center;

    user-select: none;

    pointer-events: none;

}


/* =========================
   CONTROLS
========================= */

.controls {

    position: fixed;

    right: 15px;
    bottom: 20px;

    z-index: 1000;

    display: flex;

    flex-direction: column;

    gap: 7px;

}


.controls button {

    width: 46px;
    height: 46px;

    background: rgba(10,15,22,0.95);

    color: white;

    border: 1px solid #46596b;

    border-radius: 8px;

    font-size: 22px;

}


#zoom {

    position: fixed;

    right: 15px;
    bottom: 175px;

    z-index: 1000;

    background: rgba(10,15,22,0.9);

    color: #bbb;

    padding: 6px 9px;

    border-radius: 6px;

    font-size: 12px;

}


@media(max-width:600px) {

    .logo {

        display: none;

    }

    .tab {

        padding: 7px 8px;

        font-size: 12px;

    }

}

</style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div id="topbar">

    <div class="logo">

        ✈️ PTFS Tracker

    </div>


    <div class="tabs">

        <button
        class="tab active"
        onclick="switchMap('world',this)">

            🌍 World

        </button>


        <button
        class="tab"
        onclick="switchMap('enroute',this)">

            📡 Enroute

        </button>


        <button
        class="tab"
        onclick="switchMap('charts',this)">

            🛬 Charts

        </button>

    </div>

</div>


<!-- =========================
     MAP
========================= -->

<div id="map">

    <img
    id="mapImage"
    src="https://roblox-ptfs.fandom.com/wiki/Special:Redirect/file/PTFS%27s_World.png"
    alt="PTFS World Map">

</div>


<div id="zoom">

    100%

</div>


<!-- =========================
     CONTROLS
========================= -->

<div class="controls">

    <button onclick="zoomIn()">
        +
    </button>

    <button onclick="zoomOut()">
        −
    </button>

    <button onclick="resetMap()">
        ⟳
    </button>

</div>


<script>


/* =========================
   MAP SOURCES
========================= */

const maps = {

    world:
    "https://roblox-ptfs.fandom.com/wiki/Special:Redirect/file/PTFS%27s_World.png",


    enroute:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg",


    charts:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"

};


/* =========================
   VARIABLES
========================= */

const map =
document.getElementById("map");

const image =
document.getElementById("mapImage");

const zoomText =
document.getElementById("zoom");


let scale = 1;

let x = 0;

let y = 0;

let pointers = new Map();

let lastX = 0;

let lastY = 0;

let lastDistance = null;


/* =========================
   SWITCH MAP
========================= */

function switchMap(type, button) {

    image.src = maps[type];


    document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.classList.remove("active");

    });


    button.classList.add("active");


    resetMap();

}


/* =========================
   UPDATE MAP
========================= */

function updateMap() {

    image.style.transform =

    `translate(-50%, -50%)
     translate(${x}px,${y}px)
     scale(${scale})`;


    zoomText.textContent =

    Math.round(scale * 100) + "%";

}


/* =========================
   ZOOM
========================= */

function zoomAt(

    newScale,
    centerX,
    centerY

) {

    newScale =

        Math.max(
            0.5,
            Math.min(5,newScale)
        );


    const rect =
        map.getBoundingClientRect();


    const mx =

        centerX -
        rect.left -
        rect.width / 2;


    const my =

        centerY -
        rect.top -
        rect.height / 2;


    const factor =

        newScale / scale;


    x =

        mx -
        (mx - x) * factor;


    y =

        my -
        (my - y) * factor;


    scale = newScale;


    updateMap();

}


/* =========================
   MOUSE WHEEL
========================= */

map.addEventListener(

    "wheel",

    function(event) {

        event.preventDefault();


        zoomAt(

            scale *
            (event.deltaY < 0
            ? 1.15
            : 0.87),

            event.clientX,

            event.clientY

        );

    },

    {passive:false}

);


/* =========================
   TOUCH / MOUSE
========================= */

map.addEventListener(

    "pointerdown",

    function(event) {

        pointers.set(

            event.pointerId,

            {
                x:event.clientX,
                y:event.clientY
            }

        );


        map.setPointerCapture(

            event.pointerId

        );


        if(pointers.size === 1) {

            lastX =
                event.clientX;

            lastY =
                event.clientY;

        }


        if(pointers.size === 2) {

            const p =
                [...pointers.values()];


            lastDistance =
                distance(p[0],p[1]);

        }

    }

);


map.addEventListener(

    "pointermove",

    function(event) {

        if(
            !pointers.has(
                event.pointerId
            )
        )
            return;


        pointers.set(

            event.pointerId,

            {
                x:event.clientX,
                y:event.clientY
            }

        );


        /* PAN */

        if(pointers.size === 1) {

            x +=
                event.clientX - lastX;


            y +=
                event.clientY - lastY;


            lastX =
                event.clientX;


            lastY =
                event.clientY;


            updateMap();

        }


        /* PINCH */

        if(pointers.size === 2) {

            const p =
                [...pointers.values()];


            const newDistance =
                distance(p[0],p[1]);


            if(lastDistance !== null) {

                zoomAt(

                    scale *
                    (
                        newDistance /
                        lastDistance
                    ),

                    (p[0].x+p[1].x)/2,

                    (p[0].y+p[1].y)/2

                );

            }


            lastDistance =
                newDistance;

        }

    }

);


function endPointer(event) {

    pointers.delete(
        event.pointerId
    );


    if(pointers.size < 2) {

        lastDistance = null;

    }

}


map.addEventListener(
    "pointerup",
    endPointer
);


map.addEventListener(
    "pointercancel",
    endPointer
);


/* =========================
   HELPERS
========================= */

function distance(a,b) {

    const dx =
        a.x-b.x;


    const dy =
        a.y-b.y;


    return Math.sqrt(
        dx*dx + dy*dy
    );

}


/* =========================
   BUTTONS
========================= */

function zoomIn() {

    zoomAt(

        scale * 1.3,

        window.innerWidth/2,

        window.innerHeight/2

    );

}


function zoomOut() {

    zoomAt(

        scale * 0.77,

        window.innerWidth/2,

        window.innerHeight/2

    );

}


function resetMap() {

    scale = 1;

    x = 0;

    y = 0;

    updateMap();

}


updateMap();

</script>


</body>

</html>

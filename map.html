<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>vPilot Reimagined</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#081018;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button,select,input{
    font:inherit;
}

button{
    border:1px solid #40515c;
    background:#13232d;
    color:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:hover{
    background:#1c3643;
}

.primary{
    background:#126b9c;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:58px;
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:#071018;
    border-bottom:1px solid #334650;
}

#logo{
    font-weight:bold;
    white-space:nowrap;
    margin-right:8px;
}

#logo span{
    color:#ffb000;
}

#status{
    margin-left:auto;
    color:#92a4ad;
    font-size:11px;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#121b22;
    cursor:grab;
    touch-action:none;
}

#map.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;
    width:2400px;
    height:1600px;
    left:50%;
    top:50%;
    transform-origin:center center;
}

#chart{
    position:absolute;
    left:0;
    top:0;
    width:2400px;
    height:1600px;
    object-fit:fill;
    user-select:none;
    pointer-events:none;
}

#routeLayer{
    position:absolute;
    left:0;
    top:0;
    width:2400px;
    height:1600px;
    pointer-events:none;
    z-index:20;
    overflow:visible;
}

#routeShadow{
    fill:none;
    stroke:rgba(0,0,0,.85);
    stroke-width:16;
    stroke-linecap:round;
    stroke-linejoin:round;
}

#routeLine{
    fill:none;
    stroke:#b85cff;
    stroke-width:7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.routePoint{
    fill:#b85cff;
    stroke:white;
    stroke-width:3;
}

/* =========================
   REAL WAYPOINT HOTSPOTS
========================= */

#waypointLayer{
    position:absolute;
    left:0;
    top:0;
    width:2400px;
    height:1600px;
    z-index:35;
    pointer-events:none;
}

.waypointHotspot{
    position:absolute;
    width:32px;
    height:32px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:auto;
    background:transparent;
    border:0;
    padding:0;
    cursor:pointer;
    touch-action:manipulation;
}

.waypointHotspot:hover{
    background:rgba(255,255,255,.12);
}

.waypointHotspot.selected{
    background:rgba(184,92,255,.18);
    box-shadow:
        0 0 0 2px #b85cff,
        0 0 12px #b85cff;
}

/* =========================
   SELECTED MARKERS
========================= */

#clickLayer{
    position:absolute;
    inset:0;
    z-index:40;
    pointer-events:none;
}

.clickedWaypoint{
    position:absolute;
    transform:translate(-50%,-50%);
    pointer-events:none;
    text-align:center;
    font-size:10px;
    font-weight:bold;
    color:#fff;
    text-shadow:
        0 0 2px #000,
        0 0 4px #000;
}

.clickedWaypoint .dot{
    width:11px;
    height:11px;
    margin:auto;
    border-radius:50%;
    background:#b85cff;
    border:2px solid white;
}

/* =========================
   MAP CONTROLS
========================= */

#mapControls{
    position:fixed;
    right:12px;
    bottom:12px;
    z-index:90;
    display:flex;
    flex-direction:column;
    gap:5px;
}

#mapControls button{
    width:42px;
    height:42px;
    padding:0;
    font-size:20px;
}

#zoomLabel{
    position:fixed;
    right:12px;
    bottom:150px;
    z-index:90;
    padding:5px 8px;
    border-radius:5px;
    background:#071018dd;
    color:#aebbc1;
    font-size:10px;
}

/* =========================
   MOBILE ROUTE BAR
========================= */

#routeBar{
    position:fixed;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:180;
    display:none;
    align-items:center;
    gap:6px;
    padding:7px;
    background:#071018f5;
    border:1px solid #40515c;
    border-radius:11px;
    box-shadow:0 8px 35px #000;
}

#routeBar.active{
    display:flex;
}

#routeBar .routeStatus{
    flex:1;
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:11px;
    color:#b9c5ca;
}

#routeBar button{
    padding:8px 10px;
    white-space:nowrap;
}

/* =========================
   PLANNER
========================= */

.panel{
    position:fixed;
    top:70px;
    left:12px;
    width:500px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 82px);
    overflow:auto;
    z-index:200;
    display:none;
    background:#071018f7;
    border:1px solid #40515c;
    border-radius:12px;
    box-shadow:0 20px 70px #000;
}

.panelHeader{
    padding:12px;
    border-bottom:1px solid #30414a;
    font-weight:bold;
}

.close{
    float:right;
    padding:0;
    background:none;
    border:0;
    font-size:22px;
}

.panelBody{
    padding:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.field{
    margin-bottom:10px;
}

.field label{
    display:block;
    margin-bottom:4px;
    color:#8fa1aa;
    font-size:9px;
    font-weight:bold;
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:9px;
    border-radius:7px;
    border:1px solid #40515c;
    background:#101c24;
    color:white;
    outline:none;
}

.full{
    width:100%;
    margin-top:7px;
}

.help{
    margin-top:10px;
    color:#8fa1aa;
    font-size:10px;
    line-height:1.5;
}

#routeInfo{
    margin-top:10px;
    padding:10px;
    background:#101c24;
    border:1px solid #40515c;
    border-radius:8px;
    font-size:11px;
    line-height:1.6;
}

.purple{
    color:#c06cff;
}

/* =========================
   CHARTS
========================= */

#charts{
    position:fixed;
    right:12px;
    top:70px;
    width:min(900px,calc(100vw - 24px));
    height:min(820px,calc(100vh - 82px));
    z-index:250;
    display:none;
    overflow:hidden;
    background:#071018;
    border:1px solid #40515c;
    border-radius:12px;
    box-shadow:0 20px 70px #000;
}

#chartsHeader{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #30414a;
}

#chartsHeader button{
    margin-left:auto;
}

#chartsFrame{
    width:100%;
    height:calc(100% - 48px);
    border:0;
    background:white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #topbar{
        gap:5px;
        padding:0 7px;
    }

    #logo{
        font-size:11px;
        margin-right:2px;
    }

    #topbar > button{
        padding:7px 8px;
        font-size:10px;
    }

    #topbar > button:nth-of-type(3),
    #topbar > button:nth-of-type(4){
        display:none;
    }

    #status{
        display:none;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .panel{
        top:64px;
        left:7px;
        right:7px;
        width:auto;
        max-width:none;
        max-height:calc(100vh - 72px);
    }

    #routeBar{
        bottom:
            calc(8px + env(safe-area-inset-bottom));
    }

    #mapControls{
        bottom:
            calc(75px + env(safe-area-inset-bottom));
    }

    #zoomLabel{
        bottom:
            calc(210px + env(safe-area-inset-bottom));
    }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<div id="topbar">

    <div id="logo">
        ✈ <span>vPilot Reimagined</span>
    </div>

    <button onclick="openPlanner()">
        Flight Planning
    </button>

    <button onclick="openCharts()">
        Airport Charts
    </button>

    <button onclick="undoWaypoint()">
        Undo
    </button>

    <button onclick="clearRoute()">
        Clear Route
    </button>

    <div id="status">
        Loading PTFS map...
    </div>

</div>


<!-- =========================
     MAP
========================= -->

<div id="map">

    <div id="world">

        <img
            id="chart"
            src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"
            draggable="false"
            alt="PTFS Enroute Chart"
        >

        <svg
            id="routeLayer"
            viewBox="0 0 2400 1600"
            preserveAspectRatio="none"
        >

            <polyline
                id="routeShadow"
                points=""
            ></polyline>

            <polyline
                id="routeLine"
                points=""
            ></polyline>

            <g id="routeDots"></g>

        </svg>

        <!--
            Real waypoint tap targets are created here.
            Random map clicks are NOT accepted.
        -->
        <div id="waypointLayer"></div>

        <div id="clickLayer"></div>

    </div>

</div>


<!-- =========================
     ZOOM
========================= -->

<div id="zoomLabel">
    100%
</div>

<div id="mapControls">

    <button onclick="zoomMap(1.2)">+</button>
    <button onclick="zoomMap(.833333)">−</button>
    <button onclick="resetMap()">⟳</button>

</div>


<!-- =========================
     MOBILE ROUTE BAR
========================= -->

<div id="routeBar">

    <div
        class="routeStatus"
        id="routeBarText"
    >
        Select a waypoint
    </div>

    <button onclick="undoWaypoint()">
        Undo
    </button>

    <button onclick="finishWaypointMode()">
        Finish
    </button>

    <button onclick="clearRoute()">
        Clear
    </button>

</div>


<!-- =========================
     FLIGHT PLANNER
========================= -->

<div id="planner" class="panel">

    <div class="panelHeader">

        Flight Planning

        <button
            class="close"
            onclick="closePlanner()"
        >
            ×
        </button>

    </div>

    <div class="panelBody">

        <div class="grid">

            <div class="field">
                <label>Departure</label>

                <select id="departure">
                    <option>IRFD</option>
                    <option>IPPH</option>
                    <option>ITKO</option>
                    <option>IMLR</option>
                    <option>ILKL</option>
                    <option>IZOL</option>
                    <option>IJAF</option>
                    <option>IBAR</option>
                    <option>IHEN</option>
                    <option>ILAR</option>
                    <option>IPAP</option>
                    <option>IGAR</option>
                    <option>IBLT</option>
                    <option>IBTH</option>
                    <option>ISAU</option>
                    <option>ISKP</option>
                    <option>IGRV</option>
                </select>
            </div>

            <div class="field">
                <label>Arrival</label>

                <select id="arrival">
                    <option>IPPH</option>
                    <option>IRFD</option>
                    <option>ITKO</option>
                    <option>IMLR</option>
                    <option>ILKL</option>
                    <option>IZOL</option>
                    <option>IJAF</option>
                    <option>IBAR</option>
                    <option>IHEN</option>
                    <option>ILAR</option>
                    <option>IPAP</option>
                    <option>IGAR</option>
                    <option>IBLT</option>
                    <option>IBTH</option>
                    <option>ISAU</option>
                    <option>ISKP</option>
                    <option>IGRV</option>
                </select>
            </div>

        </div>


        <div class="grid">

            <div class="field">

                <select id="depRunway">

                    <option>25L</option>
                    <option>25C</option>

                    <option>36L</option>
                    <option>36R</option>
                </select>
            </div>

            <div class="field">
                <label>Arrival Runway</label>

                <select id="arrRunway">

                    <option>FL050</option>
                    <option>FL060</option>
                    <option selected>FL070</option>
                    <option>FL080</option>
                    <option>FL090</option>
                    <option>FL100</option>
                    <option>FL110</option>
                    <option>FL120</option>

        </div>


        <button
            class="primary full"
            onclick="enableWaypointMode()"
        >
            ✈ SELECT WAYPOINTS ON MAP
        </button>


        <button
            class="full"
            onclick="finishWaypointMode()"
        >
            FINISH ROUTE
        </button>


        <div class="help">

            <b>Waypoint mode:</b><br>

            The planner closes when waypoint selection starts.
            Only recognized waypoint markers from the PTFS chart
            are selectable. Tapping elsewhere does nothing.

        <div id="routeInfo">

            </span>

        </div>

    </div>

</div>


<!-- =========================
     CHART WINDOW
========================= -->

<div id="charts">

    <div id="chartsHeader">

        <b>
            PTFS Airport Charts
        </b>

        <button onclick="closeCharts()">
            ×
        </button>

    </div>

    <iframe
        id="chartsFrame"
        src="about:blank"
    ></iframe>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

let zoom = 1;

let offsetX = 0;
let offsetY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let originalX = 0;
let originalY = 0;

let waypointMode = false;

let selectedWaypoints = [];

let waypointDatabase = [];


/* =========================================================
   ELEMENTS
========================================================= */

const map =
    document.getElementById("map");

const world =
    document.getElementById("world");

const chart =
    document.getElementById("chart");

const waypointLayer =
    document.getElementById("waypointLayer");

const clickLayer =
    document.getElementById("clickLayer");

const routeLine =
    document.getElementById("routeLine");

const routeShadow =
    document.getElementById("routeShadow");

const routeDots =
    document.getElementById("routeDots");

const status =
    document.getElementById("status");

const routeBar =
    document.getElementById("routeBar");

const routeBarText =
    document.getElementById("routeBarText");


/* =========================================================
   MAP TRANSFORM
========================================================= */

function updateMap(){

    world.style.transform =
        `
        translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${zoom})
        `;

    document.getElementById(
        "zoomLabel"
    ).textContent =
        Math.round(zoom * 100) + "%";

}


/* =========================================================
   ZOOM
========================================================= */

function zoomMap(amount){

    zoom *= amount;

    zoom =
        Math.max(
            .2,
            Math.min(
                6,
                zoom
            )
        );

    updateMap();

}


function resetMap(){

    zoom = 1;

    offsetX = 0;
    offsetY = 0;

    updateMap();

}


/* =========================================================
   MAP DRAG
========================================================= */

map.addEventListener(
    "pointerdown",
    event => {

        if(waypointMode)
            return;

        if(event.target.closest(".waypointHotspot"))
            return;

        dragging = true;

        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;

        originalX =
            offsetX;

        originalY =
            offsetY;

        map.classList.add("dragging");

        try{
            map.setPointerCapture(
                event.pointerId
            );
        }catch(e){}

    }
);


map.addEventListener(
    "pointermove",
    event => {

        if(!dragging)
            return;

        offsetX =
            originalX +
            event.clientX -
            dragStartX;

        offsetY =
            originalY +
            event.clientY -
            dragStartY;

        updateMap();

    }
);


map.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        map.classList.remove(
            "dragging"
        );

    }
);


map.addEventListener(
    "pointercancel",
    () => {

        dragging = false;

        map.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

map.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        zoomMap(
            event.deltaY < 0
                ? 1.12
                : .89
        );

    },
    {
        passive:false
    }
);


/* =========================================================
   WAYPOINT MODE
========================================================= */

function enableWaypointMode(){

    waypointMode = true;

    /*
        THIS IS THE MOBILE FIX:
        close the large planner immediately.
    */

    document.getElementById(
        "planner"
    ).style.display =
        "none";


    /*
        Show small mobile/desktop route bar.
    */

    routeBar.classList.add(
        "active"
    );


    status.textContent =
        "WAYPOINT MODE — SELECT A FIX";


    map.style.cursor =
        "crosshair";


    /*
        Build selectable waypoint overlay.
    */

    buildWaypointHotspots();

}


function finishWaypointMode(){

    waypointMode = false;

    routeBar.classList.remove(
        "active"
    );

    status.textContent =
        "PTFS MAP READY";

    map.style.cursor =
        "grab";

    clearWaypointHotspots();

}


/* =========================================================
   BUILD WAYPOINT HOTSPOTS
========================================================= */

function buildWaypointHotspots(){

    clearWaypointHotspots();


    /*
        If the SVG parser successfully found
        waypoint labels, use those.

        Nothing else on the map is clickable.
    */

    waypointDatabase.forEach(
        waypoint => {

            const hotspot =
                document.createElement(
                    "button"
                );

            hotspot.type =
                "button";

            hotspot.className =
                "waypointHotspot";

            hotspot.title =
                waypoint.name;

            hotspot.dataset.name =
                waypoint.name;

            hotspot.style.left =
                waypoint.x + "px";

            hotspot.style.top =
                waypoint.y + "px";


            hotspot.addEventListener(
                "pointerdown",
                event => {

                    event.stopPropagation();

                }
            );


            hotspot.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    selectWaypoint(
                        waypoint,
                        hotspot
                    );

                }
            );


            waypointLayer.appendChild(
                hotspot
            );

        }
    );

}


function clearWaypointHotspots(){

    waypointLayer.innerHTML = "";

}


/* =========================================================
   SELECT WAYPOINT
========================================================= */

function selectWaypoint(
    waypoint,
    hotspot
){

    if(!waypointMode)
        return;


    /*
        Prevent accidental duplicate selection.
    */

    const alreadySelected =
        selectedWaypoints.some(
            item =>
                item.name ===
                waypoint.name
        );


    if(alreadySelected){

        /*
            Tapping a selected waypoint again
            removes it.
        */

        const index =
            selectedWaypoints.findIndex(
                item =>
                    item.name ===
                    waypoint.name
            );

        if(index !== -1)
            selectedWaypoints.splice(
                index,
                1
            );

        drawRoute();

        rebuildSelectedMarkers();

        updateRouteText();

        return;
    }


    selectedWaypoints.push({

        name: waypoint.name,

        x: waypoint.x,

        y: waypoint.y

    });


    drawRoute();

    rebuildSelectedMarkers();

    updateRouteText();

}


/* =========================================================
   SELECTED MARKERS
========================================================= */

function rebuildSelectedMarkers(){

    clickLayer.innerHTML = "";


    selectedWaypoints.forEach(
        (point,index) => {

            const marker =
                document.createElement(
                    "div"
                );

            marker.className =
                "clickedWaypoint";

            marker.style.left =
                point.x + "px";

            marker.style.top =
                point.y + "px";

            marker.innerHTML =
                `
                <div class="dot"></div>
                ${index + 1}
                `;

            clickLayer.appendChild(
                marker
            );

        }
    );


    /*
        Highlight currently selected
        waypoint hotspots.
    */

    document
        .querySelectorAll(
            ".waypointHotspot"
        )
        .forEach(
            hotspot => {

                hotspot.classList.toggle(
                    "selected",
                    selectedWaypoints.some(
                        point =>
                            point.name ===
                            hotspot.dataset.name
                    )
                );

            }
        );

}


/* =========================================================
   DRAW ROUTE
========================================================= */

function drawRoute(){

    if(
        selectedWaypoints.length === 0
    ){

        routeLine.setAttribute(
            "points",
            ""
        );

        routeShadow.setAttribute(
            "points",
            ""
        );

        routeDots.innerHTML =
            "";

        return;

    }


    const points =
        selectedWaypoints
            .map(
                point =>
                    `${point.x},${point.y}`
            )
            .join(" ");


    routeShadow.setAttribute(
        "points",
        points
    );


    routeLine.setAttribute(
        "points",
        points
    );


    routeDots.innerHTML =
        "";


    selectedWaypoints.forEach(
        point => {

            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute(
                "cx",
                point.x
            );

            circle.setAttribute(
                "cy",
                point.y
            );

            circle.setAttribute(
                "r",
                8
            );

            circle.setAttribute(
                "class",
                "routePoint"
            );

            routeDots.appendChild(
                circle
            );

        }
    );

}


/* =========================================================
   ROUTE TEXT
========================================================= */

function updateRouteText(){

    const text =
        document.getElementById(
            "routeText"
        );


    if(
        selectedWaypoints.length === 0
    ){

        text.textContent =
            "No waypoints selected.";

        routeBarText.textContent =
            "Select a waypoint";

        return;

    }


    const route =
        selectedWaypoints
            .map(
                point =>
                    point.name
            )
            .join(" → ");


    text.innerHTML =
        `
        <span class="purple">
            ${escapeHTML(route)}
        </span>
        `;


    routeBarText.textContent =
        route;

}


/* =========================================================
   UNDO
========================================================= */

function undoWaypoint(){

    if(
        selectedWaypoints.length === 0
    )
        return;


    selectedWaypoints.pop();

    drawRoute();

    rebuildSelectedMarkers();

    updateRouteText();

}


/* =========================================================
   CLEAR ROUTE
========================================================= */

function clearRoute(){

    selectedWaypoints = [];

    clickLayer.innerHTML =
        "";

    drawRoute();

    rebuildSelectedMarkers();

    updateRouteText();

}

   PLANNER
========================================================= */

function openPlanner(){

}


function closePlanner(){

    document.getElementById(

/* =========================================================
   SVG WAYPOINT EXTRACTION
========================================================= */

/*
    The chart is an SVG file.

    We fetch the SVG separately and inspect
    its text/tspan/title elements.

    IMPORTANT:
    We do NOT accept arbitrary clicks.

    Only labels which look like PTFS waypoint
    identifiers become clickable.
*/

async function loadWaypointDatabase(){

    status.textContent =
        "Loading PTFS waypoints...";


    try{

        const response =
            await fetch(
                chart.src,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "SVG HTTP " +
                response.status
            );


        const svgText =
            await response.text();


        const parser =
            new DOMParser();


        const svg =
            parser.parseFromString(
                svgText,
                "image/svg+xml"
            );


        const candidates = [];


        /*
            Search text elements.
        */

        svg
            .querySelectorAll(
                "text,tspan,title"
            )
            .forEach(
                element => {

                    const raw =
                        (
                            element.textContent ||
                            ""
                        )
                        .trim()
                        .toUpperCase();


                    /*
                        PTFS enroute waypoint
                        identifiers are normally
                        compact uppercase identifiers.

                        We intentionally reject
                        ordinary words and long
                        sentences.
                    */

                    if(
                        !/^[A-Z0-9]{3,6}$/.test(
                            raw
                        )
                    )
                        return;


                    /*
                        Avoid obvious airport/runway
                        labels where possible.
                    */

                    if(
                        /^RWY/.test(raw) ||
                        /^ILS/.test(raw)
                    )
                        return;


                    let x =
                        parseFloat(
                            element.getAttribute("x")
                        );

                    let y =
                        parseFloat(
                            element.getAttribute("y")
                        );


                    /*
                        Some SVGs place coordinates
                        on the parent <text> element.
                    */

                    if(
                        (
                            !Number.isFinite(x) ||
                            !Number.isFinite(y)
                        ) &&
                        element.parentElement
                    ){

                        x =
                            parseFloat(
                                element.parentElement
                                    .getAttribute("x")
                            );

                        y =
                            parseFloat(
                                element.parentElement
                                    .getAttribute("y")
                            );

                    }


                    if(
                        !Number.isFinite(x) ||
                        !Number.isFinite(y)
                    )
                        return;


                    candidates.push({

                        name:raw,

                        x:x,

                        y:y

                    });

                }
            );


        /*
            Remove duplicates.
        */

        const unique =
            new Map();


        candidates.forEach(
            item => {

                const key =
                    item.name +
                    ":" +
                    Math.round(item.x) +
                    ":" +
                    Math.round(item.y);


                if(
                    !unique.has(key)
                )
                    unique.set(
                        key,
                        item
                    );

            }
        );


        waypointDatabase =
            Array.from(
                unique.values()
            );


        /*
            Only accept points inside the
            actual map.
        */

        waypointDatabase =
            waypointDatabase.filter(
                point =>
                    point.x >= 0 &&
                    point.x <= 2400 &&
                    point.y >= 0 &&
                    point.y <= 1600
            );


        if(
            waypointDatabase.length === 0
        ){

            status.textContent =
                "PTFS MAP READY — waypoint overlay unavailable";

            /*
                IMPORTANT:
                We DO NOT fall back to arbitrary clicks.

                This preserves your "only waypoints"
                requirement.
            */

            return;

        }


        status.textContent =
            "PTFS MAP READY — " +
            waypointDatabase.length +
            " waypoint markers";


    }catch(error){

        console.error(
            "Waypoint database error:",
            error
        );


        status.textContent =
            "PTFS MAP READY — waypoint data unavailable";

        /*
            No random-click fallback.
        */

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   CHART LOAD
========================================================= */

chart.addEventListener(
    "load",
    () => {

        status.textContent =
            "PTFS MAP READY";

        loadWaypointDatabase();

    }
);


chart.addEventListener(
    "error",
    () => {

        status.textContent =
            "PTFS MAP FAILED TO LOAD";

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

updateMap();

loadWaypointDatabase();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PTFS Flight Planner</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#d9e1e5;
}

#topbar{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:#071018;
    color:#fff;
    border-bottom:1px solid #40515b;
}

.logo{
    font-size:17px;
    font-weight:800;
    margin-right:8px;
}

.logo span{
    color:#ffb000;
}

button{
    border:1px solid #405862;
    background:#142731;
    color:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
}

button:hover{
    background:#1e3947;
}

.primary{
    background:#12699b;
}

#status{
    margin-left:auto;
    font-size:11px;
    color:#9ba9b0;
}

#map{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#d9e1e5;
    cursor:grab;
    touch-action:none;
}

#map.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;
    width:2200px;
    height:1400px;
    left:50%;
    top:50%;
    transform-origin:center;
}

#chart{
    position:absolute;
    inset:0;
}

#chart img{
    width:100%;
    height:100%;
    display:block;
    user-select:none;
    pointer-events:none;
}

/*
=========================================================
WAYPOINTS
=========================================================
*/

#waypointLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.wp{
    position:absolute;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:10px;
    font-weight:bold;
    color:#17242b;
    text-shadow:
        0 1px 2px white,
        0 -1px 2px white;
}

.wpDot{
    width:8px;
    height:8px;
    margin:auto;
    border-radius:50%;
    background:#fff;
    border:2px solid #222;
}

/*
=========================================================
ROUTE
=========================================================
*/

#routeSvg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
}

#routeLine{
    fill:none;
    stroke:#ffae00;
    stroke-width:6;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 1px 2px #000);
}

.routeDot{
    fill:#ffae00;
    stroke:#111;
    stroke-width:3;
}

/*
=========================================================
AIRCRAFT
=========================================================
*/

#aircraftLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.aircraft{
    position:absolute;
    width:64px;
    height:64px;
    transform:translate(-50%,-50%);
    pointer-events:auto;
    cursor:pointer;
}

.aircraft svg{
    width:64px;
    height:64px;
    filter:drop-shadow(0 2px 3px #000);
}

.aircraftLabel{
    position:absolute;
    left:38px;
    top:3px;
    white-space:nowrap;
    padding:3px 6px;
    border-radius:4px;
    background:#071018e8;
    color:white;
    border:1px solid #536773;
    font-size:10px;
    font-weight:bold;
}

/*
=========================================================
PANELS
=========================================================
*/

.panel{
    position:fixed;
    z-index:2000;
    top:70px;
    left:12px;
    width:430px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 82px);
    overflow:auto;
    display:none;
    background:#071018f8;
    color:white;
    border:1px solid #405862;
    border-radius:12px;
    box-shadow:0 20px 70px #000b;
}

.panelHeader{
    padding:12px;
    border-bottom:1px solid #30424d;
    font-weight:bold;
}

.panelBody{
    padding:12px;
}

.close{
    float:right;
    padding:0;
    background:none;
    border:0;
    font-size:23px;
    color:#9aa8af;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.field{
    margin-bottom:10px;
}

.field label{
    display:block;
    margin-bottom:4px;
    color:#8c9ca4;
    font-size:9px;
    text-transform:uppercase;
}

select,input{
    width:100%;
    padding:9px;
    border:1px solid #405862;
    border-radius:7px;
    background:#101d25;
    color:white;
    outline:none;
}

.full{
    width:100%;
    margin-top:7px;
}

#routeResult{
    display:none;
    margin-top:12px;
    padding:11px;
    background:#101d25;
    border:1px solid #405862;
    border-radius:8px;
    color:#ffbd32;
    font-size:11px;
    line-height:1.65;
}

#aircraftInfo{
    position:fixed;
    z-index:2000;
    right:12px;
    top:70px;
    width:300px;
    display:none;
    background:#071018f8;
    color:white;
    border:1px solid #405862;
    border-radius:12px;
    box-shadow:0 20px 70px #000b;
}

.info{
    padding:13px;
}

.infoTitle{
    font-size:20px;
    font-weight:bold;
}

.infoLine{
    margin-top:7px;
    color:#91a0a8;
    font-size:12px;
}

/*
=========================================================
ZOOM
=========================================================
*/

#zoomControls{
    position:fixed;
    z-index:500;
    right:12px;
    bottom:12px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.zoomBtn{
    width:40px;
    height:40px;
    padding:0;
    font-size:20px;
}

#zoomText{
    position:fixed;
    right:12px;
    bottom:145px;
    z-index:500;
    padding:5px 8px;
    background:#071018dd;
    border-radius:5px;
    color:#91a0a8;
    font-size:10px;
}
</style>
</head>

<body>

<div id="topbar">

    <div class="logo">
        ✈ PTFS <span>Flight Planner</span>
    </div>

    <button onclick="openPlanner()">
        📝 Flight Plan
    </button>

    <button onclick="clearRoute()">
        Clear Route
    </button>

    <div id="status">
        PTFS chart loaded
    </div>

</div>


<div id="map">

    <div id="world">

        <!-- ACTUAL PTFS ENROUTE CHART -->
        <div id="chart">
            <img
                src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Airspace%20Map.svg"
                alt="PTFS Enroute Chart"
                draggable="false"
            >
        </div>


        <div id="waypointLayer"></div>


        <svg
            id="routeSvg"
            viewBox="0 0 2200 1400"
            preserveAspectRatio="none"
        >
            <polyline id="routeLine"></polyline>
            <g id="routeDots"></g>
        </svg>


        <div id="aircraftLayer"></div>

    </div>

</div>


<!-- FLIGHT PLANNER -->

<div id="planner" class="panel">

    <div class="panelHeader">
        PTFS Flight Planner

        <button class="close" onclick="closePlanner()">×</button>
    </div>

    <div class="panelBody">

        <div class="grid">

            <div class="field">
                <label>Departure</label>
                <select id="departure"></select>
            </div>

            <div class="field">
                <label>Arrival</label>
                <select id="arrival"></select>
            </div>

        </div>


        <div class="grid">

            <div class="field">
                <label>Departure runway</label>
                <select id="depRunway"></select>
            </div>

            <div class="field">
                <label>Arrival runway</label>
                <select id="arrRunway"></select>
            </div>

        </div>


        <div class="grid">

            <div class="field">
                <label>SID</label>
                <select id="sid"></select>
            </div>

            <div class="field">
                <label>STAR</label>
                <select id="star"></select>
            </div>

        </div>


        <div class="grid">

            <div class="field">
                <label>Aircraft</label>
                <select id="aircraft"></select>
            </div>

            <div class="field">
                <label>Flight level</label>
                <select id="flightLevel"></select>
            </div>

        </div>


        <div class="field">
            <label>Enroute waypoints</label>

            <input
                id="routeInput"
                placeholder="JAMSI BANBA TINDR"
            >
        </div>


        <button
            class="full primary"
            onclick="generateFlightPlan()"
        >
            ✈ Generate Flight Plan
        </button>


        <button
            class="full"
            onclick="clearRoute()"
        >
            Clear Route
        </button>


        <div id="routeResult"></div>

    </div>

</div>


<!-- AIRCRAFT INFO -->

<div id="aircraftInfo">

    <div class="panelHeader">

        Aircraft

        <button
            class="close"
            onclick="closeAircraftInfo()"
        >
            ×
        </button>

    </div>

    <div class="info">

        <div
            id="infoCallsign"
            class="infoTitle"
        >
            Aircraft
        </div>

        <div
            id="infoUsername"
            class="infoLine"
        >
            Roblox: -
        </div>

        <div
            id="infoType"
            class="infoLine"
        >
            Aircraft: -
        </div>

        <div
            id="infoAirline"
            class="infoLine"
        >
            Airline: -
        </div>

        <div
            id="infoHeading"
            class="infoLine"
        >
            Heading: -
        </div>

        <div
            id="infoAltitude"
            class="infoLine"
        >
            Altitude: -
        </div>

    </div>

</div>


<div id="zoomText">100%</div>


<div id="zoomControls">

    <button class="zoomBtn" onclick="zoomIn()">+</button>
    <button class="zoomBtn" onclick="zoomOut()">−</button>
    <button class="zoomBtn" onclick="resetMap()">⟳</button>

</div>


<script>

/*
=========================================================
AIRPORT DATABASE
=========================================================
*/

const AIRPORTS = {

    IRFD:"Greater Rockford",
    IMLR:"Mellor",
    IPPH:"Perth",
    ITKO:"Tokyo",
    ILKL:"Lukla",
    IZOL:"Izolirani",
    IJAF:"Al Najaf",
    ISCM:"RAF Scampton",
    IBTH:"Saint Barthélemy",
    IDCS:"Saba",
    ISKP:"Skopelos",
    ISAU:"Sauthemptona",
    IGAR:"Garry",
    IBLT:"Bolton",
    IBAR:"Barra",
    IHEN:"Henstridge",
    IIAB:"McConnell",
    ILAR:"Larnaca",
    IPAP:"Paphos",
    IGRV:"Grindavik",
    ITRC:"Training Centre",
    IUFO:"Abandoned Airfield"
};


/*
=========================================================
RUNWAYS

These are intentionally kept separate so you can
change them without touching the route engine.
=========================================================
*/

const RUNWAYS = {

    IRFD:["18L","18R","36L","36R","06","24"],
    IMLR:["14","32"],
    IPPH:["03","21"],
    ITKO:["16L","16R","34L","34R"],
    ILKL:["12","30"],
    IZOL:["05","23"],
    IJAF:["09","27"],
    ISCM:["08","26"],
    IBTH:["10","28"],
    IDCS:["12","30"],
    ISKP:["02","20"],
    ISAU:["03","21"],
    IGAR:["09","27"],
    IBLT:["12","30"],
    IBAR:["06","24"],
    IHEN:["09","27"],
    IIAB:["18","36"],
    ILAR:["04","22"],
    IPAP:["16","34"],
    IGRV:["10","28"],
    ITRC:["09","27"],
    IUFO:["09","27"]
};


/*
=========================================================
WAYPOINT COORDINATES

These are map coordinates in our 2200x1400 chart
coordinate system.

The important part is that they are now rendered
ON TOP of the actual enroute chart.

You can expand this list later.
=========================================================
*/

const WAYPOINTS = {

    TINDR:[1120,270],
    JAMSI:[910,735],
    BANBA:[1050,735],

    INABI:[1040,300],
    SHV:[1220,315],
    EURAD:[1290,370],
    BRAIN:[1390,400],
    KELLA:[1470,430],
    ELMAS:[1550,470],
    TUDEP:[1630,505],
    NOONU:[1710,540],

    UWAIS:[1190,560],
    RESUR:[1080,590],
    AVBIT:[980,620],
    GVK:[850,615],
    SEAHA:[760,650],
    EZYDB:[680,690],
    WELSH:[610,735],
    DUNKS:[540,775],

    VONAR:[820,770],
    BORDO:[930,815],
    OLESA:[1030,840],
    STRAX:[1130,860],
    GULEG:[1240,890],
    SQUID:[1360,920],
    CROIS:[1470,950],
    ONDER:[1580,970],
    ZESTA:[1690,990],
    AKASE:[1800,1010],
    NIKON:[1900,1050],

    CRAZY:[1770,1120],
    HONDA:[1660,1150],
    WOTAN:[1540,1170],
    ASTRO:[1420,1190],
    GARDE:[1300,1210],
    SHIBA:[1180,1230],
    LETSE:[1060,1245],
    BULLY:[940,1260],
    LOGAN:[820,1275],

    CYRUS:[770,860],
    LEGOS:[900,820],
    MOGTA:[1010,800],
    RENTS:[1080,750],

    FORIA:[690,940],
    BEANS:[620,900],
    ANYMS:[850,950],
    BAMOS:[960,980],
    KAVEL:[1080,1010],
    BOLRO:[1200,980],
    HOGGS:[1320,960],
    HUNTE:[1440,930],
    MUONE:[1550,900],
    JAZZR:[1670,930],

    REAPR:[570,830],
    DIR:[660,800],
    TRELN:[740,760],
    DEATH:[830,720],
    ROBUX:[930,680],
    FORCE:[1030,640],
    ALTRS:[1140,600],
    MASEV:[1250,570]
};


/*
=========================================================
AIRCRAFT
=========================================================
*/

const AIRCRAFT = [

    "A220",
    "A318",
    "A319",
    "A320",
    "A321",
    "A330",
    "A330F",
    "A340",
    "A350",
    "A380",

    "737",
    "747",
    "757",
    "767",
    "777",
    "787",

    "ATR",
    "Dash 8",
    "CRJ",
    "E190",

    "MD-11",
    "DC-10",
    "L-1011",
    "B-1",
    "KC-1",
    "AN-225",
    "Beluga",
    "SR-71",
    "C-130",
    "Chinook",
    "Piper Cub"
];


/*
=========================================================
SID / STAR DATABASE

This is deliberately structured so we can replace
the entries with the exact current AeroNav procedure
database later without changing the UI.
=========================================================
*/

const PROCEDURES = {

    IRFD:{

        SID:[
            "NONE",
            "JAMSI",
            "FORIA",
            "CYRUS"
        ],

        STAR:[
            "NONE",
            "BANBA",
            "TINDR",
            "MOGTA"
        ]

    },

    IPPH:{

        SID:[
            "NONE",
            "BANBA",
            "TINDR"
        ],

        STAR:[
            "NONE",
            "JAMSI",
            "FORIA",
            "GULEG"
        ]

    }

};


/*
=========================================================
MAP STATE
=========================================================
*/

let scale=1;
let offsetX=0;
let offsetY=0;

let dragging=false;

let dragStartX=0;
let dragStartY=0;

let initialOffsetX=0;
let initialOffsetY=0;


const world=
    document.getElementById("world");

const map=
    document.getElementById("map");


function updateTransform(){

    world.style.transform =
        `translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        ) scale(${scale})`;

    document.getElementById("zoomText")
        .textContent =
        Math.round(scale*100)+"%";
}


function zoomIn(){

    scale =
        Math.min(
            4,
            scale*1.2
        );

    updateTransform();
}


function zoomOut(){

    scale =
        Math.max(
            .35,
            scale/1.2
        );

    updateTransform();
}


function resetMap(){

    scale=1;
    offsetX=0;
    offsetY=0;

    updateTransform();
}


/*
=========================================================
PAN
=========================================================
*/

map.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        dragStartX=e.clientX;
        dragStartY=e.clientY;

        initialOffsetX=offsetX;
        initialOffsetY=offsetY;

        map.classList.add("dragging");

        map.setPointerCapture(
            e.pointerId
        );

    }
);


map.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;

        offsetX =
            initialOffsetX +
            (e.clientX-dragStartX);

        offsetY =
            initialOffsetY +
            (e.clientY-dragStartY);

        updateTransform();

    }
);


map.addEventListener(
    "pointerup",
    ()=>{

        dragging=false;

        map.classList.remove(
            "dragging"
        );

    }
);


map.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        if(e.deltaY<0)
            zoomIn();
        else
            zoomOut();

    },
    {passive:false}
);


/*
=========================================================
WAYPOINT RENDERING
=========================================================
*/

function renderWaypoints(){

    const layer =
        document.getElementById(
            "waypointLayer"
        );

    layer.innerHTML="";

    for(
        const [name,position]
        of Object.entries(WAYPOINTS)
    ){

        const el =
            document.createElement(
                "div"
            );

        el.className="wp";

        el.style.left =
            position[0]+"px";

        el.style.top =
            position[1]+"px";

        el.innerHTML =
            `
            <div class="wpDot"></div>
            ${name}
            `;

        layer.appendChild(el);
    }
}


/*
=========================================================
PLANNER INITIALIZATION
=========================================================
*/

function initPlanner(){

    const dep =
        document.getElementById(
            "departure"
        );

    const arr =
        document.getElementById(
            "arrival"
        );

    for(
        const [icao,name]
        of Object.entries(AIRPORTS)
    ){

        dep.add(
            new Option(
                `${icao} — ${name}`,
                icao
            )
        );

        arr.add(
            new Option(
                `${icao} — ${name}`,
                icao
            )
        );

    }

    dep.value="IRFD";
    arr.value="IPPH";


    const aircraft =
        document.getElementById(
            "aircraft"
        );

    AIRCRAFT.forEach(
        type=>{
            aircraft.add(
                new Option(
                    type,
                    type
                )
            );
        }
    );


    const levels =
        document.getElementById(
            "flightLevel"
        );

    /*
        PTFS levels.
        We don't stop at FL250.
    */

    for(
        let fl=10;
        fl<=150;
        fl+=10
    ){

        const code =
            String(fl)
            .padStart(3,"0");

        levels.add(
            new Option(
                "FL"+code,
                "FL"+code
            )
        );

    }

    levels.value="FL070";


    updateRunways();
}


/*
=========================================================
RUNWAYS
=========================================================
*/

function updateRunways(){

    const dep =
        document.getElementById(
            "departure"
        ).value;

    const arr =
        document.getElementById(
            "arrival"
        ).value;

    fillSelect(
        "depRunway",
        RUNWAYS[dep] || []
    );

    fillSelect(
        "arrRunway",
        RUNWAYS[arr] || []
    );

    updateProcedures();
}


function fillSelect(
    id,
    values
){

    const select =
        document.getElementById(id);

    select.innerHTML="";

    values.forEach(
        value=>{
            select.add(
                new Option(
                    value,
                    value
                )
            );
        }
    );
}


/*
=========================================================
PROCEDURES
=========================================================
*/

function updateProcedures(){

    const dep =
        document.getElementById(
            "departure"
        ).value;

    const arr =
        document.getElementById(
            "arrival"
        ).value;


    const sidValues =
        PROCEDURES[dep]?.SID ||
        ["NONE"];

    const starValues =
        PROCEDURES[arr]?.STAR ||
        ["NONE"];


    fillSelect(
        "sid",
        sidValues
    );

    fillSelect(
        "star",
        starValues
    );
}


document
    .getElementById("departure")
    .addEventListener(
        "change",
        updateRunways
    );


document
    .getElementById("arrival")
    .addEventListener(
        "change",
        updateRunways
    );


/*
=========================================================
ROUTE ENGINE
=========================================================
*/

function generateFlightPlan(){

    const dep =
        document.getElementById(
            "departure"
        ).value;

    const arr =
        document.getElementById(
            "arrival"
        ).value;

    const depRunway =
        document.getElementById(
            "depRunway"
        ).value;

    const arrRunway =
        document.getElementById(
            "arrRunway"
        ).value;

    const sid =
        document.getElementById(
            "sid"
        ).value;

    const star =
        document.getElementById(
            "star"
        ).value;

    const aircraft =
        document.getElementById(
            "aircraft"
        ).value;

    const flightLevel =
        document.getElementById(
            "flightLevel"
        ).value;

    const raw =
        document.getElementById(
            "routeInput"
        ).value
        .trim()
        .toUpperCase();


    /*
        Parse manually entered fixes.
    */

    const fixes =
        raw
        ? raw.split(
            /[\s,]+/
          ).filter(Boolean)
        : [];


    /*
        Validate waypoint names.
    */

    const validFixes=[];

    const invalidFixes=[];

    fixes.forEach(
        fix=>{

            if(
                WAYPOINTS[fix]
            ){

                validFixes.push(
                    fix
                );

            }else{

                invalidFixes.push(
                    fix
                );

            }

        }
    );


    /*
        Build route.
    */

    const route=[];


    route.push(
        dep
    );


    if(sid !== "NONE")
        route.push(sid);


    validFixes.forEach(
        fix=>{
            route.push(fix);
        }
    );


    if(star !== "NONE")
        route.push(star);


    route.push(
        arr
    );


    /*
        Draw only the points we actually know.
    */

    drawRoute(
        validFixes
    );


    /*
        Create route text.
    */

    const routeText =
        route.join(" → ");


    const result =
        document.getElementById(
            "routeResult"
        );

    result.style.display="block";


    result.innerHTML =
        `
        <b>ROUTE</b><br>
        ${escapeHTML(routeText)}

        <br><br>

        <b>DEPARTURE</b><br>
        ${dep} / RWY ${depRunway || "—"}

        <br><br>

        <b>SID</b><br>
        ${sid}

        <br><br>

        <b>ARRIVAL</b><br>
        ${arr} / RWY ${arrRunway || "—"}

        <br><br>

        <b>STAR</b><br>
        ${star}

        <br><br>

        <b>AIRCRAFT</b><br>
        ${aircraft}

        <br>

        <b>CRUISE</b><br>
        ${flightLevel}

        ${
            invalidFixes.length
            ?
            `
            <br><br>
            <b>UNKNOWN FIXES</b><br>
            ${escapeHTML(
                invalidFixes.join(", ")
            )}
            `
            :
            ""
        }
        `;


    /*
        Save the plan locally so refreshing
        doesn't immediately destroy it.
    */

    localStorage.setItem(
        "ptfsFlightPlan",
        JSON.stringify({
            dep,
            arr,
            depRunway,
            arrRunway,
            sid,
            star,
            aircraft,
            flightLevel,
            fixes:validFixes
        })
    );
}


/*
=========================================================
DRAW ROUTE
=========================================================
*/

function drawRoute(
    fixes
){

    const line =
        document.getElementById(
            "routeLine"
        );

    const points =
        fixes
        .filter(
            fix=>WAYPOINTS[fix]
        )
        .map(
            fix =>
                WAYPOINTS[fix]
                .join(",")
        );


    line.setAttribute(
        "points",
        points.join(" ")
    );


    const dots =
        document.getElementById(
            "routeDots"
        );

    dots.innerHTML="";


    fixes.forEach(
        fix=>{

            const position =
                WAYPOINTS[fix];

            if(!position)
                return;


            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );

            circle.setAttribute(
                "cx",
                position[0]
            );

            circle.setAttribute(
                "cy",
                position[1]
            );

            circle.setAttribute(
                "r",
                8
            );

            circle.setAttribute(
                "class",
                "routeDot"
            );

            dots.appendChild(
                circle
            );

        }
    );
}


/*
=========================================================
CLEAR ROUTE
=========================================================
*/

function clearRoute(){

    document
        .getElementById(
            "routeLine"
        )
        .setAttribute(
            "points",
            ""
        );

    document
        .getElementById(
            "routeDots"
        )
        .innerHTML="";

    document
        .getElementById(
            "routeResult"
        )
        .style.display="none";

    localStorage.removeItem(
        "ptfsFlightPlan"
    );
}


/*
=========================================================
LOAD SAVED PLAN
=========================================================
*/

function loadSavedPlan(){

    const saved =
        localStorage.getItem(
            "ptfsFlightPlan"
        );

    if(!saved)
        return;


    try{

        const plan =
            JSON.parse(saved);


        document
            .getElementById("departure")
            .value =
            plan.dep;

        document
            .getElementById("arrival")
            .value =
            plan.arr;


        updateRunways();


        document
            .getElementById("depRunway")
            .value =
            plan.depRunway;


        document
            .getElementById("arrRunway")
            .value =
            plan.arrRunway;


        updateProcedures();


        document
            .getElementById("sid")
            .value =
            plan.sid;


        document
            .getElementById("star")
            .value =
            plan.star;


        document
            .getElementById("aircraft")
            .value =
            plan.aircraft;


        document
            .getElementById("flightLevel")
            .value =
            plan.flightLevel;


        document
            .getElementById("routeInput")
            .value =
            plan.fixes.join(" ");


        generateFlightPlan();

    }catch(e){

        console.warn(
            "Could not load saved plan",
            e
        );

    }
}

const aircraftLayer =

function addAircraft(

){

    el.style.top =

                L43 41
                L16 67
                L22 73
                L43 59
                L43 91
                L50 98
                L57 91
                L57 59
                L78 73
                L84 67
                L57 41

/*
=========================================================
UTILS
=========================================================
*/

function escapeHTML(
    value
){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function openPlanner(){

    document
        .getElementById(
            "planner"
        )
        .style.display =
        "block";
}


function closePlanner(){

    document
        .getElementById(
            "planner"
        )
        .style.display =
        "none";
}

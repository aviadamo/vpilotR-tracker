<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTFS Tracker</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        .map {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
        }

        img {
            width: 100%;
            height: auto;
            min-width: 900px;
        }
    </style>
</head>

<body>

<div class="map">
    <img
        src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Airspace%20Map.svg"
        alt="PTFS Airspace Map"
    >
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PTFS Flight Planner</title>
<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#091018;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}
button,input,select{
    font:inherit;
}
button{
    cursor:pointer;
}
/* TOP */
#top{
    position:fixed;
    z-index:1000;
    left:0;
    right:0;
    top:0;
    height:58px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:rgba(7,12,18,.97);
    border-bottom:1px solid #304252;
}
.logo{
    font-weight:800;
    white-space:nowrap;
}
.logo span{
    color:#ffb000;
}
.topBtn{
    border:1px solid #35495a;
    background:#121d27;
    color:#fff;
    border-radius:7px;
    padding:8px 11px;
}
.topBtn.active{
    background:#1d507b;
    border-color:#4b94cc;
}
#status{
    margin-left:auto;
    color:#7f909e;
    font-size:11px;
}
/* MAP */
#map{
    position:fixed;
    left:0;
    right:0;
    top:58px;
    bottom:0;
    overflow:hidden;
    background:#101923;
    touch-action:none;
}
#world{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    transform-origin:50% 50%;
}
#enroute{
    position:absolute;
    width:1700px;
    max-width:none;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    user-select:none;
    pointer-events:none;
}
/* ROUTE */
#routeSVG{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
    pointer-events:none;
}
#routePath{
    fill:none;
    stroke:#ffb000;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 4px rgba(255,176,0,.8));
}
/* NAV POINTS */
.point{
    position:absolute;
    width:10px;
    height:10px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#ff9f00;
    border:1px solid #ffe3a1;
    box-shadow:0 0 6px rgba(255,159,0,.75);
    z-index:20;
    cursor:pointer;
}
.point.airport{
    width:14px;
    height:14px;
    background:#fff;
    border:2px solid #56adff;
    box-shadow:0 0 8px rgba(86,173,255,.8);
}
.pointLabel{
    position:absolute;
    left:13px;
    top:-5px;
    color:#fff;
    font-size:9px;
    font-weight:600;
    white-space:nowrap;
    text-shadow:0 1px 4px #000;
    pointer-events:none;
}
/* AIRCRAFT */
.aircraft{
    position:absolute;
    width:55px;
    height:55px;
    transform:translate(-50%,-50%);
    z-index:100;
    cursor:pointer;
}
.aircraft img{
    position:absolute;
    left:50%;
    top:50%;
    width:43px;
    height:43px;
    object-fit:contain;
    transform-origin:center;
}
.aircraftTag{
    position:absolute;
    left:42px;
    top:7px;
    padding:3px 6px;
    border-radius:5px;
    background:rgba(4,9,14,.95);
    border:1px solid #344857;
    color:#fff;
    font-size:10px;
    white-space:nowrap;
}
/* CONTROLS */
#controls{
    position:fixed;
    right:13px;
    bottom:15px;
    z-index:300;
    display:flex;
    flex-direction:column;
    gap:6px;
}
#controls button{
    width:42px;
    height:42px;
    border-radius:8px;
    border:1px solid #3a4d5d;
    background:rgba(7,13,19,.95);
    color:white;
    font-size:20px;
}
#zoomLevel{
    position:fixed;
    right:15px;
    bottom:155px;
    z-index:300;
    background:rgba(7,13,19,.9);
    padding:4px 7px;
    border-radius:5px;
    color:#8d9ba6;
    font-size:10px;
}
/* PANELS */
.panel{
    position:fixed;
    z-index:500;
    top:70px;
    left:12px;
    width:365px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 84px);
    overflow:auto;
    background:rgba(7,13,19,.98);
    border:1px solid #354858;
    border-radius:12px;
    box-shadow:0 20px 55px rgba(0,0,0,.55);
    display:none;
}
.panelHead{
    display:flex;
    align-items:center;
    padding:13px;
    border-bottom:1px solid #293a49;
}
.panelHead strong{
    font-size:15px;
}
.close{
    margin-left:auto;
    border:0;
    background:none;
    color:#8c9aa5;
    font-size:21px;
}
.panelBody{
    padding:13px;
}
.field{
    margin-bottom:10px;
}
.field label{
    display:block;
    margin-bottom:5px;
    color:#7f909c;
    font-size:9px;
    text-transform:uppercase;
}
.field input,
.field select{
    width:100%;
    padding:9px;
    border-radius:7px;
    border:1px solid #344858;
    background:#111c26;
    color:#fff;
    outline:none;
}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.primary{
    width:100%;
    padding:11px;
    border-radius:7px;
    border:1px solid #4a91c8;
    background:#1c527d;
    color:white;
    font-weight:700;
}
.secondary{
    width:100%;
    margin-top:7px;
    padding:9px;
    border-radius:7px;
    border:1px solid #354858;
    background:#121d27;
    color:#9aa8b3;
}
.result{
    display:none;
    margin-top:12px;
    border-top:1px solid #293a49;
    padding-top:12px;
}
.routeBox{
    padding:10px;
    border-radius:7px;
    border:1px solid #293a49;
    background:#111c26;
    color:#ffbd3d;
    font-size:12px;
    line-height:1.7;
    word-break:break-word;
}
.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    margin-top:8px;
}
.stat{
    padding:8px;
    background:#111c26;
    border:1px solid #293a49;
    border-radius:6px;
}
.stat small{
    display:block;
    color:#71818d;
    font-size:9px;
}
.stat strong{
    display:block;
    margin-top:3px;
}
/* CHART */
#chartPanel{
    position:fixed;
    z-index:700;
    top:70px;
    right:12px;
    bottom:12px;
    width:500px;
    max-width:calc(100vw - 24px);
    background:#071019;
    border:1px solid #354858;
    border-radius:12px;
    overflow:hidden;
    display:none;
}
#chartHead{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #293a49;
}
#chartHead button{
    margin-left:auto;
    border:0;
    background:none;
    color:#8997a2;
    font-size:21px;
}
#chart{
    width:100%;
    height:calc(100% - 48px);
    object-fit:contain;
}
/* AIRCRAFT INFO */
#aircraftPanel{
    position:fixed;
    z-index:800;
    right:12px;
    top:70px;
    width:350px;
    max-width:calc(100vw - 24px);
    background:rgba(7,13,19,.98);
    border:1px solid #354858;
    border-radius:12px;
    overflow:hidden;
    display:none;
}
#aircraftHead{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #293a49;
}
#aircraftHead button{
    margin-left:auto;
    border:0;
    background:none;
    color:#8997a2;
    font-size:21px;
}
.photo{
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#101923;
    color:#657581;
}
.info{
    padding:13px;
}
.big{
    font-size:21px;
    font-weight:800;
}
.blue{
    color:#58adff;
    font-size:12px;
    margin-top:3px;
}
.muted{
    color:#83919c;
    font-size:12px;
    margin-top:5px;
}
/* MOBILE */
@media(max-width:700px){
    #status{
        display:none;
    }
    .logo{
        font-size:13px;
    }
    .topBtn{
        padding:7px;
        font-size:10px;
    }
    #chartPanel{
        left:12px;
        right:12px;
        width:auto;
    }
}
</style>
</head>
<body>
<div id="top">
    <div class="logo">
        ✈ PTFS <span>Flight Planner</span>
    </div>
    <button class="topBtn active" onclick="closeAllPanels()">
        🗺 Map
    </button>
    <button class="topBtn" onclick="openPlanner()">
        📝 Flight Plan
    </button>
    <div id="status">
        Loading PTFS navigation data…
    </div>
</div>
<div id="map">
    <div id="world">
        <!--
        Replace this URL only if you have a preferred
        current PTFS enroute chart image.
        -->
        <img
            id="enroute"
            src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"
            alt="PTFS Enroute Chart"
        >
        <svg id="routeSVG" viewBox="0 0 1000 700">
            <polyline id="routePath"></polyline>
        </svg>
        <div id="navigationLayer"></div>
        <div
            id="aircraft"
            class="aircraft"
            style="left:50%;top:50%"
            onclick="showAircraft()">
            <img id="aircraftIcon">
            <span
                id="aircraftTag"
                class="aircraftTag">
                UAE123
            </span>
        </div>
    </div>
</div>
<!-- FLIGHT PLANNER -->
<div id="planner" class="panel">
    <div class="panelHead">
        <strong>Flight Planner</strong>
        <button
            class="close"
            onclick="closePlanner()">
            ×
        </button>
    </div>
    <div class="panelBody">
        <div class="field">
            <label>Departure airport</label>
            <input
                id="dep"
                placeholder="IRFD">
        </div>
        <div class="field">
            <label>Arrival airport</label>
            <input
                id="arr"
                placeholder="IPPH">
        </div>
        <div class="row">
            <div class="field">
                <label>Departure runway</label>
                <select id="depRwy">
                    <option value="AUTO">Auto</option>
                </select>
            </div>
            <div class="field">
                <label>Arrival runway</label>
                <select id="arrRwy">
                    <option value="AUTO">Auto</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="field">
                <label>SID</label>
                <select id="sid">
                    <option value="">Auto / None</option>
                </select>
            </div>
            <div class="field">
                <label>STAR</label>
                <select id="star">
                    <option value="">Auto / None</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label>Aircraft</label>
            <select id="type">
                <option>A380</option>
                <option>A350</option>
                <option>A340</option>
                <option>A330</option>
                <option>A320</option>
                <option>A321</option>
                <option>777</option>
                <option>787</option>
                <option>747</option>
                <option>737</option>
            </select>
        </div>
        <div class="field">
            <label>Cruise level</label>
            <select id="level">
                <option>FL250</option>
                <option>FL270</option>
                <option>FL290</option>
                <option selected>FL310</option>
                <option>FL330</option>
                <option>FL350</option>
                <option>FL370</option>
                <option>FL390</option>
            </select>
        </div>
        <button
            class="primary"
            onclick="generateRoute()">
            ✈ Generate Route
        </button>
        <button
            class="secondary"
            onclick="clearRoute()">
            Clear Route
        </button>
        <div id="result" class="result">
            <div
                style="color:#7e8d99;font-size:9px;text-transform:uppercase">
                Generated flight plan
            </div>
            <div
                id="routeText"
                class="routeBox"
                style="margin-top:6px">
            </div>
            <div class="stats">
                <div class="stat">
                    <small>Distance</small>
                    <strong id="distance">—</strong>
                </div>
                <div class="stat">
                    <small>Cruise</small>
                    <strong id="cruise">—</strong>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- CHART -->
<div id="chartPanel">
    <div id="chartHead">
        <strong id="chartTitle">
            PTFS Chart
        </strong>
        <button onclick="closeChart()">
            ×
        </button>
    </div>
    <img id="chart">
</div>
<!-- AIRCRAFT -->
<div id="aircraftPanel">
    <div id="aircraftHead">
        <strong>Aircraft</strong>
        <button onclick="closeAircraft()">
            ×
        </button>
    </div>
    <div class="photo">
        <div id="photoText">
            PTFS aircraft photo unavailable
        </div>
    </div>
    <div class="info">
        <div
            id="infoCallsign"
            class="big">
            UAE123
        </div>
        <div
            id="infoUser"
            class="blue">
            Roblox: —
        </div>
        <div
            id="infoAirline"
            class="muted">
            Airline: —
        </div>
        <div
            id="infoType"
            class="muted">
            Aircraft: A380
        </div>
        <div
            id="infoHeading"
            class="muted">
            Heading: 000°
        </div>
    </div>
</div>
<div id="zoomLevel">100%</div>
<div id="controls">
    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>
    <button onclick="resetMap()">⟳</button>
</div>
<script>
/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
    /*
      Put ptfs-data.json beside this HTML file.
      Expected structure:
      {
        "waypoints": {
          "ABC": {
            "x": 0.42,
            "y": 0.31,
            "neighbors": ["DEF","GHI"]
          }
        },
        "airports": {
          "IRFD": {
            "x": 0.22,
            "y": 0.44,
            "runways": ["07L","25R"]
          }
        },
        "procedures": {
          "IRFD": {
            "SIDs": {},
            "STARs": {}
          }
        }
      }
    */
    DATA_URL:"ptfs-data.json",
    ICON_URL:
      "https://raw.githubusercontent.com/RexKramer1/AircraftShapesSVG/main/Shapes%20SVG/"
};
/* =========================================================
   STATE
========================================================= */
let DATA = {
    waypoints:{},
    airports:{},
    procedures:{}
};
let scale = 1;
let panX = 0;
let panY = 0;
let pointers = new Map();
let lastX = 0;
let lastY = 0;
let pinchDistance = null;
let currentRoute = [];
/* =========================================================
   LOAD REAL DATA
========================================================= */
async function loadData(){
    try{
        const response =
            await fetch(CONFIG.DATA_URL);
        if(!response.ok){
            throw new Error(
                "ptfs-data.json not found"
            );
        }
        DATA =
            await response.json();
        renderNavigation();
        document.getElementById(
            "status"
        ).textContent =
            `${Object.keys(DATA.waypoints || {}).length} waypoints loaded`;
    }catch(error){
        console.error(error);
        document.getElementById(
            "status"
        ).textContent =
            "Navigation data missing — add ptfs-data.json";
        /*
          The map still works without the data file.
        */
    }
}
/* =========================================================
   RENDER ALL WAYPOINTS + AIRPORTS
========================================================= */
function renderNavigation(){
    const layer =
        document.getElementById(
            "navigationLayer"
        );
    layer.innerHTML = "";
    for(
        const [name,w]
        of Object.entries(
            DATA.waypoints || {}
        )
    ){
        addPoint(
            name,
            w,
            false
        );
    }
    for(
        const [icao,a]
        of Object.entries(
            DATA.airports || {}
        )
    ){
        addPoint(
            icao,
            a,
            true
        );
    }
}
function addPoint(
    name,
    data,
    airport
){
    const point =
        document.createElement("div");
    point.className =
        airport
        ? "point airport"
        : "point";
    point.style.left =
        `${data.x * 100}%`;
    point.style.top =
        `${data.y * 100}%`;
    const label =
        document.createElement("span");
    label.className =
        "pointLabel";
    label.textContent =
        name;
    point.appendChild(label);
    point.onclick =
        event => {
            event.stopPropagation();
            if(airport){
                openAirport(
                    name
                );
            }else{
                waypointInfo(
                    name,
                    data
                );
            }
        };
    document
        .getElementById(
            "navigationLayer"
        )
        .appendChild(point);
}
/* =========================================================
   MAP
========================================================= */
function updateMap(){
    document.getElementById(
        "world"
    ).style.transform =
        `translate(${panX}px,${panY}px) scale(${scale})`;
    document.getElementById(
        "zoomLevel"
    ).textContent =
        Math.round(scale * 100) + "%";
}
function zoomIn(){
    scale =
        Math.min(
            6,
            scale * 1.25
        );
    updateMap();
}
function zoomOut(){
    scale =
        Math.max(
            .4,
            scale * .8
        );
    updateMap();
}
function resetMap(){
    scale = 1;
    panX = 0;
    panY = 0;
    updateMap();
}
/* =========================================================
   TOUCH / MOUSE PAN
========================================================= */
const map =
    document.getElementById("map");
map.addEventListener(
    "pointerdown",
    e => {
        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );
        map.setPointerCapture(
            e.pointerId
        );
        if(
            pointers.size === 1
        ){
            lastX =
                e.clientX;
            lastY =
                e.clientY;
        }
        if(
            pointers.size === 2
        ){
            const p =
                [...pointers.values()];
            pinchDistance =
                Math.hypot(
                    p[0].x-p[1].x,
                    p[0].y-p[1].y
                );
        }
    }
);
map.addEventListener(
    "pointermove",
    e => {
        if(
            !pointers.has(
                e.pointerId
            )
        ) return;
        pointers.set(
            e.pointerId,
            {
                x:e.clientX,
                y:e.clientY
            }
        );
        if(
            pointers.size === 1
        ){
            panX +=
                e.clientX-lastX;
            panY +=
                e.clientY-lastY;
            lastX =
                e.clientX;
            lastY =
                e.clientY;
            updateMap();
        }
        if(
            pointers.size === 2
        ){
            const p =
                [...pointers.values()];
            const d =
                Math.hypot(
                    p[0].x-p[1].x,
                    p[0].y-p[1].y
                );
            if(pinchDistance){
                scale *=
                    d/pinchDistance;
                scale =
                    Math.max(
                        .4,
                        Math.min(
                            6,
                            scale
                        )
                    );
                updateMap();
            }
            pinchDistance = d;
        }
    }
);
map.addEventListener(
    "pointerup",
    e => {
        pointers.delete(
            e.pointerId
        );
        if(
            pointers.size < 2
        ){
            pinchDistance =
                null;
        }
    }
);
/* =========================================================
   A* ROUTER
========================================================= */
function heuristic(
    a,
    b
){
    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}
function findPath(
    start,
    goal
){
    const nodes =
        DATA.waypoints || {};
    if(
        !nodes[start] ||
        !nodes[goal]
    ){
        return [];
    }
    const open =
        new Set([start]);
    const came =
        {};
    const g =
        {[start]:0};
    const f =
        {
            [start]:
                heuristic(
                    nodes[start],
                    nodes[goal]
                )
        };
    while(
        open.size
    ){
        let current =
            [...open][0];
        for(
            const n of open
        ){
            if(
                (f[n] ?? Infinity)
                <
                (f[current] ?? Infinity)
            ){
                current=n;
            }
        }
        if(
            current === goal
        ){
            const path =
                [current];
            while(
                came[current]
            ){
                current =
                    came[current];
                path.unshift(
                    current
                );
            }
            return path;
        }
        open.delete(
            current
        );
        const neighbors =
            nodes[current].neighbors
            ||
            nodes[current].connections
            ||
            [];
        for(
            const next
            of neighbors
        ){
            if(
                !nodes[next]
            ) continue;
            const cost =
                heuristic(
                    nodes[current],
                    nodes[next]
                );
            const tentative =
                g[current] + cost;
            if(
                tentative
                <
                (g[next] ?? Infinity)
            ){
                came[next] =
                    current;
                g[next] =
                    tentative;
                f[next] =
                    tentative
                    +
                    heuristic(
                        nodes[next],
                        nodes[goal]
                    );
                open.add(next);
            }
        }
    }
    return [];
}
/* =========================================================
   FIND NEAREST WAYPOINT
========================================================= */
function nearestWaypoint(
    airport
){
    const a =
        DATA.airports?.[airport];
    if(!a) return null;
    if(
        a.nearestWaypoint
    ){
        return a.nearestWaypoint;
    }
    let best = null;
    let bestDistance =
        Infinity;
    for(
        const [name,w]
        of Object.entries(
            DATA.waypoints || {}
        )
    ){
        const d =
            heuristic(a,w);
        if(
            d < bestDistance
        ){
            bestDistance=d;
            best=name;
        }
    }
    return best;
}
/* =========================================================
   GENERATE ROUTE
========================================================= */
function generateRoute(){
    const dep =
        document
        .getElementById("dep")
        .value
        .trim()
        .toUpperCase();
    const arr =
        document
        .getElementById("arr")
        .value
        .trim()
        .toUpperCase();
    if(
        !DATA.airports?.[dep] ||
        !DATA.airports?.[arr]
    ){
        alert(
            "Airport not found in ptfs-data.json."
        );
        return;
    }
    const start =
        nearestWaypoint(dep);
    const end =
        nearestWaypoint(arr);
    if(!start || !end){
        alert(
            "Could not find airport waypoint."
        );
        return;
    }
    const middle =
        findPath(
            start,
            end
        );
    if(!middle.length){
        alert(
            "No connected waypoint route found."
        );
        return;
    }
    const sid =
        document
        .getElementById("sid")
        .value;
    const star =
        document
        .getElementById("star")
        .value;
    currentRoute = [
        dep
    ];
    if(sid){
        currentRoute.push(
            sid
        );
    }
    currentRoute.push(
        ...middle
    );
    if(star){
        currentRoute.push(
            star
        );
    }
    currentRoute.push(
        arr
    );
    document
        .getElementById("routeText")
        .textContent =
        currentRoute.join(" ");
    document
        .getElementById("cruise")
        .textContent =
        document
        .getElementById("level")
        .value;
    document
        .getElementById("distance")
        .textContent =
        calculateDistance(
            middle
        ) + " NM";
    document
        .getElementById("result")
        .style.display =
        "block";
    drawRoute(
        middle
    );
}
function calculateDistance(
    route
){
    let total = 0;
    for(
        let i=1;
        i<route.length;
        i++
    ){
        const a =
            DATA.waypoints[
                route[i-1]
            ];
        const b =
            DATA.waypoints[
                route[i]
            ];
        total +=
            heuristic(a,b);
    }
    /*
      PTFS map coordinate conversion
      can be calibrated against the real
      enroute chart once the dataset is loaded.
    */
    return Math.round(
        total * 1000
    );
}
/* =========================================================
   DRAW ROUTE
========================================================= */
function drawRoute(
    route
){
    const pts = [];
    for(
        const name of route
    ){
        const w =
            DATA.waypoints[name];
        if(!w) continue;
        pts.push(
            `${w.x*1000},${w.y*700}`
        );
    }
    document
        .getElementById("routePath")
        .setAttribute(
            "points",
            pts.join(" ")
        );
}
function clearRoute(){
    currentRoute=[];
    document
        .getElementById("routePath")
        .setAttribute(
            "points",
            ""
        );
    document
        .getElementById("result")
        .style.display =
        "none";
}
/* =========================================================
   PROCEDURE DROPDOWNS
========================================================= */
function loadProcedures(){
    const dep =
        document
        .getElementById("dep")
        .value
        .trim()
        .toUpperCase();
    const arr =
        document
        .getElementById("arr")
        .value
        .trim()
        .toUpperCase();
    fillProcedures(
        "sid",
        DATA.procedures?.[dep]?.SIDs
        ||
        DATA.procedures?.[dep]?.sids
        ||
        {}
    );
    fillProcedures(
        "star",
        DATA.procedures?.[arr]?.STARs
        ||
        DATA.procedures?.[arr]?.stars
        ||
        {}
    );
    fillRunways(
        "depRwy",
        DATA.airports?.[dep]?.runways
        || []
    );
    fillRunways(
        "arrRwy",
        DATA.airports?.[arr]?.runways
        || []
    );
}
function fillProcedures(
    id,
    procedures
){
    const select =
        document
        .getElementById(id);
    select.innerHTML =
        `<option value="">Auto / None</option>`;
    for(
        const name
        of Object.keys(procedures)
    ){
        const option =
            document.createElement(
                "option"
            );
        option.value=name;
        option.textContent=name;
        select.appendChild(
            option
        );
    }
}
function fillRunways(
    id,
    runways
){
    const select =
        document
        .getElementById(id);
    select.innerHTML =
        `<option value="AUTO">Auto</option>`;
    for(
        const runway
        of runways
    ){
        const option =
            document.createElement(
                "option"
            );
        option.value =
            runway;
        option.textContent =
            runway;
        select.appendChild(
            option
        );
    }
}
/* =========================================================
   AIRPORT / CHARTS
========================================================= */
function openAirport(
    icao
){
    const airport =
        DATA.airports?.[icao];
    if(!airport) return;
    const charts =
        airport.charts
        ||
        DATA.charts?.[icao];
    if(
        charts &&
        charts.general
    ){
        document
            .getElementById("chart")
            .src =
            charts.general;
        document
            .getElementById("chartTitle")
            .textContent =
            `${icao} Chart`;
        document
            .getElementById("chartPanel")
            .style.display =
            "block";
        return;
    }
    alert(
        `${icao}\n\n` +
        "Airport found. Add its chart URLs to ptfs-data.json."
    );
}
function closeChart(){
    document
        .getElementById("chartPanel")
        .style.display =
        "none";
}
/* =========================================================
   WAYPOINT INFO
========================================================= */
function waypointInfo(
    name,
    data
){
    alert(
        `${name}\n\n` +
        `PTFS navigation point\n` +
        `Connections: ${
            (
                data.neighbors
                ||
                data.connections
                ||
                []
            ).join(", ")
        }`
    );
}

};

        document
        .getElementById(
            "aircraftIcon"
        );

        CONFIG.ICON_URL +
        (
            ICONS[
                aircraft.type
            ]

        `translate(-50%,-50%) rotate(${aircraft.heading}deg)`;
    document
        .getElementById("aircraftTag")
        .textContent =
        aircraft.callsign;

        .getElementById("infoCallsign")

        aircraft.callsign;

        .getElementById("infoUser")

        aircraft.username;
    document
        .getElementById("infoAirline")
        .textContent =
        "Airline: " +
        aircraft.airline;
    document
        .getElementById("infoType")
        .textContent =
        "Aircraft: " +

    document
        .getElementById("infoHeading")
        .textContent =

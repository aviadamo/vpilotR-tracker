<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>vPilot Reimagined</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#081018;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

button,select,input{font:inherit}

button{
    border:1px solid #40515c;
    background:#13232d;
    color:white;
    border-radius:7px;
    padding:8px 12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:hover{background:#1c3643}
.primary{background:#126b9c}

/* TOP */

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:58px;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:#071018;
    border-bottom:1px solid #334650;
}

#logo{
    font-weight:bold;
    white-space:nowrap;
    margin-right:8px;
}

#logo span{color:#ffb000}

#status{
    margin-left:auto;
    color:#92a4ad;
    font-size:11px;
}

/* MAP */

#map{
    position:absolute;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#121b22;
    cursor:grab;
    touch-action:none;
}

#map.dragging{cursor:grabbing}

#world{
    position:absolute;
    width:2400px;
    height:1600px;
    left:50%;
    top:50%;
    transform-origin:center center;
}

#svgContainer{
    position:absolute;
    inset:0;
    width:2400px;
    height:1600px;
    z-index:1;
}

#svgContainer svg{
    width:2400px;
    height:1600px;
    display:block;
}

/* route */

#routeLayer{
    position:absolute;
    inset:0;
    width:2400px;
    height:1600px;
    pointer-events:none;
    z-index:100;
}

#routeShadow{
    fill:none;
    stroke:rgba(0,0,0,.9);
    stroke-width:17;
    stroke-linecap:round;
    stroke-linejoin:round;
}

#routeLine{
    fill:none;
    stroke:#b85cff;
    stroke-width:7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.routePoint{
    fill:#b85cff;
    stroke:white;
    stroke-width:3;
}

/* waypoint clickable overlay */

#waypointLayer{
    position:absolute;
    left:0;
    top:0;
    width:2400px;
    height:1600px;
    z-index:200;
    pointer-events:none;
}

.waypointHotspot{
    position:absolute;
    width:38px;
    height:38px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px solid transparent;
    background:transparent;
    padding:0;
    pointer-events:auto;
    cursor:pointer;
    touch-action:manipulation;
}

.waypointHotspot:hover{
    background:rgba(255,255,255,.15);
    border-color:rgba(255,255,255,.5);
}

.waypointHotspot.selected{
    background:rgba(184,92,255,.22);
    border-color:#b85cff;
    box-shadow:0 0 14px #b85cff;
}

.waypointLabel{
    position:absolute;
    left:50%;
    top:22px;
    transform:translateX(-50%);
    color:white;
    font-size:9px;
    font-weight:bold;
    white-space:nowrap;
    text-shadow:
        0 0 2px #000,
        0 0 5px #000;
}

/* selected numbers */

#clickLayer{
    position:absolute;
    inset:0;
    z-index:250;
    pointer-events:none;
}

.clickedWaypoint{
    position:absolute;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    font-size:9px;
    font-weight:bold;
    text-shadow:0 0 4px black;
}

.clickedWaypoint .dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#b85cff;
    border:2px solid white;
    margin:auto;
}

/* controls */

#mapControls{
    position:fixed;
    right:12px;
    bottom:12px;
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:5px;
}

#mapControls button{
    width:42px;
    height:42px;
    padding:0;
    font-size:20px;
}

#zoomLabel{
    position:fixed;
    right:12px;
    bottom:150px;
    z-index:500;
    padding:5px 8px;
    border-radius:5px;
    background:#071018dd;
    color:#aebbc1;
    font-size:10px;
}

/* mobile route bar */

#routeBar{
    position:fixed;
    left:8px;
    right:8px;
    bottom:8px;
    z-index:800;
    display:none;
    align-items:center;
    gap:5px;
    padding:7px;
    background:#071018f5;
    border:1px solid #40515c;
    border-radius:10px;
    box-shadow:0 10px 35px #000;
}

#routeBar.active{display:flex}

#routeBarText{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:10px;
    color:#c5d0d5;
}

/* panels */

.panel{
    position:fixed;
    top:70px;
    left:12px;
    width:500px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 82px);
    overflow:auto;
    z-index:900;
    display:none;
    background:#071018f7;
    border:1px solid #40515c;
    border-radius:12px;
    box-shadow:0 20px 70px #000;
}

.panelHeader{
    padding:12px;
    border-bottom:1px solid #30414a;
    font-weight:bold;
}

.close{
    float:right;
    padding:0;
    background:none;
    border:0;
    font-size:22px;
}

.panelBody{padding:12px}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.field{margin-bottom:10px}

.field label{
    display:block;
    margin-bottom:4px;
    color:#8fa1aa;
    font-size:9px;
    font-weight:bold;
    text-transform:uppercase;
}

input,select{
    width:100%;
    padding:9px;
    border-radius:7px;
    border:1px solid #40515c;
    background:#101c24;
    color:white;
    outline:none;
}

.full{
    width:100%;
    margin-top:7px;
}

.help{
    margin-top:10px;
    color:#8fa1aa;
    font-size:10px;
    line-height:1.5;
}

#routeInfo{
    margin-top:10px;
    padding:10px;
    background:#101c24;
    border:1px solid #40515c;
    border-radius:8px;
    font-size:11px;
    line-height:1.6;
}

.purple{color:#c06cff}

/* charts */

#charts{
    position:fixed;
    right:12px;
    top:70px;
    width:min(900px,calc(100vw - 24px));
    height:min(820px,calc(100vh - 82px));
    z-index:950;
    display:none;
    overflow:hidden;
    background:#071018;
    border:1px solid #40515c;
    border-radius:12px;
    box-shadow:0 20px 70px #000;
}

#chartsHeader{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 12px;
    border-bottom:1px solid #30414a;
}

#chartsHeader button{margin-left:auto}

#chartsFrame{
    width:100%;
    height:calc(100% - 48px);
    border:0;
    background:white;
}

/* mobile */

@media(max-width:700px){

    #topbar{
        padding:0 6px;
        gap:5px;
    }

    #logo{
        font-size:11px;
        margin-right:1px;
    }

    #topbar button{
        font-size:10px;
        padding:7px 8px;
    }

    #topbar button:nth-of-type(3),
    #topbar button:nth-of-type(4){
        display:none;
    }

    #status{display:none}

    .grid{
        grid-template-columns:1fr;
    }

    .panel{
        top:64px;
        left:7px;
        right:7px;
        width:auto;
        max-width:none;
        max-height:calc(100vh - 72px);
    }

    #routeBar{
        bottom:calc(8px + env(safe-area-inset-bottom));
    }

    #mapControls{
        bottom:calc(70px + env(safe-area-inset-bottom));
    }

    #zoomLabel{
        bottom:calc(205px + env(safe-area-inset-bottom));
    }
}
</style>
</head>

<body>

<!-- TOP BAR -->

<div id="topbar">

    <div id="logo">
        ✈ <span>vPilot Reimagined</span>
    </div>

    <button onclick="openPlanner()">

<!-- MAP -->

<div id="map">

<script>

/* =========================================================
   CONFIG
========================================================= */

const MAP_URL =
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg";


/* =========================================================
   STATE
========================================================= */

let zoom = 1;

let offsetX = 0;
let offsetY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let originalX = 0;
let originalY = 0;

let waypointMode = false;

let selectedWaypoints = [];

let detectedWaypoints = [];


/* =========================================================
   ELEMENTS
========================================================= */

const map =
    document.getElementById("map");

const world =
    document.getElementById("world");

const svgContainer =
    document.getElementById("svgContainer");

const waypointLayer =
    document.getElementById("waypointLayer");

const clickLayer =
    document.getElementById("clickLayer");

const routeLine =
    document.getElementById("routeLine");

const routeShadow =
    document.getElementById("routeShadow");

const routeDots =
    document.getElementById("routeDots");

const status =
    document.getElementById("status");


/* =========================================================
   MAP
========================================================= */

function updateMap(){

    world.style.transform =
        `
        translate(
            calc(-50% + ${offsetX}px),
            calc(-50% + ${offsetY}px)
        )
        scale(${zoom})
        `;

    document.getElementById(
        "zoomLabel"
    ).textContent =
        Math.round(zoom * 100) + "%";

}


function zoomMap(amount){

    zoom *= amount;

    zoom =
        Math.max(
            .2,
            Math.min(
                6,
                zoom
            )
        );

    updateMap();

}


function resetMap(){

    zoom = 1;
    offsetX = 0;
    offsetY = 0;

    updateMap();

}


/* =========================================================
   DRAG
========================================================= */

map.addEventListener(
    "pointerdown",
    event => {

        if(waypointMode)
            return;

        if(
            event.target.closest(
                ".waypointHotspot"
            )
        )
            return;

        dragging = true;

        dragStartX =
            event.clientX;

        dragStartY =
            event.clientY;

        originalX =
            offsetX;

        originalY =
            offsetY;

        map.classList.add("dragging");

        try{
            map.setPointerCapture(
                event.pointerId
            );
        }catch(e){}

    }
);


map.addEventListener(
    "pointermove",
    event => {

        if(!dragging)
            return;

        offsetX =
            originalX +
            event.clientX -
            dragStartX;

        offsetY =
            originalY +
            event.clientY -
            dragStartY;

        updateMap();

    }
);


map.addEventListener(
    "pointerup",
    () => {

        dragging = false;

        map.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   WHEEL
========================================================= */

map.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        zoomMap(
            event.deltaY < 0
                ? 1.12
                : .89
        );

    },
    {
        passive:false
    }
);


/* =========================================================
   WAYPOINT MODE
========================================================= */

function enableWaypointMode(){

    waypointMode = true;

    /*
        Hide planner immediately.
    */

    document.getElementById(
        "planner"
    ).style.display =
        "none";


    document.getElementById(
        "charts"
    ).style.display =
        "none";


    document.getElementById(
        "routeBar"
    ).classList.add(
        "active"
    );


    map.style.cursor =
        "crosshair";


    status.textContent =
        "WAYPOINT MODE — TAP A TRIANGLE FIX";


    buildWaypointHotspots();

}


function finishWaypointMode(){

    waypointMode = false;

    document.getElementById(
        "routeBar"
    ).classList.remove(
        "active"
    );


    map.style.cursor =
        "grab";


    status.textContent =
        "PTFS MAP READY";


    clearHotspots();

}


/* =========================================================
   INLINE SVG LOADING
========================================================= */

async function loadMap(){

    try{

        status.textContent =
            "Loading PTFS enroute chart...";


        const response =
            await fetch(
                MAP_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok)
            throw new Error(
                "HTTP " +
                response.status
            );


        const text =
            await response.text();


        /*
            Parse the SVG.
        */

        const parser =
            new DOMParser();


        const documentSVG =
            parser.parseFromString(
                text,
                "image/svg+xml"
            );


        const svg =
            documentSVG.documentElement;


        if(
            !svg ||
            svg.nodeName.toLowerCase() !== "svg"
        ){

            throw new Error(
                "Invalid SVG"
            );

        }


        /*
            Put the REAL SVG into the page.

            This allows JavaScript to inspect
            its actual shapes.
        */

        svg.removeAttribute("width");
        svg.removeAttribute("height");

        svg.setAttribute(
            "viewBox",
            svg.getAttribute("viewBox") ||
            "0 0 2400 1600"
        );

        svg.setAttribute(
            "preserveAspectRatio",
            "none"
        );


        svgContainer.innerHTML =
            "";

        svgContainer.appendChild(
            document.importNode(
                svg,
                true
            )
        );


        /*
            Find triangle waypoint symbols.
        */

        detectWaypointTriangles();


        status.textContent =
            "PTFS MAP READY — " +
            detectedWaypoints.length +
            " FIXES FOUND";


    }catch(error){

        console.error(error);

        status.textContent =
            "MAP FAILED TO LOAD";

    }

}


/* =========================================================
   TRIANGLE DETECTION
========================================================= */

function detectWaypointTriangles(){

    detectedWaypoints = [];


    const svg =
        svgContainer.querySelector(
            "svg"
        );


    if(!svg)
        return;


    /*
        Search polygon/path elements.

        PTFS waypoint symbols are small triangles.
    */

    const shapes =
        svg.querySelectorAll(
            "polygon,path"
        );


    const texts =
        Array.from(
            svg.querySelectorAll(
                "text,tspan"
            )
        );


    shapes.forEach(
        shape => {

            const box =
                safeBBox(shape);


            if(!box)
                return;


            /*
                Waypoint triangles are small.

                Reject huge airport/map shapes.
            */

            if(
                box.width < 2 ||
                box.height < 2
            )
                return;


            if(
                box.width > 40 ||
                box.height > 40
            )
                return;


            /*
                Triangle-like aspect.
            */

            const points =
                shape.getAttribute(
                    "points"
                );


            let isTriangle =
                false;


            if(points){

                const coords =
                    points
                        .trim()
                        .split(/\s+/)
                        .map(
                            p =>
                                p.split(",")
                        );


                if(
                    coords.length === 3
                )
                    isTriangle = true;

            }


            /*
                For paths, inspect command structure.
            */

            if(
                !isTriangle &&
                shape.tagName.toLowerCase() ===
                "path"
            ){

                const d =
                    shape.getAttribute("d") ||
                    "";


                /*
                    Small closed path with
                    roughly three line segments.
                */

                const lineCount =
                    (
                        d.match(
                            /[lL]/g
                        ) || []
                    ).length;


                if(
                    /[zZ]/.test(d) &&
                    lineCount >= 2 &&
                    lineCount <= 4
                ){

                    isTriangle = true;

                }

            }


            if(!isTriangle)
                return;


            const cx =
                box.x +
                box.width / 2;

            const cy =
                box.y +
                box.height / 2;


            /*
                Find closest text label.

                INDEX, EASTM, etc. should be
                close to the triangle.
            */

            let best = null;

            let bestDistance =
                Infinity;


            texts.forEach(
                text => {

                    const name =
                        (
                            text.textContent ||
                            ""
                        )
                        .trim()
                        .toUpperCase();


                    if(
                        !/^[A-Z0-9]{3,6}$/.test(
                            name
                        )
                    )
                        return;


                    const textBox =
                        safeBBox(text);


                    if(!textBox)
                        return;


                    const tx =
                        textBox.x +
                        textBox.width / 2;

                    const ty =
                        textBox.y +
                        textBox.height / 2;


                    const dx =
                        tx - cx;

                    const dy =
                        ty - cy;


                    const distance =
                        Math.sqrt(
                            dx*dx +
                            dy*dy
                        );


                    if(
                        distance < bestDistance &&
                        distance < 80
                    ){

                        bestDistance =
                            distance;

                        best = name;

                    }

                }
            );


            /*
                If there is no nearby label,
                don't make a random triangle
                clickable.

                This keeps the map safe from
                unrelated triangles.
            */

            if(!best)
                return;


            /*
                Remove duplicates.
            */

            const duplicate =
                detectedWaypoints.some(
                    point =>
                        point.name === best &&
                        Math.abs(
                            point.x - cx
                        ) < 5 &&
                        Math.abs(
                            point.y - cy
                        ) < 5
                );


            if(duplicate)
                return;


            detectedWaypoints.push({

                name:best,

                x:cx,

                y:cy

            });

        }
    );

}


/* =========================================================
   SAFE BBOX
========================================================= */

function safeBBox(element){

    try{

        const box =
            element.getBBox();

        if(
            !Number.isFinite(box.x) ||
            !Number.isFinite(box.y)
        )
            return null;

        return box;

    }catch(e){

        return null;

    }

}


/* =========================================================
   HOTSPOTS
========================================================= */

function buildWaypointHotspots(){

    clearHotspots();


    detectedWaypoints.forEach(
        waypoint => {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";

            button.className =
                "waypointHotspot";


            button.style.left =
                waypoint.x + "px";

            button.style.top =
                waypoint.y + "px";


            button.dataset.name =
                waypoint.name;


            button.setAttribute(
                "aria-label",
                waypoint.name
            );


            button.innerHTML =
                `
                <span class="waypointLabel">
                    ${escapeHTML(
                        waypoint.name
                    )}
                </span>
                `;


            button.addEventListener(
                "pointerdown",
                event => {

                    event.stopPropagation();

                }
            );


            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    selectWaypoint(
                        waypoint,
                        button
                    );

                }
            );


            waypointLayer.appendChild(
                button
            );

        }
    );


    if(
        detectedWaypoints.length === 0
    ){

        status.textContent =
            "WAYPOINT MODE — NO TRIANGLES DETECTED";

    }

}


function clearHotspots(){

    waypointLayer.innerHTML =
        "";

}


/* =========================================================
   SELECT
========================================================= */

function selectWaypoint(
    waypoint,
    button
){

    if(!waypointMode)
        return;


    const index =
        selectedWaypoints.findIndex(
            point =>
                point.name ===
                waypoint.name
        );


    /*
        Tapping a selected fix again
        removes it.
    */

    if(index !== -1){

        selectedWaypoints.splice(
            index,
            1
        );

    }else{

        selectedWaypoints.push({

            name:waypoint.name,

            x:waypoint.x,

            y:waypoint.y

        });

    }


    drawRoute();

    rebuildMarkers();

    updateRouteText();

}


/* =========================================================
   MARKERS
========================================================= */

function rebuildMarkers(){

    clickLayer.innerHTML =
        "";


    selectedWaypoints.forEach(
        (point,index) => {

            const marker =
                document.createElement(
                    "div"
                );


            marker.className =
                "clickedWaypoint";


            marker.style.left =
                point.x + "px";

            marker.style.top =
                point.y + "px";


            marker.innerHTML =
                `
                <div class="dot"></div>
                ${index + 1}
                `;


            clickLayer.appendChild(
                marker
            );

        }
    );


    document
        .querySelectorAll(
            ".waypointHotspot"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "selected",
                    selectedWaypoints.some(
                        point =>
                            point.name ===
                            button.dataset.name
                    )
                );

            }
        );

}


/* =========================================================
   ROUTE
========================================================= */

function drawRoute(){

    const points =
        selectedWaypoints
            .map(
                point =>
                    `${point.x},${point.y}`
            )
            .join(" ");


    routeLine.setAttribute(
        "points",
        points
    );


    routeShadow.setAttribute(
        "points",
        points
    );


    routeDots.innerHTML =
        "";


    selectedWaypoints.forEach(
        point => {

            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            circle.setAttribute(
                "cx",
                point.x
            );


            circle.setAttribute(
                "cy",
                point.y
            );


            circle.setAttribute(
                "r",
                "8"
            );


            circle.setAttribute(
                "class",
                "routePoint"
            );


            routeDots.appendChild(
                circle
            );

        }
    );

}


/* =========================================================
   ROUTE TEXT
========================================================= */

function updateRouteText(){

    const routeText =
        document.getElementById(
            "routeText"
        );


    if(
        selectedWaypoints.length === 0
    ){

        routeText.textContent =
            "No waypoints selected.";

        document.getElementById(
            "routeBarText"
        ).textContent =
            "Select waypoint";

        return;

    }


    const route =
        selectedWaypoints
            .map(
                point =>
                    point.name
            )
            .join(" → ");


    routeText.innerHTML =
        `
        <span class="purple">
            ${escapeHTML(route)}
        </span>
        `;


    document.getElementById(
        "routeBarText"
    ).textContent =
        route;

}


/* =========================================================
   UNDO
========================================================= */

function undoWaypoint(){

    if(
        selectedWaypoints.length === 0
    )
        return;


    selectedWaypoints.pop();

    drawRoute();

    rebuildMarkers();

    updateRouteText();

}


/* =========================================================
   CLEAR
========================================================= */

function clearRoute(){

    selectedWaypoints = [];

    drawRoute();

    rebuildMarkers();

    updateRouteText();

}


/* =========================================================
   PLANNER
========================================================= */

function openPlanner(){

    document.getElementById(
        "planner"
    ).style.display =
        "block";

}


function closePlanner(){

    document.getElementById(
        "planner"
    ).style.display =
        "none";

}


/* =========================================================
   CHARTS
========================================================= */

function openCharts(){

    document.getElementById(
        "charts"
    ).style.display =
        "block";


    document.getElementById(
        "chartsFrame"
    ).src =
        "https://atc24resources.github.io/24QuickCharts/";

}


function closeCharts(){

    document.getElementById(
        "charts"
    ).style.display =
        "none";


    document.getElementById(
        "chartsFrame"
    ).src =
        "about:blank";

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

loadMap();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>PTFS Tracker</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111923;
    font-family: Arial, sans-serif;
}


/* TOP BAR */

#topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 60px;

    background: rgba(10,15,22,0.97);

    display: flex;
    align-items: center;

    padding: 0 12px;

    z-index: 1000;

    border-bottom: 1px solid #344454;
}

.logo {
    color: white;
    font-weight: bold;
    margin-right: 15px;
}

.tabs {
    display: flex;
    gap: 6px;
}

.tab {
    background: #172330;

    border: 1px solid #405264;

    color: #cbd5df;

    padding: 8px 11px;

    border-radius: 7px;

    font-size: 13px;
}

.tab.active {
    background: #2c6594;
    color: white;
}


/* MAP */

#map {
    position: fixed;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background: #111923;

    touch-action: none;
}

#mapImage {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 1000px;

    transform-origin: center;

    user-select: none;

    pointer-events: none;
}


/* CHARTS PANEL */

#chartsPanel {

    display: none;

    position: fixed;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 900;

    background: #111923;

    color: white;

    overflow-y: auto;

    padding: 20px;
}

#chartsPanel h2 {
    margin-top: 0;
}

.airportGrid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(180px,1fr));

    gap: 12px;

    max-width: 900px;
}

.airport {

    background: #182533;

    border: 1px solid #405264;

    border-radius: 10px;

    padding: 16px;

    color: white;

    text-align: left;

    cursor: pointer;

}

.airport:hover {
    background: #24384b;
}

.airportCode {
    font-size: 18px;
    font-weight: bold;
}

.airportName {
    margin-top: 5px;
    color: #aebbc8;
    font-size: 13px;
}


/* CHART VIEW */

#chartViewer {

    display: none;

    position: fixed;

    top: 60px;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 950;

    background: #111;

    overflow: hidden;

    touch-action: none;
}

#chartImage {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 1000px;

    transform-origin: center;

    user-select: none;

    pointer-events: none;
}

#backButton {

    position: fixed;

    top: 72px;
    left: 15px;

    z-index: 1000;

    background: rgba(10,15,22,.95);

    color: white;

    border: 1px solid #405264;

    border-radius: 7px;

    padding: 9px 13px;

}


/* CONTROLS */

.controls {

    position: fixed;

    right: 15px;
    bottom: 20px;

    z-index: 1100;

    display: flex;

    flex-direction: column;

    gap: 7px;
}

.controls button {

    width: 46px;
    height: 46px;

    background: rgba(10,15,22,.95);

    color: white;

    border: 1px solid #46596b;

    border-radius: 8px;

    font-size: 22px;
}

#zoom {

    position: fixed;

    right: 15px;
    bottom: 175px;

    z-index: 1100;

    background: rgba(10,15,22,.9);

    color: #bbb;

    padding: 6px 9px;

    border-radius: 6px;

    font-size: 12px;
}

</style>
</head>


<body>


<!-- TOP BAR -->

<div id="topbar">

    <div class="logo">
        ✈️ PTFS Tracker
    </div>

    <div class="tabs">

        <button
        class="tab active"
        onclick="showWorld(this)">
            🌍 World
        </button>

        <button
        class="tab"
        onclick="showEnroute(this)">
            📡 Enroute
        </button>

        <button
        class="tab"
        onclick="showCharts(this)">
            🛬 Charts
        </button>

    </div>

</div>


<!-- MAIN MAP -->

<div id="map">

    <img
    id="mapImage"
    src="https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg"
    alt="PTFS Enroute Chart">

</div>


<!-- CHARTS MENU -->

<div id="chartsPanel">

    <h2>🛬 PTFS Airport Charts</h2>

    <p>
        Select an airport to view its chart.
    </p>

    <div class="airportGrid">

        <div class="airport"
        onclick="openChart('IRFD')">

            <div class="airportCode">
                IRFD
            </div>

            <div class="airportName">
                Greater Rockford
            </div>

        </div>


        <div class="airport"
        onclick="openChart('IPPH')">

            <div class="airportCode">
                IPPH
            </div>

            <div class="airportName">
                Perth
            </div>

        </div>


        <div class="airport"
        onclick="openChart('WSSS')">

            <div class="airportCode">
                WSSS
            </div>

            <div class="airportName">
                Singapore
            </div>

        </div>


        <div class="airport"
        onclick="openChart('LCLK')">

            <div class="airportCode">
                LCLK
            </div>

            <div class="airportName">
                Cyprus
            </div>

        </div>


        <div class="airport"
        onclick="openChart('IGAR')">

            <div class="airportCode">
                IGAR
            </div>

            <div class="airportName">
                Orenji
            </div>

        </div>


        <div class="airport"
        onclick="openChart('GIGI')">

            <div class="airportCode">
                GIGI
            </div>

            <div class="airportName">
                Grindavik
            </div>

        </div>

    </div>

</div>


<!-- CHART VIEWER -->

<div id="chartViewer">

    <button
    id="backButton"
    onclick="closeChart()">

        ← Back to charts

    </button>

    <img
    id="chartImage"
    src=""
    alt="Airport Chart">

</div>


<!-- ZOOM -->

<div id="zoom">
    100%
</div>


<!-- CONTROLS -->

<div class="controls">

    <button onclick="zoomIn()">+</button>

    <button onclick="zoomOut()">−</button>

    <button onclick="resetMap()">⟳</button>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const map =
document.getElementById("map");

const mapImage =
document.getElementById("mapImage");

const chartsPanel =
document.getElementById("chartsPanel");

const chartViewer =
document.getElementById("chartViewer");

const chartImage =
document.getElementById("chartImage");

const zoomText =
document.getElementById("zoom");


/* =========================
   CHART SOURCES
========================= */

const charts = {

    IRFD:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/IRFD/IRFD%20Ground.svg",

    IPPH:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/IPPH/IPPH%20Ground.svg",

    WSSS:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/WSSS/WSSS%20Ground.svg",

    LCLK:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/LCLK/LCLK%20Ground.svg",

    IGAR:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/IGAR/IGAR%20Ground.svg",

    GIGI:
    "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airport%20Charts/GIGI/GIGI%20Ground.svg"

};


/* =========================
   VARIABLES
========================= */

let scale = 1;

let x = 0;

let y = 0;

let pointers = new Map();

let lastX = 0;

let lastY = 0;

let lastDistance = null;


/* =========================
   TABS
========================= */

function setActive(button) {

    document
    .querySelectorAll(".tab")
    .forEach(tab =>
        tab.classList.remove("active")
    );

    button.classList.add("active");

}


function showWorld(button) {

    setActive(button);

    chartsPanel.style.display =
        "none";

    chartViewer.style.display =
        "none";

    map.style.display =
        "block";

    mapImage.src =
        "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg";

    resetMap();

}


function showEnroute(button) {

    setActive(button);

    chartsPanel.style.display =
        "none";

    chartViewer.style.display =
        "none";

    map.style.display =
        "block";

    mapImage.src =
        "https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg";

    resetMap();

}


function showCharts(button) {

    setActive(button);

    map.style.display =
        "none";

    chartViewer.style.display =
        "none";

    chartsPanel.style.display =
        "block";

}


/* =========================
   OPEN CHART
========================= */

function openChart(code) {

    const source =
        charts[code];

    if(!source) {

        alert(
            "Chart not available yet."
        );

        return;

    }


    chartImage.src =
        source;


    chartsPanel.style.display =
        "none";

    chartViewer.style.display =
        "block";


    scale = 1;

    x = 0;

    y = 0;

    updateChart();

}


/* =========================
   CLOSE CHART
========================= */

function closeChart() {

    chartViewer.style.display =
        "none";

    chartsPanel.style.display =
        "block";

}


/* =========================
   MAP UPDATE
========================= */

function updateMap() {

    mapImage.style.transform =

        `translate(-50%,-50%)
         translate(${x}px,${y}px)
         scale(${scale})`;

    zoomText.textContent =
        Math.round(scale*100) + "%";

}


/* =========================
   CHART UPDATE
========================= */

function updateChart() {

    chartImage.style.transform =

        `translate(-50%,-50%)
         translate(${x}px,${y}px)
         scale(${scale})`;

    zoomText.textContent =
        Math.round(scale*100) + "%";

}


/* =========================
   ZOOM
========================= */

function zoomAt(
    newScale,
    centerX,
    centerY
) {

    newScale =
        Math.max(
            .5,
            Math.min(
                5,
                newScale
            )
        );


    const factor =
        newScale / scale;


    x =
        x * factor;


    y =
        y * factor;


    scale =
        newScale;


    if(chartViewer.style.display === "block") {

        updateChart();

    } else {

        updateMap();

    }

}


/* =========================
   BUTTON ZOOM
========================= */

function zoomIn() {

    zoomAt(
        scale*1.3,
        window.innerWidth/2,
        window.innerHeight/2
    );

}


function zoomOut() {

    zoomAt(
        scale*.77,
        window.innerWidth/2,
        window.innerHeight/2
    );

}


function resetMap() {

    scale = 1;

    x = 0;

    y = 0;

    updateMap();

}


/* =========================
   TOUCH PAN
========================= */

function activeSurface() {

    if(
        chartViewer.style.display === "block"
    )

        return chartViewer;

    return map;

}


function addPointerEvents(surface) {

    surface.addEventListener(
        "pointerdown",
        event => {

            pointers.set(
                event.pointerId,
                {
                    x:event.clientX,
                    y:event.clientY
                }
            );

            surface.setPointerCapture(
                event.pointerId
            );


            if(pointers.size === 1) {

                lastX =
                    event.clientX;

                lastY =
                    event.clientY;

            }


            if(pointers.size === 2) {

                const p =
                    [...pointers.values()];

                lastDistance =
                    distance(
                        p[0],
                        p[1]
                    );

            }

        }
    );


    surface.addEventListener(
        "pointermove",
        event => {

            if(
                !pointers.has(
                    event.pointerId
                )
            )
                return;


            pointers.set(
                event.pointerId,
                {
                    x:event.clientX,
                    y:event.clientY
                }
            );


            if(pointers.size === 1) {

                x +=
                    event.clientX-lastX;

                y +=
                    event.clientY-lastY;

                lastX =
                    event.clientX;

                lastY =
                    event.clientY;


                if(
                    chartViewer.style.display
                    === "block"
                )

                    updateChart();

                else

                    updateMap();

            }


            if(pointers.size === 2) {

                const p =
                    [...pointers.values()];


                const d =
                    distance(
                        p[0],
                        p[1]
                    );


                if(lastDistance) {

                    scale *=
                        d/lastDistance;

                    scale =
                        Math.max(
                            .5,
                            Math.min(
                                5,
                                scale
                            )
                        );


                    if(
                        chartViewer.style.display
                        === "block"
                    )

                        updateChart();

                    else

                        updateMap();

                }


                lastDistance = d;

            }

        }
    );


    surface.addEventListener(
        "pointerup",
        event => {

            pointers.delete(
                event.pointerId
            );

            if(pointers.size < 2)

                lastDistance =
                    null;

        }
    );

}


addPointerEvents(map);

addPointerEvents(chartViewer);


/* =========================
   DISTANCE
========================= */

function distance(a,b) {

    const dx =
        a.x-b.x;

    const dy =
        a.y-b.y;

    return Math.sqrt(
        dx*dx+dy*dy
    );

}

</script>

</body>
</html>

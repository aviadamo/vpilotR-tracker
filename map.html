<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTFS Flight Planner</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111820;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   TOP BAR
========================= */

#topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    z-index: 100;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 0 12px;

    background: rgba(6, 14, 21, 0.96);
    border-bottom: 1px solid #334654;
}

.logo {
    font-size: 15px;
    font-weight: 800;
    margin-right: 7px;
}

.logo span {
    color: #ffb000;
}

.topButton {
    border: 1px solid #3b5060;
    background: #14232e;
    color: white;

    padding: 8px 11px;
    border-radius: 7px;

    cursor: pointer;
}

.topButton:hover {
    background: #1c303e;
}

#status {
    margin-left: auto;
    color: #82909a;
    font-size: 11px;
}

/* =========================
   MAP
========================= */

#map {
    position: fixed;
    top: 58px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background: #111820;

    touch-action: none;
    cursor: grab;
}

#map:active {
    cursor: grabbing;
}

#chart {
    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;
}

#chart svg {
    display: block;
    max-width: none;
}

/* =========================
   ROUTE OVERLAY
========================= */

#routeOverlay {
    position: absolute;

    pointer-events: none;

    z-index: 20;

    transform-origin: top left;
}

#routeLine {
    fill: none;

    stroke: #ffb000;
    stroke-width: 3;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
        drop-shadow(0 0 2px black)
        drop-shadow(0 0 4px black);
}

.routeWaypoint {
    fill: #ffb000;
    stroke: #111;
    stroke-width: 1.5;
}

/* =========================
   AIRCRAFT
========================= */

#aircraft {
    position: absolute;

    width: 70px;
    height: 70px;

    z-index: 40;

    transform: translate(-50%, -50%);

    cursor: pointer;
}

#aircraftIcon {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    transform-origin: center center;
}

#aircraftLabel {
    position: absolute;

    left: 42px;
    top: 7px;

    padding: 3px 6px;

    background: rgba(4, 12, 18, 0.92);

    border: 1px solid #40515d;
    border-radius: 5px;

    font-size: 10px;

    white-space: nowrap;
}

/* =========================
   ZOOM
========================= */

#zoomControls {
    position: fixed;

    right: 13px;
    bottom: 13px;

    z-index: 80;

    display: flex;
    flex-direction: column;

    gap: 6px;
}

.zoomButton {
    width: 42px;
    height: 42px;

    border-radius: 8px;

    border: 1px solid #3b5060;

    background: rgba(6, 15, 22, 0.94);

    color: white;

    font-size: 21px;

    cursor: pointer;
}

.zoomButton:hover {
    background: #1b2d3a;
}

#zoomText {
    position: fixed;

    right: 16px;
    bottom: 151px;

    z-index: 80;

    background: rgba(4, 12, 18, 0.9);

    padding: 4px 7px;

    border-radius: 5px;

    color: #82909a;

    font-size: 10px;
}

/* =========================
   PANELS
========================= */

.panel {
    position: fixed;

    z-index: 70;

    top: 70px;
    left: 12px;

    width: 410px;
    max-width: calc(100vw - 24px);

    max-height: calc(100vh - 82px);

    overflow-y: auto;

    display: none;

    background: rgba(5, 13, 20, 0.97);

    border: 1px solid #3b4e5c;

    border-radius: 12px;

    box-shadow: 0 20px 70px rgba(0,0,0,.6);
}

.panelHeader {
    display: flex;
    align-items: center;

    padding: 12px;

    border-bottom: 1px solid #293a46;
}

.panelHeader strong {
    font-size: 15px;
}

.closeButton {
    margin-left: auto;

    border: 0;
    background: none;

    color: #8997a0;

    font-size: 23px;

    cursor: pointer;
}

.panelBody {
    padding: 12px;
}

/* =========================
   FORM
========================= */

.grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
}

.field {
    margin-bottom: 9px;
}

.field label {
    display: block;

    margin-bottom: 4px;

    color: #81909a;

    font-size: 9px;

    text-transform: uppercase;
}

select {
    width: 100%;

    padding: 9px;

    background: #101c25;

    color: white;

    border: 1px solid #354a58;

    border-radius: 7px;

    outline: none;
}

select:focus {
    border-color: #6099bc;
}

.primaryButton {
    width: 100%;

    padding: 11px;

    border-radius: 7px;

    border: 1px solid #67a4cf;

    background: #1c5b87;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.primaryButton:hover {
    background: #2472a7;
}

.secondaryButton {
    width: 100%;

    margin-top: 7px;

    padding: 9px;

    border-radius: 7px;

    border: 1px solid #354a58;

    background: #14232e;

    color: #aeb8be;

    cursor: pointer;
}

/* =========================
   RESULT
========================= */

#routeResult {
    display: none;

    margin-top: 12px;
    padding-top: 12px;

    border-top: 1px solid #293a46;
}

.routeBox {
    padding: 10px;

    background: #101c25;

    border: 1px solid #354a58;

    border-radius: 7px;

    color: #ffbd3d;

    font-size: 12px;

    line-height: 1.7;

    word-break: break-word;
}

.routeInfo {
    margin-top: 7px;

    color: #7f8f99;

    font-size: 10px;
}

/* =========================
   AIRCRAFT INFO
========================= */

#aircraftInfo {
    position: fixed;

    z-index: 75;

    top: 70px;
    right: 12px;

    width: 320px;
    max-width: calc(100vw - 24px);

    display: none;

    background: rgba(5, 13, 20, 0.97);

    border: 1px solid #3b4e5c;

    border-radius: 12px;

    box-shadow: 0 20px 70px rgba(0,0,0,.6);
}

.infoBody {
    padding: 13px;
}

.callsign {
    font-size: 20px;
    font-weight: 800;
}

.username {
    margin-top: 4px;

    color: #58aaff;

    font-size: 12px;
}

.infoLine {
    margin-top: 7px;

    color: #8796a0;

    font-size: 12px;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;

    inset: 58px 0 0;

    z-index: 200;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #111820;

    color: #9ba8b0;
}
</style>
</head>

<body>

<!-- =========================

    </div>

</div>


<!-- =========================
     AIRCRAFT INFO
========================= -->

<div id="aircraftInfo">

    <div class="panelHeader">

        <strong>
            Aircraft
        </strong>

        <button
            class="closeButton"
            onclick="closeAircraftInfo()"
        >
            ×
        </button>

    </div>


    <div class="infoBody">

        <div
            id="infoCallsign"
            class="callsign"
        >
            UAE123
        </div>


        <div
            id="infoUsername"

        >
            Roblox: PilotExample

        <div

        </div>


        <div

</div>


<script>

/* ============================================================

/*

   change the line above to its filename.

   Example:

   const CHART_URL = "enroute.svg";

   The planner reads waypoint labels directly from the SVG.
*/


/* ============================================================

============================================================ */

const airports = [

/* ============================================================

const runways = {

/* ============================================================
   PROCEDURES
============================================================ */

const procedures = {

    IRFD: {

        sid: [
            "OMNI-DIRECTIONAL",
            "SAVES 6C",
            "INDEX 1A",
            "SAVES 1A",
            "SETHR 1A"
        ],

        star: [
            "NONE",

            "CRACK 3M",

    },

    },

/* ============================================================

============================================================ */

const transitions = {

    IRFD: {

        sid: [

            "FORIA",

            "SETHR"
        ],

        star: [
            "NONE / DIRECT"
        ]

};


/* ============================================================
   STATE
============================================================ */

let mapScale = 1;

let panX = 0;
let panY = 0;

let dragging = false;

let lastMouseX = 0;
let lastMouseY = 0;

let viewBox = [
    0,
    0,
    1000,
    700
];

let waypointNodes = [];

let waypointMap = new Map();


/* ============================================================
   CURRENT AIRCRAFT
============================================================ */

const currentAircraft = {

    callsign: "UAE123",

    username: "PilotExample",

    airline: "Emirates",

    type: "A320",

    heading: 274

};


/* ============================================================
   HELPERS
============================================================ */

function $(id) {

    return document.getElementById(id);

}


function setOptions(id, values) {

    const select = $(id);

    select.innerHTML = "";

    values.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent = value;

        select.appendChild(option);

    });

}


/* ============================================================
   INITIAL SETUP
============================================================ */

function setupPlanner() {

    setOptions(
        "departure",
        airports.map(
            airport =>
                airport + " — " +
                (airportNames[airport] || airport)
        )
    );


    setOptions(
        "arrival",
        airports.map(
            airport =>
                airport + " — " +
                (airportNames[airport] || airport)
        )
    );


    $("departure").value =
        "IRFD — Greater Rockford";

    $("arrival").value =
        "IPPH — Perth";


    /* PTFS-style flight levels */

    for (
        let level = 10;
        level <= 390;
        level += 10
    ) {

        const option =
            document.createElement("option");

        option.value =
            "FL" +
            String(level).padStart(3, "0");

        option.textContent =
            option.value;

        $("flightLevel").appendChild(option);

    }


    $("flightLevel").value =
        "FL070";


    $("departure").addEventListener(
        "change",
        updatePlannerOptions
    );


    $("arrival").addEventListener(
        "change",
        updatePlannerOptions
    );


    updatePlannerOptions();

    updateAircraft();

    resetMap();

    loadChart();

}


/* ============================================================
   UPDATE RUNWAYS / PROCEDURES
============================================================ */

function updatePlannerOptions() {

    const departure =
        $("departure")
            .value
            .split(" ")[0];


    const arrival =
        $("arrival")
            .value
            .split(" ")[0];


    setOptions(
        "departureRunway",
        runways[departure] ||
        ["SELECT RUNWAY"]
    );


    setOptions(
        "arrivalRunway",
        runways[arrival] ||
        ["SELECT RUNWAY"]
    );


    const departureProcedures =
        procedures[departure] ||
        {

            sid: [
                "OMNI-DIRECTIONAL"
            ],

            star: [
                "NONE"
            ]

        };


    const arrivalProcedures =
        procedures[arrival] ||
        {

            sid: [
                "OMNI-DIRECTIONAL"
            ],

            star: [
                "NONE"
            ]

        };


    setOptions(
        "sid",
        departureProcedures.sid
    );


    setOptions(
        "star",
        arrivalProcedures.star
    );


    setOptions(
        "sidTransition",
        transitions[departure]?.sid ||
        ["NONE / DIRECT"]
    );


    setOptions(
        "starTransition",
        transitions[arrival]?.star ||
        ["NONE / DIRECT"]
    );

}


/* ============================================================
   AIRCRAFT ICON
============================================================ */

function aircraftSVG(type) {

    let wing;

    if (type === "A380") {

        wing = 38;

    } else if (
        type === "747" ||
        type === "777"
    ) {

        wing = 34;

    } else if (
        type === "A330" ||
        type === "A350" ||
        type === "787"
    ) {

        wing = 31;

    } else {

        wing = 25;

    }


    /*
       SOLID YELLOW SILHOUETTE.
       No yellow outline.
    */

    return `

    <g
        fill="#ffb000"
        stroke="none"
    >

        <path
            d="
            M50 2

            C54 2
            57 9
            57 18

            L57 42

            L${50 + wing} 69

            L${50 + wing - 8} 71

            L57 58

            L57 91

            L50 98

            L43 91

            L43 58

            L${50 - wing + 8} 71

            L${50 - wing} 69

            L43 42

            L43 18

            C43 9
            46 2
            50 2

            Z
            "
        />

    </g>

    `;

}


function updateAircraft() {

    $("aircraftIcon").innerHTML =
        aircraftSVG(
            currentAircraft.type
        );


    $("aircraftIcon").style.transform =
        `
        translate(-50%, -50%)
        rotate(${currentAircraft.heading}deg)
        `;


    $("aircraftLabel").textContent =
        currentAircraft.callsign;


    $("infoCallsign").textContent =
        currentAircraft.callsign;


    $("infoUsername").textContent =
        "Roblox: " +
        currentAircraft.username;


    $("infoAirline").textContent =
        "Airline: " +
        currentAircraft.airline;


    $("infoAircraft").textContent =
        "Aircraft: " +
        currentAircraft.type;


    $("infoHeading").textContent =
        "Heading: " +
        String(
            currentAircraft.heading
        ).padStart(3, "0") +
        "°";

}


/* ============================================================
   AIRCRAFT INFO
============================================================ */

$("aircraft").addEventListener(
    "click",
    event => {

        event.stopPropagation();

        $("aircraftInfo").style.display =

    }
);


function closeAircraftInfo() {

    $("aircraftInfo").style.display =
        "none";

}


/* ============================================================
   LOAD CHART
============================================================ */

async function loadChart() {

    try {

        const response =
            await fetch(
                CHART_URL,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Chart HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const documentSVG =
            new DOMParser()
                .parseFromString(
                    text,
                    "image/svg+xml"
                );


        const svg =
            documentSVG.documentElement;


        const rawViewBox =
            (
                svg.getAttribute(
                    "viewBox"
                ) ||
                "0 0 1000 700"
            )
            .trim()
            .split(/\s+/)
            .map(Number);


        if (
            rawViewBox.length === 4 &&
            rawViewBox.every(
                Number.isFinite
            )
        ) {

            viewBox =
                rawViewBox;

        }


        const copy =
            svg.cloneNode(true);


        copy.removeAttribute("width");
        copy.removeAttribute("height");


        copy.setAttribute(
            "width",
            viewBox[2]
        );


        copy.setAttribute(
            "height",
            viewBox[3]
        );


        $("chart").replaceChildren(
            copy
        );


        $("routeOverlay").setAttribute(
            "viewBox",
            viewBox.join(" ")
        );


        $("routeOverlay").setAttribute(
            "width",
            viewBox[2]
        );


        $("routeOverlay").setAttribute(
            "height",
            viewBox[3]
        );


        /*
           This is the important part:
           waypoint positions are read from
           the SVG itself.
        */

        extractWaypoints(copy);


        syncOverlay();


        $("loading").style.display =
            "none";


        $("status").textContent =
            "PTFS chart • " +
            waypointNodes.length +
            " fixes detected";


    } catch (error) {

        console.error(error);


        $("loading").textContent =
            "Could not load the chart. " +
            "If opening map.html directly, use a local web server.";


        $("status").textContent =
            "Chart loading failed";

    }

}


/* ============================================================
   EXTRACT WAYPOINTS FROM SVG
============================================================ */

function extractWaypoints(svg) {

    waypointNodes = [];

    waypointMap.clear();


    const textElements =
        [
            ...svg.querySelectorAll(
                "text, tspan"
            )
        ];


    for (
        const element
        of textElements
    ) {

        const name =
            (
                element.textContent ||
                ""
            )
            .trim()
            .toUpperCase()
            .replace(
                /\s+/g,
                ""
            );


        /*
           PTFS waypoint identifiers
           are generally short alphanumeric
           labels.
        */

        if (
            !/^[A-Z0-9]{3,5}$/.test(
                name
            )
        ) {

            continue;

        }


        let x =
            parseFloat(
                element.getAttribute("x")
            );


        let y =
            parseFloat(
                element.getAttribute("y")
            );


        /*
           Some SVGs place coordinates
           on a translated parent.
        */

        if (
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ) {

            const transform =
                element.getAttribute(
                    "transform"
                ) || "";


            const match =
                transform.match(
                    /translate\(\s*([-\d.]+)[ ,]+([-\d.]+)\s*\)/
                );


            if (match) {

                x = Number(
                    match[1]
                );

                y = Number(
                    match[2]
                );

            }

        }


        if (
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ) {

            continue;

        }


        if (
            x < viewBox[0] ||
            y < viewBox[1] ||
            x >
                viewBox[0] +
                viewBox[2] ||
            y >
                viewBox[1] +
                viewBox[3]
        ) {

            continue;

        }


        /*
           Avoid obvious non-waypoint
           labels.
        */

        const ignored = [

            "AIR",
            "FIR",
            "ATC",
            "CENTER",
            "RADAR"

        ];


        if (
            ignored.includes(name)
        ) {

            continue;

        }


        if (
            !waypointMap.has(name)
        ) {

            const node = {

                name: name,

                x: x,

                y: y,

                neighbors: []

            };


            waypointNodes.push(
                node
            );


            waypointMap.set(
                name,
                node
            );

        }

    }


    /*
       Build a local graph from the
       actual fixes extracted from the map.

       Each fix connects to nearby fixes.
    */

    for (
        const node
        of waypointNodes
    ) {

        node.neighbors =
            waypointNodes

                .filter(
                    other =>
                        other !== node
                )

                .sort(
                    (a, b) =>
                        distance(
                            node,
                            a
                        ) -
                        distance(
                            node,
                            b
                        )
                )

                .slice(
                    0,
                    6
                );

    }

}


/* ============================================================
   DISTANCE
============================================================ */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* ============================================================
   FIND WAYPOINT
============================================================ */

function findWaypoint(name) {

    return (
        waypointMap.get(name) ||
        waypointNodes.find(
            node =>
                node.name === name
        )
    );

}


/* ============================================================
   A* ROUTING
============================================================ */

function aStar(start, goal) {

    if (
        !start ||
        !goal
    ) {

        return [];

    }


    const open = [
        start
    ];


    const closed =
        new Set();


    const cameFrom =
        new Map();


    const gScore =
        new Map();


    const fScore =
        new Map();


    gScore.set(
        start,
        0
    );


    fScore.set(
        start,
        distance(
            start,
            goal
        )
    );


    while (
        open.length > 0
    ) {

        open.sort(
            (a, b) =>
                (
                    fScore.get(a) ??
                    Infinity
                ) -
                (
                    fScore.get(b) ??
                    Infinity
                )
        );


        const current =
            open.shift();


        if (
            current === goal
        ) {

            const path = [
                current
            ];


            let node =
                current;


            while (
                cameFrom.has(node)
            ) {

                node =
                    cameFrom.get(
                        node
                    );


                path.push(
                    node
                );

            }


            return path.reverse();

        }


        closed.add(
            current
        );


        for (
            const neighbor
            of current.neighbors
        ) {

            if (
                closed.has(
                    neighbor
                )
            ) {

                continue;

            }


            const tentative =
                (
                    gScore.get(
                        current
                    ) ??
                    Infinity
                ) +
                distance(
                    current,
                    neighbor
                );


            if (
                tentative <
                (
                    gScore.get(
                        neighbor
                    ) ??
                    Infinity
                )
            ) {

                cameFrom.set(
                    neighbor,
                    current
                );


                gScore.set(
                    neighbor,
                    tentative
                );


                fScore.set(
                    neighbor,
                    tentative +
                    distance(
                        neighbor,
                        goal
                    )
                );


                if (
                    !open.includes(
                        neighbor
                    )
                ) {

                    open.push(
                        neighbor
                    );

                }

            }

        }

    }


    return [];

}


/* ============================================================
   GENERATE FLIGHT PLAN
============================================================ */

function generateFlightPlan() {

    const departure =
        $("departure")
            .value
            .split(" ")[0];


    const arrival =
        $("arrival")
            .value
            .split(" ")[0];


    /*
       Use the airport labels themselves
       when they exist on the map.
    */

    const start =
        findWaypoint(
            departure
        );


    const goal =
        findWaypoint(
            arrival
        );


    if (
        !start ||
        !goal
    ) {

        alert(
            "The selected airport label was not detected in the loaded chart. The route engine only uses coordinates actually present in the map."
        );

        return;

    }


    const route =
        aStar(
            start,
            goal
        );


    if (
        route.length < 2
    ) {

        alert(
            "No waypoint path could be found."
        );

        return;

    }


    const departureRunway =
        $("departureRunway").value;


    const arrivalRunway =
        $("arrivalRunway").value;


    const sid =
        $("sid").value;


    const sidTransition =
        $("sidTransition").value;


    const star =
        $("star").value;


    const starTransition =
        $("starTransition").value;


    const fixes =
        route.map(
            node =>
                node.name
        );


    /*
       Build the flight plan in the
       familiar PTFS format.
    */

    const routeParts = [

        departure +
        "/" +
        departureRunway,

        sid,

        sidTransition,

        ...fixes,

        star,

        starTransition,

        arrival +
        "/" +
        arrivalRunway

    ];


    const finalRoute =
        routeParts.filter(
            item => {

                return (
                    item &&
                    item !==
                        "NONE" &&
                    item !==
                        "NONE / DIRECT"
                );

            }
        );


    $("routeText").textContent =
        finalRoute.join(" ");


    let chartDistance = 0;


    for (
        let i = 1;
        i < route.length;
        i++
    ) {

        chartDistance +=
            distance(
                route[i - 1],
                route[i]
            );

    }


    $("routeInfo").textContent =

        route.length +
        " visible map fixes • " +

        "Aircraft: " +
        $("aircraftType").value +

        " • Cruise: " +
        $("flightLevel").value +

        " • Chart distance: " +
        chartDistance.toFixed(1);


    $("routeResult").style.display =
        "block";


    drawRoute(
        route
    );


    /*
       Update aircraft type
       to match the planner.
    */

    currentAircraft.type =
        $("aircraftType").value;


    updateAircraft();

}


/* ============================================================
   DRAW ROUTE
============================================================ */

function drawRoute(route) {

    const points =
        route
            .map(
                node =>
                    `${node.x},${node.y}`
            )
            .join(" ");


    $("routeLine")
        .setAttribute(
            "points",
            points
        );


    $("routeWaypoints")
        .innerHTML =


        route.map(
            node => `

                <circle
                    class="routeWaypoint"
                    cx="${node.x}"
                    cy="${node.y}"
                    r="4"
                >

                    <title>
                        ${node.name}
                    </title>

                </circle>

            `
        ).join("");

}


/* ============================================================
   CLEAR ROUTE
============================================================ */

function clearRoute() {

    $("routeLine")
        .setAttribute(
            "points",
            ""
        );


    $("routeWaypoints")
        .innerHTML = "";


    $("routeResult")
        .style.display =
        "none";

}


/* ============================================================
   MAP OVERLAY POSITION
============================================================ */

function syncOverlay() {

    const mapRect =
        $("map")
            .getBoundingClientRect();


    const chartRect =
        $("chart")
            .getBoundingClientRect();


    $("routeOverlay").style.left =
        (
            chartRect.left -
            mapRect.left
        ) +
        "px";


    $("routeOverlay").style.top =
        (
            chartRect.top -
            mapRect.top
        ) +
        "px";


    $("routeOverlay").style.width =
        chartRect.width +
        "px";


    $("routeOverlay").style.height =
        chartRect.height +
        "px";

}


/* ============================================================
   MAP TRANSFORM
============================================================ */

function applyMapTransform() {

    $("chart").style.transform =

        `
        translate(
            calc(-50% + ${panX}px),
            calc(-50% + ${panY}px)
        )
        scale(${mapScale})
        `;


    $("routeOverlay").style.transform =

        `
        translate(
            ${panX}px,
            ${panY}px
        )
        scale(${mapScale})
        `;


    $("zoomText").textContent =

        Math.round(
            mapScale * 100
        ) +
        "%";


    syncOverlay();

}


/* ============================================================
   ZOOM
============================================================ */

function zoomIn() {

    mapScale =
        Math.min(
            6,
            mapScale * 1.25
        );


    applyMapTransform();

}


function zoomOut() {

    mapScale =
        Math.max(
            0.4,
            mapScale * 0.8
        );


    applyMapTransform();

}


/* ============================================================
   RESET MAP
============================================================ */

function resetMap() {

    mapScale = 1;

    panX = 0;
    panY = 0;

    applyMapTransform();

}


/* ============================================================
   MAP DRAG
============================================================ */

$("map").addEventListener(
    "pointerdown",
    event => {

        dragging = true;

        lastMouseX =
            event.clientX;

        lastMouseY =
            event.clientY;


        $("map")
            .setPointerCapture(
                event.pointerId
            );

    }
);


$("map").addEventListener(
    "pointermove",
    event => {

        if (!dragging) {

            return;

        }


        panX +=
            event.clientX -
            lastMouseX;


        panY +=
            event.clientY -
            lastMouseY;


        lastMouseX =
            event.clientX;


        lastMouseY =
            event.clientY;


        applyMapTransform();

    }
);


$("map").addEventListener(
    "pointerup",
    () => {

        dragging = false;

    }
);


$("map").addEventListener(
    "pointercancel",
    () => {

        dragging = false;

    }
);


/* ============================================================
   MOUSE WHEEL ZOOM
============================================================ */

$("map").addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        if (
            event.deltaY < 0
        ) {

            zoomIn();

        } else {

            zoomOut();

        }

    },
    {
        passive: false
    }
);


/* ============================================================
   PANELS
============================================================ */

function openPlanner() {

    $("planner")
        .style.display =
        "block";

}


function closePlanner() {

    $("planner")
        .style.display =
        "none";

}


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    syncOverlay
);


/* ============================================================
   START
============================================================ */

setupPlanner();

</script>

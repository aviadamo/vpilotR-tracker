<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PTFS Flight Planner</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101820;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

#topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:58px;
    z-index:100;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    background:rgba(5,12,18,.97);
    border-bottom:1px solid #344854;
}

.logo{
    font-weight:800;
    margin-right:8px;
}

.logo span{
    color:#ffb000;
}

button{
    font-family:inherit;
}

.topBtn{
    background:#14242f;
    border:1px solid #405563;
    color:white;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
}

.topBtn:hover{
    background:#1d3442;
}

#status{
    margin-left:auto;
    font-size:11px;
    color:#84949e;
}

#map{
    position:fixed;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#101820;
    cursor:grab;
    touch-action:none;
}

#map.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:center center;
}

#chart{
    position:absolute;
    left:0;
    top:0;
}

#routeSvg{
    position:absolute;
    left:0;
    top:0;
    pointer-events:none;
    overflow:visible;
}

#routeLine{
    fill:none;
    stroke:#ffb000;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 3px #000);
}

.routeDot{
    fill:#ffb000;
    stroke:#111820;
    stroke-width:2;
}

/* AIRCRAFT */

#aircraft{
    position:absolute;
    width:70px;
    height:70px;
    z-index:50;
    transform:translate(-50%,-50%);
    cursor:pointer;
}

#aircraftSvg{
    width:60px;
    height:60px;
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    filter:drop-shadow(0 1px 2px #000);
}

#aircraftLabel{
    position:absolute;
    left:40px;
    top:5px;
    background:rgba(5,12,18,.94);
    border:1px solid #4a5d69;
    border-radius:5px;
    padding:3px 6px;
    white-space:nowrap;
    font-size:10px;
}

/* ZOOM */

#zoom{
    position:fixed;
    right:13px;
    bottom:13px;
    z-index:80;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.zoomBtn{
    width:42px;
    height:42px;
    background:rgba(5,13,19,.94);
    color:white;
    border:1px solid #405563;
    border-radius:8px;
    font-size:21px;
    cursor:pointer;
}

#zoomLevel{
    position:fixed;
    right:16px;
    bottom:155px;
    z-index:80;
    background:rgba(5,13,19,.9);
    padding:4px 7px;
    border-radius:5px;
    font-size:10px;
    color:#8b9ba4;
}

/* PANELS */

.panel{
    position:fixed;
    top:70px;
    left:12px;
    width:430px;
    max-width:calc(100vw - 24px);
    max-height:calc(100vh - 82px);
    overflow:auto;
    display:none;
    z-index:90;
    background:rgba(5,13,20,.98);
    border:1px solid #405563;
    border-radius:12px;
    box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.header{
    padding:12px;
    border-bottom:1px solid #293b47;
    display:flex;
    align-items:center;
}

.header strong{
    font-size:15px;
}

.close{
    margin-left:auto;
    border:0;
    background:none;
    color:#8d9ba3;
    font-size:24px;
    cursor:pointer;
}

.body{
    padding:12px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.field{
    margin-bottom:9px;
}

.field label{
    display:block;
    color:#7e8e98;
    font-size:9px;
    text-transform:uppercase;
    margin-bottom:4px;
}

select{
    width:100%;
    padding:9px;
    background:#101d26;
    border:1px solid #3a4e5b;
    color:white;
    border-radius:7px;
    outline:none;
}

select:focus{
    border-color:#66a8d3;
}

.primary{
    width:100%;
    padding:11px;
    background:#1d5f8e;
    border:1px solid #69a8d0;
    color:white;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.secondary{
    width:100%;
    padding:9px;
    margin-top:7px;
    background:#14242f;
    border:1px solid #3a4e5b;
    color:#aeb8bd;
    border-radius:7px;
    cursor:pointer;
}

#result{
    display:none;
    margin-top:12px;
    border-top:1px solid #293b47;
    padding-top:12px;
}

.routeBox{
    background:#101d26;
    border:1px solid #3a4e5b;
    border-radius:7px;
    padding:10px;
    color:#ffbd3d;
    font-size:12px;
    line-height:1.7;
    word-break:break-word;
}

/* AIRCRAFT INFO */

#info{
    position:fixed;
    top:70px;
    right:12px;
    width:320px;
    max-width:calc(100vw - 24px);
    display:none;
    z-index:95;
    background:rgba(5,13,20,.98);
    border:1px solid #405563;
    border-radius:12px;
    box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.infoBody{
    padding:13px;
}

.callsign{
    font-size:20px;
    font-weight:800;
}

.user{
    color:#54a9ff;
    font-size:12px;
    margin-top:4px;
}

.infoLine{
    color:#84949e;
    font-size:12px;
    margin-top:7px;
}

#loading{
    position:fixed;
    top:58px;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#101820;
    color:#8999a3;
}

.attribution{
    position:fixed;
    bottom:5px;
    left:7px;
    z-index:70;
    font-size:8px;
    color:#687983;
    pointer-events:none;
}

@media(max-width:600px){
    .logo{
        display:none;
    }

    #status{
        display:none;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="topbar">

    <div class="logo">
        ✈ PTFS <span>Flight Planner</span>
    </div>

    <button class="topBtn" onclick="openPlanner()">

    </button>

</div>

<script>

/* =========================================================
   REAL PTFS ENROUTE CHART
========================================================= */

const CHART_URL =
"https://raw.githubusercontent.com/Treelon/ptfs-charts/main/Airspace%20map/Enroute%20Chart%20PTFS.svg";


/* =========================================================
   AIRPORTS
========================================================= */

const AIRPORTS = {

    IBAR:"Barra Airport",
    IHEN:"Henstridge Airfield",
    ILAR:"Larnaca Intl.",
    IIAB:"McConnell AFB",
    IPAP:"Paphos Intl.",

    IKFL:"Keflavik Intl.",
    ITEY:"Pingeyri Airport",

    IJAF:"Al Najaf",
    IZOL:"Izolirani Intl.",
    ISCM:"RAF Scampton",

    IBRD:"Bird Island Airfield",
    IDCS:"Saba Airport",
    ITKO:"Tokyo Intl.",

    ILKL:"Lukla Airport",
    IPPH:"Perth Intl.",

    IGAR:"Air Base Garry",
    IBLT:"Boltic Airfield",
    IRFD:"Greater Rockford",
    IMLR:"Mellor Intl.",
    ITRC:"Training Centre",

    IBTH:"Saint Barthelemy",
    IUFO:"UFO Base",

    ISAU:"Sauthamptona Airport",

    ISKP:"Skopelos Airfield"

};


/* =========================================================
   RUNWAYS
========================================================= */

const RUNWAYS = {

    IRFD:["18L","18R","36L","36R"],
    IMLR:["14","32"],
    IPPH:["03","21"],
    ITKO:["16L","16R","34L","34R"],
    ILAR:["04","22"],
    IPAP:["16","34"],
    IZOL:["05","23"],
    IJAF:["09","27"],
    ISAU:["03","21"],
    IGRV:["09","27"],
    ISKP:["02","20"],
    IBTH:["10","28"],
    ILKL:["12","30"],
    IGAR:["09","27"],
    IBLT:["12","30"],
    IBAR:["06","24"],
    IHEN:["09","27"],
    IDCS:["12","30"],
    ISCM:["08","26"],
    IIAB:["18","36"],
    IKFL:["02","20"],
    ITEY:["04","22"],
    IBRD:["09","27"],
    IUFO:["09","27"],
    ITRC:["09","27"]

};


/* =========================================================
   BASIC PROCEDURES

   These are deliberately selectable.
   The route engine uses the actual enroute fixes
   from the PTFS chart.
========================================================= */

const SIDS = {

    IRFD:[
        "NONE",
        "SAVES",
        "INDEX",
        "SETHR",
        "FORIA"
    ],

    IPPH:["NONE"],
    IMLR:["NONE"],
    ITKO:["NONE"],
    ILAR:["NONE"],
    IPAP:["NONE"],
    IZOL:["NONE"],
    IJAF:["NONE"],
    ISAU:["NONE"],
    IGRV:["NONE"],
    ISKP:["NONE"]

};


const STARS = {

    IRFD:[
        "NONE",
        "BEANS",
        "CRACK",
        "GUESS",
        "FORIA",
        "RESURGE",
        "SETHR"
    ],

    IPPH:["NONE"],
    IMLR:["NONE"],
    ITKO:["NONE"],
    ILAR:["NONE"],
    IPAP:["NONE"],
    IZOL:["NONE"],
    IJAF:["NONE"],
    ISAU:["NONE"],
    IGRV:["NONE"],
    ISKP:["NONE"]

};


/* =========================================================
   STATE
========================================================= */

let scale = 1;

let panX = 0;
let panY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let startPanX = 0;
let startPanY = 0;

let chartWidth = 3000;
let chartHeight = 2000;

let waypointNodes = [];


/* =========================================================
   AIRCRAFT
========================================================= */

const aircraft = {

    callsign:"UAE123",

    username:"PilotExample",

    airline:"Emirates",

    type:"A320",

    heading:274,

    x:0,

    y:0

};


/* =========================================================
   OPTIONS
========================================================= */

function setOptions(id, values){

    const el =
        document.getElementById(id);

    el.innerHTML = "";

    for(const value of values){

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent = value;

        el.appendChild(option);

    }

}


/* =========================================================
   SETUP PLANNER
========================================================= */

function setupPlanner(){

    setOptions(
        "departure",
        Object.entries(AIRPORTS)
            .map(
                ([icao,name]) =>
                    `${icao} — ${name}`
            )
    );

    setOptions(
        "arrival",
        Object.entries(AIRPORTS)
            .map(
                ([icao,name]) =>
                    `${icao} — ${name}`
            )
    );


    document.getElementById("departure").value =
        "IRFD — Greater Rockford";

    document.getElementById("arrival").value =
        "IPPH — Perth Intl.";


    for(
        let fl=10;
        fl<=150;
        fl+=10
    ){

        const option =
            document.createElement("option");

        option.value =
            "FL" +
            String(fl).padStart(3,"0");

        option.textContent =
            option.value;

        document
            .getElementById("flightLevel")
            .appendChild(option);

    }


    document.getElementById("flightLevel").value =
        "FL070";


    document
        .getElementById("departure")
        .addEventListener(
            "change",
            updatePlanner
        );


    document
        .getElementById("arrival")
        .addEventListener(
            "change",
            updatePlanner
        );


    updatePlanner();

}


/* =========================================================
   PLANNER UPDATES
========================================================= */

function getICAO(id){

    return document
        .getElementById(id)
        .value
        .split(" ")[0];

}


function updatePlanner(){

    const dep =
        getICAO("departure");

    const arr =
        getICAO("arrival");


    setOptions(
        "depRunway",
        RUNWAYS[dep] || ["SELECT"]
    );


    setOptions(
        "arrRunway",
        RUNWAYS[arr] || ["SELECT"]
    );


    setOptions(
        "sid",
        SIDS[dep] || ["NONE"]
    );


    setOptions(
        "star",
        STARS[arr] || ["NONE"]
    );

}


/* =========================================================
   LOAD REAL CHART
========================================================= */

async function loadChart(){

    try{

        const response =
            await fetch(
                CHART_URL,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        const xml =
            new DOMParser()
                .parseFromString(
                    text,
                    "image/svg+xml"
                );


        const svg =
            xml.documentElement;


        if(
            svg.nodeName.toLowerCase() !==
            "svg"
        ){

            throw new Error(
                "Invalid SVG"
            );

        }


        let viewBox =
            svg.getAttribute(
                "viewBox"
            );


        if(viewBox){

            const numbers =
                viewBox
                    .trim()
                    .split(/[\s,]+/)
                    .map(Number);


            if(
                numbers.length === 4 &&
                numbers.every(
                    Number.isFinite
                )
            ){

                chartWidth =
                    numbers[2];

                chartHeight =
                    numbers[3];

            }

        }else{

            chartWidth =
                parseFloat(
                    svg.getAttribute("width")
                ) || 3000;

            chartHeight =
                parseFloat(
                    svg.getAttribute("height")
                ) || 2000;

        }


        svg.setAttribute(
            "width",
            chartWidth
        );

        svg.setAttribute(
            "height",
            chartHeight
        );


        svg.style.display =
            "block";


        document
            .getElementById("chart")
            .innerHTML = "";


        document
            .getElementById("chart")
            .appendChild(
                document.importNode(
                    svg,
                    true
                )
            );


        document
            .getElementById("routeSvg")
            .setAttribute(
                "width",
                chartWidth
            );


        document
            .getElementById("routeSvg")
            .setAttribute(
                "height",
                chartHeight
            );


        document
            .getElementById("world")
            .style.width =
            chartWidth + "px";


        document
            .getElementById("world")
            .style.height =
            chartHeight + "px";


        document
            .getElementById("chart")
            .style.width =
            chartWidth + "px";


        document
            .getElementById("chart")
            .style.height =
            chartHeight + "px";


        extractWaypoints(svg);


        placeAircraft();


        applyTransform();


        document
            .getElementById("loading")
            .style.display =
            "none";


        document
            .getElementById("status")
            .textContent =
            "PTFS enroute chart • " +
            waypointNodes.length +
            " fixes";


    }catch(error){

        console.error(error);


        document
            .getElementById("loading")
            .innerHTML =
            `
            <div style="text-align:center">
                <b>Could not load the PTFS chart.</b>
                <br><br>
                Check your internet connection.
                <br>
                If you opened this file with file://,
                use a local web server.
                <br><br>
                Error: ${error.message}
            </div>
            `;

    }

}


/* =========================================================
   WAYPOINT EXTRACTION

   Reads text labels directly from the actual PTFS
   enroute SVG.
========================================================= */

function extractWaypoints(svg){

    waypointNodes = [];


    const elements =
        [
            ...svg.querySelectorAll(
                "text"
            )
        ];


    const seen =
        new Set();


    for(
        const element
        of elements
    ){

        const name =
            (
                element.textContent ||
                ""
            )
            .trim()
            .replace(
                /\s+/g,
                ""
            )
            .toUpperCase();


        if(
            !/^[A-Z0-9]{2,6}$/.test(name)
        ){

            continue;

        }


        if(seen.has(name)){

            continue;

        }


        let x =
            parseFloat(
                element.getAttribute("x")
            );

        let y =
            parseFloat(
                element.getAttribute("y")
            );


        if(
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ){

            continue;

        }


        /*
           Ignore giant headings and obvious
           non-fix labels.
        */

        const bad = [

            "PTFS",
            "AIRSPACE",
            "CHART",
            "NORTH",
            "SOUTH",
            "EAST",
            "WEST",
            "CENTER",
            "RADIO",
            "ATC"

        ];


        if(
            bad.includes(name)
        ){

            continue;

        }


        seen.add(name);


        waypointNodes.push({

            name:name,

            x:x,

            y:y

        });

    }


    /*
       Some charts use tspan for labels.
       Add those if normal text extraction
       didn't find enough fixes.
    */

    if(
        waypointNodes.length < 10
    ){

        const tspans =
            [
                ...svg.querySelectorAll(
                    "tspan"
                )
            ];


        for(
            const element
            of tspans
        ){

            const name =
                (
                    element.textContent ||
                    ""
                )
                .trim()
                .replace(
                    /\s+/g,
                    ""
                )
                .toUpperCase();


            if(
                !/^[A-Z0-9]{2,6}$/.test(
                    name
                )
            ){

                continue;

            }


            if(seen.has(name)){

                continue;

            }


            const x =
                parseFloat(
                    element.getAttribute("x")
                );

            const y =
                parseFloat(
                    element.getAttribute("y")
                );


            if(
                !Number.isFinite(x) ||
                !Number.isFinite(y)
            ){

                continue;

            }


            seen.add(name);


            waypointNodes.push({

                name:name,

                x:x,

                y:y

            });

        }

    }

}


/* =========================================================
   FIND NEAREST WAYPOINT
========================================================= */

function nearestWaypoint(x,y){

    let best = null;

    let bestDistance =
        Infinity;


    for(
        const node
        of waypointNodes
    ){

        const d =
            Math.hypot(
                node.x-x,
                node.y-y
            );


        if(d < bestDistance){

            bestDistance = d;

            best = node;

        }

    }


    return best;

}


/* =========================================================
   ROUTE GENERATION

   We make a waypoint chain between the
   nearest fixes around departure/arrival.

   This avoids the broken "airport code must
   literally be a waypoint" problem.
========================================================= */

function generateRoute(){

    if(
        waypointNodes.length < 2
    ){

        alert(
            "The chart did not expose enough waypoint coordinates."
        );

        return;

    }


    const dep =
        getICAO("departure");

    const arr =
        getICAO("arrival");


    /*
       Use airport names as search terms
       first, then fall back to nearest
       known chart positions where possible.
    */

    let start =
        waypointNodes.find(
            n =>
                n.name === dep
        );


    let end =
        waypointNodes.find(
            n =>
                n.name === arr
        );


    /*
       If airport labels aren't represented
       as fix names, choose the first/last
       suitable chart point.
    */

    if(!start){

        start =
            waypointNodes[0];

    }


    if(!end){

        end =
            waypointNodes[
                waypointNodes.length-1
            ];

    }


    /*
       Create a route through actual chart fixes.

       Rather than connecting arbitrary neighboring
       text labels, select points progressing
       geometrically from start to end.
    */

    const dx =
        end.x - start.x;

    const dy =
        end.y - start.y;


    const total =
        Math.hypot(dx,dy);


    const steps =
        Math.max(
            5,
            Math.min(
                14,
                Math.round(
                    total / 220
                )
            )
        );


    const route = [
        start
    ];


    for(
        let i=1;
        i<steps;
        i++
    ){

        const progress =
            i / steps;


        const targetX =
            start.x +
            dx *
            progress;


        const targetY =
            start.y +
            dy *
            progress;


        const candidate =
            waypointNodes
                .filter(
                    node =>
                        !route.includes(node)
                )
                .sort(
                    (a,b) => {

                        const da =
                            Math.hypot(
                                a.x-targetX,
                                a.y-targetY
                            );

                        const db =
                            Math.hypot(
                                b.x-targetX,
                                b.y-targetY
                            );

                        return da-db;

                    }
                )[0];


        if(
            candidate &&
            !route.includes(candidate)
        ){

            route.push(
                candidate
            );

        }

    }


    if(
        !route.includes(end)
    ){

        route.push(end);

    }


    drawRoute(route);


    const fixes =
        route.map(
            n => n.name
        );


    const depRunway =
        document.getElementById(
            "depRunway"
        ).value;


    const arrRunway =
        document.getElementById(
            "arrRunway"
        ).value;


    const sid =
        document.getElementById(
            "sid"
        ).value;


    const star =
        document.getElementById(
            "star"
        ).value;


    const fl =
        document.getElementById(
            "flightLevel"
        ).value;


    const routeParts = [

        dep +
        "/" +
        depRunway,

        sid !== "NONE"
            ? sid
            : null,

        ...fixes,

        star !== "NONE"
            ? star
            : null,

        arr +
        "/" +
        arrRunway

    ].filter(Boolean);


    document
        .getElementById("routeText")
        .textContent =
        routeParts.join(" ");


    document
        .getElementById("result")
        .style.display =
        "block";


    aircraft.type =
        document.getElementById(
            "aircraftType"
        ).value;


    updateAircraft();

}


/* =========================================================
   DRAW ROUTE
========================================================= */

function drawRoute(route){

    const points =
        route
            .map(
                node =>
                    `${node.x},${node.y}`
            )
            .join(" ");


    document
        .getElementById("routeLine")
        .setAttribute(
            "points",
            points
        );


    document
        .getElementById("routeDots")
        .innerHTML =
        route.map(
            node =>
            `
            <circle
                class="routeDot"
                cx="${node.x}"
                cy="${node.y}"
                r="5"
            >
                <title>${node.name}</title>
            </circle>
            `
        ).join("");

}


function clearRoute(){

    document
        .getElementById("routeLine")
        .setAttribute(
            "points",
            ""
        );


    document
        .getElementById("routeDots")
        .innerHTML = "";


    document
        .getElementById("result")
        .style.display =
        "none";

}


/* =========================================================
   FILLED YELLOW AIRCRAFT
========================================================= */

function aircraftShape(){

    let wing = 25;


    if(
        aircraft.type === "A380" ||
        aircraft.type === "747"
    ){

        wing = 39;

    }else if(
        aircraft.type === "777" ||
        aircraft.type === "A340"
    ){

        wing = 35;

    }else if(
        aircraft.type === "A330" ||
        aircraft.type === "A350" ||
        aircraft.type === "787"
    ){

        wing = 32;

    }


    return `

    <path
        fill="#ffb000"
        stroke="none"
        d="
        M50 2

        C46 5 44 12 44 20

        L44 43

        L${50-wing} 68

        L${50-wing+7} 71

        L44 57

        L44 91

        L50 98

        L56 91

        L56 57

        L${50+wing-7} 71

        L${50+wing} 68

        L56 43

        L56 20

        C56 12 54 5 50 2

        Z
        "
    />

    `;

}


function updateAircraft(){

    document
        .getElementById("aircraftSvg")
        .innerHTML =
        aircraftShape();


    document
        .getElementById("aircraftSvg")
        .style.transform =
        `
        translate(-50%,-50%)
        rotate(${aircraft.heading}deg)
        `;


    document
        .getElementById("aircraftLabel")
        .textContent =
        aircraft.callsign;


    document
        .getElementById("infoCallsign")
        .textContent =
        aircraft.callsign;


    document
        .getElementById("infoUser")
        .textContent =
        "Roblox: " +
        aircraft.username;


    document
        .getElementById("infoAirline")
        .textContent =
        "Airline: " +
        aircraft.airline;


    document
        .getElementById("infoType")
        .textContent =
        "Aircraft: " +
        aircraft.type;


    document
        .getElementById("infoHeading")
        .textContent =
        "Heading: " +
        String(
            aircraft.heading
        ).padStart(3,"0") +
        "°";

}


/* =========================================================
   AIRCRAFT POSITION
========================================================= */

function placeAircraft(){

    if(
        waypointNodes.length === 0
    ){

        return;

    }


    /*
       Start the aircraft at a real chart fix
       instead of following the camera.
    */

    const node =
        waypointNodes[
            Math.floor(
                waypointNodes.length / 2
            )
        ];


    aircraft.x =
        node.x;

    aircraft.y =
        node.y;


    document
        .getElementById("aircraft")
        .style.left =
        aircraft.x + "px";


    document
        .getElementById("aircraft")
        .style.top =
        aircraft.y + "px";


    updateAircraft();

}


/* =========================================================
   MAP TRANSFORM
========================================================= */

function applyTransform(){

    document
        .getElementById("world")
        .style.transform =
        `
        translate(
            calc(-50% + ${panX}px),
            calc(-50% + ${panY}px)
        )
        scale(${scale})
        `;


    document
        .getElementById("zoomLevel")
        .textContent =
        Math.round(
            scale*100
        ) + "%";

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

    scale =
        Math.min(
            5,
            scale*1.25
        );


    applyTransform();

}


function zoomOut(){

    scale =
        Math.max(
            .35,
            scale*.8
        );


    applyTransform();

}


function resetMap(){

    scale=1;

    panX=0;

    panY=0;

    applyTransform();

}


/* =========================================================
   DRAG
========================================================= */

const map =
    document.getElementById("map");


map.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        map.classList.add(
            "dragging"
        );


        dragStartX=e.clientX;

        dragStartY=e.clientY;

        startPanX=panX;

        startPanY=panY;


        map.setPointerCapture(
            e.pointerId
        );

    }
);


map.addEventListener(
    "pointermove",
    e=>{

        if(!dragging){

            return;

        }


        panX =
            startPanX +
            (
                e.clientX -
                dragStartX
            );


        panY =
            startPanY +
            (
                e.clientY -
                dragStartY
            );


        applyTransform();

    }
);


map.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
        map.classList.remove(
            "dragging"
        );
    }
);


map.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
        map.classList.remove(
            "dragging"
        );
    }
);


/* =========================================================
   WHEEL ZOOM
========================================================= */

map.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();


        if(e.deltaY < 0){

            zoomIn();

        }else{

            zoomOut();

        }

    },
    {
        passive:false
    }
);


/* =========================================================
   PANELS
========================================================= */

function openPlanner(){

    document
        .getElementById("planner")
        .style.display =
        "block";

}


function closePlanner(){

    document
        .getElementById("planner")
        .style.display =
        "none";

}


document
    .getElementById("aircraft")
    .addEventListener(
        "click",
        e=>{

            e.stopPropagation();

            document
                .getElementById("info")
                .style.display =
                "block";

        }
    );


function closeInfo(){

    document
        .getElementById("info")
        .style.display =
        "none";

}


/* =========================================================
   START
========================================================= */

setupPlanner();

loadChart();

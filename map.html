<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- KEEP YOUR WEBSITE NAME -->
<title>PTFS Flight Planner</title>
<style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #101820;
    color: white;
}
/* =========================================================
   TOP BAR
========================================================= */
#topbar {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    right: 0;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    background: rgba(7, 13, 19, 0.97);
    border-bottom: 1px solid #344653;
}
.logo {
    font-weight: 800;
    white-space: nowrap;
}
.logo span {
    color: #ffb000;
}
.top-button {
    border: 1px solid #354858;
    background: #121d27;
    color: white;
    padding: 8px 11px;
    border-radius: 7px;
    cursor: pointer;
}
.top-button:hover {
    background: #1c2b38;
}
#status {
    margin-left: auto;
    color: #81909b;
    font-size: 11px;
}
/* =========================================================
   MAP
========================================================= */
#map {
    position: fixed;
    left: 0;
    right: 0;
    top: 58px;
    bottom: 0;
    overflow: hidden;
    background: #101923;
    touch-action: none;
}
#world {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    transform-origin: center center;
}
/*
   ENROUTE MAP
   Keep using your current PTFS enroute image here if you
   already have one that works.
*/
#enroute {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1700px;
    max-width: none;
    transform: translate(-50%, -50%);
    user-select: none;
    pointer-events: none;
}
/* =========================================================
   ROUTE
========================================================= */
#routeSVG {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
#routePath {
    fill: none;
    stroke: #ffb000;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
        drop-shadow(0 0 4px rgba(255, 176, 0, .8));
}
/* =========================================================
   WAYPOINTS
========================================================= */
#navigationLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.point {
    position: absolute;
    width: 9px;
    height: 9px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ffad00;
    border: 1px solid #ffe4a6;
    box-shadow: 0 0 6px rgba(255, 173, 0, .7);
    pointer-events: auto;
    cursor: pointer;
}
.point.airport {
    width: 14px;
    height: 14px;
    background: white;
    border: 2px solid #55aaff;
    box-shadow:
        0 0 8px rgba(85, 170, 255, .8);
}
.pointLabel {
    position: absolute;
    left: 13px;
    top: -5px;
    white-space: nowrap;
    font-size: 9px;
    font-weight: 600;
    color: white;
    text-shadow:
        0 1px 4px black;
    pointer-events: none;
}
/* =========================================================
   AIRCRAFT
========================================================= */
.aircraft {
    position: absolute;
    width: 58px;
    height: 58px;
    transform:
        translate(-50%, -50%);
    z-index: 200;
    cursor: pointer;
    /*
       IMPORTANT:
       The aircraft itself scales with the map because it
       lives inside #world.
    */
}
.aircraft img {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    object-fit: contain;
    transform-origin: center center;
    /*
       FORCE BLACK SVG SILHOUETTES TO YELLOW.
       brightness(0) makes the entire SVG black.
       The following filters turn it into yellow.
    */
    filter:
        brightness(0)
        saturate(100%)
        invert(73%)
        sepia(91%)
        saturate(1820%)
        hue-rotate(359deg)
        brightness(103%)
        contrast(105%);
    /*
       This makes the aircraft look filled rather than
       appearing as a black outline.
    */
}
/*
   Yellow aircraft glow
*/
.aircraft::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 48px;
    height: 48px;
    transform: translate(-50%, -50%);
    background: rgba(255, 176, 0, .08);
    border-radius: 50%;
    pointer-events: none;
}
.aircraftTag {
    position: absolute;
    left: 44px;
    top: 7px;
    padding: 3px 6px;
    border-radius: 5px;
    background: rgba(4, 9, 14, .95);
    border: 1px solid #354858;
    color: white;
    font-size: 10px;
    white-space: nowrap;
}
/* =========================================================
   MAP CONTROLS
========================================================= */
#controls {
    position: fixed;
    right: 13px;
    bottom: 15px;
    z-index: 400;
    display: flex;
    flex-direction: column;
    gap: 6px;
}
#controls button {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    border: 1px solid #3a4d5d;
    background: rgba(7, 13, 19, .95);
    color: white;
    font-size: 20px;
    cursor: pointer;
}
#zoomLevel {
    position: fixed;
    right: 15px;
    bottom: 155px;
    z-index: 400;
    background: rgba(7, 13, 19, .9);
    padding: 4px 7px;
    border-radius: 5px;
    color: #8d9ba6;
    font-size: 10px;
}
/* =========================================================
   PANELS
========================================================= */
.panel {
    position: fixed;
    z-index: 500;
    top: 70px;
    left: 12px;
    width: 365px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 84px);
    overflow: auto;
    background: rgba(7, 13, 19, .98);
    border: 1px solid #354858;
    border-radius: 12px;
    box-shadow:
        0 20px 55px rgba(0,0,0,.55);
    display: none;
}
.panelHead {
    display: flex;
    align-items: center;
    padding: 13px;
    border-bottom: 1px solid #293a49;
}
.panelHead strong {
    font-size: 15px;
}
.close {
    margin-left: auto;
    border: 0;
    background: none;
    color: #8c9aa5;
    font-size: 21px;
    cursor: pointer;
}
.panelBody {
    padding: 13px;
}
.field {
    margin-bottom: 10px;
}
.field label {
    display: block;
    margin-bottom: 5px;
    color: #7f909c;
    font-size: 9px;
    text-transform: uppercase;
}
.field input,
.field select {
    width: 100%;
    padding: 9px;
    border-radius: 7px;
    border: 1px solid #344858;
    background: #111c26;
    color: white;
    outline: none;
}
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.primary {
    width: 100%;
    padding: 11px;
    border-radius: 7px;
    border: 1px solid #4a91c8;
    background: #1c527d;
    color: white;
    font-weight: 700;
    cursor: pointer;
}
.secondary {
    width: 100%;
    margin-top: 7px;
    padding: 9px;
    border-radius: 7px;
    border: 1px solid #354858;
    background: #121d27;
    color: #9aa8b3;
    cursor: pointer;
}
.result {
    display: none;
    margin-top: 12px;
    border-top: 1px solid #293a49;
    padding-top: 12px;
}
.routeBox {
    padding: 10px;
    border-radius: 7px;
    border: 1px solid #293a49;
    background: #111c26;
    color: #ffbd3d;
    font-size: 12px;
    line-height: 1.7;
    word-break: break-word;
}
.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 8px;
}
.stat {
    padding: 8px;
    background: #111c26;
    border: 1px solid #293a49;
    border-radius: 6px;
}
.stat small {
    display: block;
    color: #71818d;
    font-size: 9px;
}
.stat strong {
    display: block;
    margin-top: 3px;
}
/* =========================================================
   CHART
========================================================= */
#chartPanel {
    position: fixed;
    z-index: 700;
    top: 70px;
    right: 12px;
    bottom: 12px;
    width: 500px;
    max-width: calc(100vw - 24px);
    background: #071019;
    border: 1px solid #354858;
    border-radius: 12px;
    overflow: hidden;
    display: none;
}
#chartHead {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #293a49;
}
#chartHead button {
    margin-left: auto;
    border: 0;
    background: none;
    color: #8997a2;
    font-size: 21px;
    cursor: pointer;
}
#chart {
    width: 100%;
    height: calc(100% - 48px);
    object-fit: contain;
}
/* =========================================================
   AIRCRAFT INFO
========================================================= */
#aircraftPanel {
    position: fixed;
    z-index: 800;
    right: 12px;
    top: 70px;
    width: 350px;
    max-width: calc(100vw - 24px);
    background: rgba(7, 13, 19, .98);
    border: 1px solid #354858;
    border-radius: 12px;
    overflow: hidden;
    display: none;
}
#aircraftHead {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #293a49;
}
#aircraftHead button {
    margin-left: auto;
    border: 0;
    background: none;
    color: #8997a2;
    font-size: 21px;
    cursor: pointer;
}
.photo {
    height: 180px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101923;
    color: #657581;
}
.info {
    padding: 13px;
}
.big {
    font-size: 21px;
    font-weight: 800;
}
.blue {
    color: #58adff;
    font-size: 12px;
    margin-top: 3px;
}
.muted {
    color: #83919c;
    font-size: 12px;
    margin-top: 5px;
}
/* =========================================================
   MOBILE
========================================================= */
@media(max-width:700px) {
    #status {
        display: none;
    }
    .logo {
        font-size: 13px;
    }
    .top-button {
        padding: 7px;
        font-size: 10px;
    }
    #chartPanel {
        left: 12px;
        right: 12px;
        width: auto;
    }
}
</style>
</head>
<body>
<!-- =======================================================

======================================================= -->

<!-- =======================================================

<script>
/* =========================================================
   CONFIG
========================================================= */
const CONFIG = {
    DATA_URL: "ptfs-data.json",
    /*
       Aircraft SVG repository.
    */
    ICON_URL:
        "https://raw.githubusercontent.com/RexKramer1/AircraftShapesSVG/main/Shapes%20SVG/"
};
/* =========================================================
   DATA
========================================================= */
let DATA = {
    waypoints: {},
    airports: {},
    procedures: {}
};
/* =========================================================
   MAP STATE
========================================================= */
let scale = 1;
let panX = 0;
let panY = 0;
let pointers = new Map();
let lastX = 0;
let lastY = 0;
let pinchDistance = null;
let currentRoute = [];
/* =========================================================
   AIRCRAFT
========================================================= */
const aircraft = {
    callsign: "UAE123",
    username: "PilotExample",
    airline: "Emirates",
    type: "A320",
    heading: 274
};
/* =========================================================
   AIRCRAFT ICONS
========================================================= */
const ICONS = {
    "A220": "A220.svg",
    "A318": "A318.svg",
    "A319": "A319.svg",
    "A320": "A320.svg",
    "A321": "A321.svg",
    "A330": "A333.svg",
    "A340": "A343.svg",
    "A350": "A359.svg",
    "A380": "A388.svg",
    "737": "B738.svg",
    "747": "B748.svg",
    "757": "B752.svg",
    "767": "B763.svg",
    "777": "B77W.svg",
    "787": "B789.svg",
    "MD-11": "MD11.svg",
    "DC-10": "DC10.svg",
    "DC-9": "DC9.svg",
    "CRJ": "CRJ9.svg",
    "ERJ": "E175.svg",
    "E190": "E190.svg",
    "ATR": "ATR72.svg",
    "Dash 8": "DH8D.svg",
    "Concorde": "Concorde.svg",
    "Tu-154": "TU154.svg",
    "Il-96": "IL96.svg",
    "An-225": "AN225.svg"
};
/* =========================================================
   UPDATE AIRCRAFT
========================================================= */
function updateAircraft() {
    const img =
        document.getElementById(
            "aircraftIcon"
        );
    const filename =
        ICONS[aircraft.type];
    if (filename) {
        img.src =
            CONFIG.ICON_URL +
            filename;
    }
    /*
       Rotate the actual aircraft silhouette
       in the direction it is flying.
    */
    img.style.transform =
        `translate(-50%, -50%) rotate(${aircraft.heading}deg)`;
    document.getElementById(
        "aircraftTag"
    ).textContent =
        aircraft.callsign;
    document.getElementById(
        "infoCallsign"
    ).textContent =
        aircraft.callsign;
    document.getElementById(
        "infoUser"
    ).textContent =
        "Roblox: " +
        aircraft.username;
    document.getElementById(
        "infoAirline"
    ).textContent =
        "Airline: " +
        aircraft.airline;
    document.getElementById(
        "infoType"
    ).textContent =
        "Aircraft: " +
        aircraft.type;
    document.getElementById(
        "infoHeading"
    ).textContent =
        "Heading: " +
        String(
            aircraft.heading
        ).padStart(3, "0") +
        "°";
}
/* =========================================================
   LOAD PTFS DATA
========================================================= */
async function loadData() {
    try {
        const response =
            await fetch(
                CONFIG.DATA_URL
            );
        if (!response.ok) {
            throw new Error(
                "PTFS data file not found"
            );
        }
        DATA =
            await response.json();
        renderNavigation();
        document.getElementById(
            "status"
        ).textContent =
            `${Object.keys(DATA.waypoints || {}).length} PTFS waypoints`;
    }
    catch (error) {
        console.error(error);
        document.getElementById(
            "status"
        ).textContent =
            "Map loaded — PTFS data not connected yet";
    }
}
/* =========================================================
   RENDER NAVIGATION
========================================================= */
function renderNavigation() {
    const layer =
        document.getElementById(
            "navigationLayer"
        );
    layer.innerHTML = "";
    for (
        const [name, waypoint]
        of Object.entries(
            DATA.waypoints || {}
        )
    ) {
        addPoint(
            name,
            waypoint,
            false
        );
    }
    for (
        const [icao, airport]
        of Object.entries(
            DATA.airports || {}
        )
    ) {
        addPoint(
            icao,
            airport,
            true
        );
    }
}
function addPoint(
    name,
    data,
    airport
) {
    const point =
        document.createElement(
            "div"
        );
    point.className =
        airport
        ? "point airport"
        : "point";
    point.style.left =
        `${data.x * 100}%`;
    point.style.top =
        `${data.y * 100}%`;
    const label =
        document.createElement(
            "span"
        );
    label.className =
        "pointLabel";
    label.textContent =
        name;
    point.appendChild(
        label
    );
    point.onclick =
        event => {
            event.stopPropagation();
            if (airport) {
                openAirport(
                    name
                );
            }
            else {
                waypointInfo(
                    name,
                    data
                );
            }
        };
    document.getElementById(
        "navigationLayer"
    ).appendChild(
        point
    );
}
/* =========================================================
   ZOOM
========================================================= */
function updateMap() {
    document.getElementById(
        "world"
    ).style.transform =
        `translate(${panX}px, ${panY}px) scale(${scale})`;
    document.getElementById(
        "zoomLevel"
    ).textContent =
        Math.round(
            scale * 100
        ) + "%";
}
function zoomIn() {
    scale =
        Math.min(
            6,
            scale * 1.25
        );
    updateMap();
}
function zoomOut() {
    scale =
        Math.max(
            .4,
            scale * .8
        );
    updateMap();
}
function resetMap() {
    scale = 1;
    panX = 0;
    panY = 0;
    updateMap();
}
/* =========================================================
   PAN + PINCH ZOOM
========================================================= */
const map =
    document.getElementById(
        "map"
    );
map.addEventListener(
    "pointerdown",
    event => {
        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );
        map.setPointerCapture(
            event.pointerId
        );
        if (
            pointers.size === 1
        ) {
            lastX =
                event.clientX;
            lastY =
                event.clientY;
        }
        if (
            pointers.size === 2
        ) {
            const p =
                [...pointers.values()];
            pinchDistance =
                Math.hypot(
                    p[0].x - p[1].x,
                    p[0].y - p[1].y
                );
        }
    }
);
map.addEventListener(
    "pointermove",
    event => {
        if (
            !pointers.has(
                event.pointerId
            )
        ) return;
        pointers.set(
            event.pointerId,
            {
                x: event.clientX,
                y: event.clientY
            }
        );
        if (
            pointers.size === 1
        ) {
            panX +=
                event.clientX -
                lastX;
            panY +=
                event.clientY -
                lastY;
            lastX =
                event.clientX;
            lastY =
                event.clientY;
            updateMap();
        }
        if (
            pointers.size === 2
        ) {
            const p =
                [...pointers.values()];
            const distance =
                Math.hypot(
                    p[0].x - p[1].x,
                    p[0].y - p[1].y
                );
            if (pinchDistance) {
                scale *=
                    distance /
                    pinchDistance;
                scale =
                    Math.max(
                        .4,
                        Math.min(
                            6,
                            scale
                        )
                    );
                updateMap();
            }
            pinchDistance =
                distance;
        }
    }
);
map.addEventListener(
    "pointerup",
    event => {
        pointers.delete(
            event.pointerId
        );
        if (
            pointers.size < 2
        ) {
            pinchDistance =
                null;
        }
    }
);
/* =========================================================
   A* ROUTING
========================================================= */
function heuristic(
    a,
    b
) {
    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}
function findPath(
    start,
    goal
) {
    const nodes =
        DATA.waypoints || {};
    if (
        !nodes[start] ||
        !nodes[goal]
    ) {
        return [];
    }
    const open =
        new Set([
            start
        ]);
    const came = {};
    const g = {
        [start]: 0
    };
    const f = {
        [start]:
            heuristic(
                nodes[start],
                nodes[goal]
            )
    };
    while (
        open.size
    ) {
        let current =
            [...open][0];
        for (
            const node of open
        ) {
            if (
                (f[node] ?? Infinity)
                <
                (f[current] ?? Infinity)
            ) {
                current =
                    node;
            }
        }
        if (
            current === goal
        ) {
            const path =
                [current];
            while (
                came[current]
            ) {
                current =
                    came[current];
                path.unshift(
                    current
                );
            }
            return path;
        }
        open.delete(
            current
        );
        const neighbors =
            nodes[current].neighbors ||
            nodes[current].connections ||
            [];
        for (
            const next
            of neighbors
        ) {
            if (
                !nodes[next]
            ) continue;
            const cost =
                heuristic(
                    nodes[current],
                    nodes[next]
                );
            const tentative =
                g[current] +
                cost;
            if (
                tentative <
                (g[next] ?? Infinity)
            ) {
                came[next] =
                    current;
                g[next] =
                    tentative;
                f[next] =
                    tentative +
                    heuristic(
                        nodes[next],
                        nodes[goal]
                    );
                open.add(
                    next
                );
            }
        }
    }
    return [];
}
/* =========================================================
   NEAREST WAYPOINT
========================================================= */
function nearestWaypoint(
    airport
) {
    const a =
        DATA.airports?.[
            airport
        ];
    if (!a) {
        return null;
    }
    if (
        a.nearestWaypoint
    ) {
        return a.nearestWaypoint;
    }
    let closest = null;
    let distance =
        Infinity;
    for (
        const [
            name,
            waypoint
        ]
        of Object.entries(
            DATA.waypoints || {}
        )
    ) {
        const d =
            heuristic(
                a,
                waypoint
            );
        if (
            d < distance
        ) {
            distance =
                d;
            closest =
                name;
        }
    }
    return closest;
}
/* =========================================================
   GENERATE ROUTE
========================================================= */
function generateRoute() {
    const dep =
        document
        .getElementById(
            "dep"
        )
        .value
        .trim()
        .toUpperCase();
    const arr =
        document
        .getElementById(
            "arr"
        )
        .value
        .trim()
        .toUpperCase();
    if (
        !DATA.airports?.[dep] ||
        !DATA.airports?.[arr]
    ) {
        alert(
            "That airport isn't in the PTFS navigation dataset yet."
        );
        return;
    }
    const start =
        nearestWaypoint(
            dep
        );
    const end =
        nearestWaypoint(
            arr
        );
    if (
        !start ||
        !end
    ) {
        alert(
            "Could not find navigation points for the airports."
        );
        return;
    }
    const route =
        findPath(
            start,
            end
        );
    if (
        !route.length
    ) {
        alert(
            "No connected PTFS route was found."
        );
        return;
    }
    currentRoute =
        [
            dep,
            ...route,
            arr
        ];
    document.getElementById(
        "routeText"
    ).textContent =
        currentRoute.join(
            " "
        );
    document.getElementById(
        "cruise"
    ).textContent =
        document.getElementById(
            "level"
        ).value;
    document.getElementById(
        "distance"
    ).textContent =
        calculateDistance(
            route
        ) + " NM";
    document.getElementById(
        "result"
    ).style.display =
        "block";
    drawRoute(
        route
    );
}
function calculateDistance(
    route
) {
    let total = 0;
    for (
        let i = 1;
        i < route.length;
        i++
    ) {
        const a =
            DATA.waypoints[
                route[i - 1]
            ];
        const b =
            DATA.waypoints[
                route[i]
            ];
        if (
            a &&
            b
        ) {
            total +=
                heuristic(
                    a,
                    b
                );
        }
    }
    /*
       This will be calibrated to the real
       PTFS enroute coordinate scale when the
       actual navigation dataset is connected.
    */
    return Math.round(
        total * 1000
    );
}
/* =========================================================
   DRAW ROUTE
========================================================= */
function drawRoute(
    route
) {
    const points = [];
    for (
        const name
        of route
    ) {
        const waypoint =
            DATA.waypoints[
                name
            ];
        if (!waypoint) {
            continue;
        }
        points.push(
            `${waypoint.x * 1000},${waypoint.y * 700}`
        );
    }
    document.getElementById(
        "routePath"
    ).setAttribute(
        "points",
        points.join(" ")
    );
}
function clearRoute() {
    currentRoute = [];
    document.getElementById(
        "routePath"
    ).setAttribute(
        "points",
        ""
    );
    document.getElementById(
        "result"
    ).style.display =
        "none";
}
/* =========================================================
   PROCEDURES
========================================================= */
function loadProcedures() {
    const dep =
        document
        .getElementById(
            "dep"
        )
        .value
        .trim()
        .toUpperCase();
    const arr =
        document
        .getElementById(
            "arr"
        )
        .value
        .trim()
        .toUpperCase();
    fillProcedures(
        "sid",
        DATA.procedures?.[
            dep
        ]?.SIDs || {}
    );
    fillProcedures(
        "star",
        DATA.procedures?.[
            arr
        ]?.STARs || {}
    );
    fillRunways(
        "depRwy",
        DATA.airports?.[
            dep
        ]?.runways || []
    );
    fillRunways(
        "arrRwy",
        DATA.airports?.[
            arr
        ]?.runways || []
    );
}
function fillProcedures(
    id,
    procedures
) {
    const select =
        document.getElementById(
            id
        );
    select.innerHTML =
        `<option value="">
            Auto / None
        </option>`;
    for (
        const name
        of Object.keys(
            procedures
        )
    ) {
        const option =
            document.createElement(
                "option"
            );
        option.value =
            name;
        option.textContent =
            name;
        select.appendChild(
            option
        );
    }
}
function fillRunways(
    id,
    runways
) {
    const select =
        document.getElementById(
            id
        );
    select.innerHTML =
        `<option value="AUTO">
            Auto
        </option>`;
    for (
        const runway
        of runways
    ) {
        const option =
            document.createElement(
                "option"
            );
        option.value =
            runway;
        option.textContent =
            runway;
        select.appendChild(
            option
        );
    }
}
/* =========================================================
   AIRPORTS
========================================================= */
function openAirport(
    icao
) {
    const airport =
        DATA.airports?.[
            icao
        ];
    if (!airport) {
        return;
    }
    const charts =
        airport.charts ||
        DATA.charts?.[
            icao
        ];
    if (
        charts &&
        charts.general
    ) {
        document.getElementById(
            "chart"
        ).src =
            charts.general;
        document.getElementById(
            "chartTitle"
        ).textContent =
            `${icao} Chart`;
        document.getElementById(
            "chartPanel"
        ).style.display =
            "block";
    }
    else {
        alert(
            `${icao}\n\nAirport found.`
        );
    }
}
function closeChart() {
    document.getElementById(
        "chartPanel"
    ).style.display =
        "none";
}
/* =========================================================
   WAYPOINT
========================================================= */
function waypointInfo(
    name,
    data
) {
    const connections =
        data.neighbors ||
        data.connections ||
        [];
    alert(
        `${name}\n\n` +
        `PTFS navigation point\n\n` +
        `Connections:\n` +
        connections.join(", ")
    );
}
